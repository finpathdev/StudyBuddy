<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyBuddy — free AP, SAT & ACT studying</title>
<meta name="description" content="Free study platform for AP classes, SAT and ACT. Study guides, flashcards, quizzes, timed practice tests, and an AI that quizzes you on your own notes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%2316232B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='32' cy='32' r='28'/%3E%3Cpath d='M17 22.5 L21.5 15 L27 20M47 22.5 L42.5 15 L37 20'/%3E%3Ccircle cx='24.5' cy='28' r='7.5'/%3E%3Ccircle cx='39.5' cy='28' r='7.5'/%3E%3Cpath d='M32 32.5 L29.5 36.5 L32 38 L34.5 36.5Z'/%3E%3Cpath d='M17.5 30.5C15.5 41 21 50 32 50C43 50 48.5 41 46.5 30.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   StudyBuddy — design tokens
   Direction: index card + highlighter. Cool oat canvas, ruled
   paper cards, red margin rule, highlighter-stroke progress.
   ============================================================ */
:root{
  --canvas:#E6E8E1;
  --canvas-2:#DDE0D7;
  --paper:#FCFCF9;
  --ink:#16232B;
  --ink-soft:#5C6B72;
  --ink-faint:#93A0A6;
  --rule:#A9C3D2;
  --margin:#CF5945;
  --highlight:#F2E14C;
  --green:#2E7D5B;
  --line:rgba(22,35,43,.14);
  --shadow:0 1px 0 rgba(22,35,43,.06), 0 10px 24px -18px rgba(22,35,43,.5);
  --radius:14px;
  --blend:multiply;
}
[data-theme="night"]{
  --canvas:#12181C;
  --canvas-2:#0D1216;
  --paper:#1B2429;
  --ink:#E8EDEC;
  --ink-soft:#9AABB2;
  --ink-faint:#6B7C84;
  --rule:#33505F;
  --margin:#E2705C;
  --highlight:#C8B92E;
  --green:#4FBA8B;
  --line:rgba(232,237,236,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -20px #000;
  --blend:screen;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:'Karla',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.2vw,2.9rem)}
h2{font-size:clamp(1.35rem,2.6vw,1.85rem)}
h3{font-size:1.12rem}
p{margin:0 0 .8em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--margin);outline-offset:2px;border-radius:4px}
::selection{background:var(--highlight);color:#16232B}

/* eyebrow / utility type ------------------------------------ */
.eyebrow{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 .5rem;display:block;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* highlighter stroke ---------------------------------------- */
.hl{position:relative;display:inline;z-index:0}
.hl::after{
  content:'';position:absolute;left:-.12em;right:-.12em;top:.12em;bottom:.02em;
  background:var(--highlight);mix-blend-mode:var(--blend);
  border-radius:.4em .7em .35em .6em;transform:rotate(-.7deg);z-index:-1;
}

/* ============================ shell ======================== */
.app{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;padding:22px 14px 24px;
  border-right:1px solid var(--line);
  background:var(--canvas-2);
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;text-decoration:none}
.brand-mark{width:36px;height:36px;flex:0 0 36px;display:block;color:var(--ink)}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:1.16rem;letter-spacing:-.02em}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:16px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  text-decoration:none;color:var(--ink-soft);font-weight:600;font-size:.93rem;
  border:1px solid transparent;
}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a.on{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.nav a .ico{width:18px;text-align:center;opacity:.85;font-size:1rem}
.rail-foot{margin-top:auto;padding:18px 10px 0;font-size:.76rem;color:var(--ink-faint);line-height:1.4}

.main{flex:1;min-width:0;padding:34px clamp(16px,3.4vw,44px) 96px;max-width:1180px}
.page-head{margin-bottom:26px;position:relative;padding-left:18px}
.page-head::before{content:'';position:absolute;left:0;top:.15em;bottom:.15em;width:2px;background:var(--margin);opacity:.85;border-radius:2px}
.page-head p{color:var(--ink-soft);max-width:62ch;margin:.5rem 0 0}

/* mobile tabs ------------------------------------------------ */
.tabbar{display:none}
@media (max-width:860px){
  .rail{display:none}
  .main{padding:20px 16px 100px;max-width:100%}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--paper);border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar a{
    flex:1;text-align:center;text-decoration:none;color:var(--ink-faint);
    font-size:.62rem;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;
    text-transform:uppercase;display:flex;flex-direction:column;gap:3px;padding:4px 2px;border-radius:8px;
  }
  .tabbar a .ico{font-size:1.15rem}
  .tabbar a.on{color:var(--ink);background:var(--canvas-2)}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
}
@media (min-width:861px){.mobile-top{display:none}}

/* ============================ cards ======================== */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* buttons ---------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:10px 16px;border-radius:10px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-weight:700;font-size:.9rem;
  text-decoration:none;transition:transform .12s ease, box-shadow .12s ease;
  box-shadow:0 2px 0 rgba(22,35,43,.25);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none;font-weight:600}
.btn.ghost:hover{border-color:var(--ink);background:var(--paper)}
.btn.mark{background:var(--highlight);color:#16232B;border-color:transparent;box-shadow:0 2px 0 rgba(22,35,43,.2)}
.btn.red{background:var(--margin);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);font-size:.78rem;font-weight:600;
  color:var(--ink-soft);cursor:pointer;text-decoration:none;
}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{
  font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;background:var(--canvas-2);color:var(--ink-soft);border:1px solid var(--line);
}

/* inputs ----------------------------------------------------- */
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);font-size:.94rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.6}
label.fld{display:block;margin-bottom:14px}
label.fld span{display:block;font-weight:700;font-size:.84rem;margin-bottom:5px}
label.fld small{color:var(--ink-faint);font-weight:400;display:block;margin-top:5px;font-size:.78rem}

/* highlighter progress -------------------------------------- */
.meter{height:12px;background:var(--canvas-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.meter i{
  display:block;height:100%;background:var(--highlight);
  border-radius:2px 8px 4px 7px;transform:rotate(-.35deg) scaleY(1.25);transform-origin:left center;
  mix-blend-mode:var(--blend);transition:width .5s cubic-bezier(.2,.7,.3,1);
}
.meter.good i{background:var(--green);mix-blend-mode:normal;opacity:.85}

/* stat block ------------------------------------------------- */
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:'IBM Plex Mono',monospace;font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}

/* course tile ------------------------------------------------ */
.tile{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px 22px;box-shadow:var(--shadow);text-decoration:none;display:block;
  position:relative;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease;
}
.tile::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--tcolor,var(--margin));opacity:.75}
.tile:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(22,35,43,.06),0 18px 30px -20px rgba(22,35,43,.6)}
.tile h3{margin-bottom:4px}
.tile .blurb{color:var(--ink-soft);font-size:.85rem;margin:0 0 12px}
.tile .foot{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}

/* study guide ------------------------------------------------ */
.guide h3{margin:26px 0 8px;padding-left:14px;position:relative}
.guide h3::before{content:'';position:absolute;left:0;top:.25em;bottom:.25em;width:2px;background:var(--rule)}
.guide ul{margin:0 0 4px;padding-left:20px}
.guide li{margin-bottom:7px}
.guide li b{background:linear-gradient(transparent 62%,var(--highlight) 62%)}
[data-theme="night"] .guide li b{background:none;color:var(--highlight)}
/* in night mode a solid highlighter block kills contrast — use a stroke instead */
[data-theme="night"] .hl::after{
  top:auto;bottom:.02em;height:.28em;background:var(--highlight);
  mix-blend-mode:normal;opacity:.85;border-radius:2px;
}
[data-theme="night"] .meter i{mix-blend-mode:normal;opacity:.9}

/* ====================== FLASHCARD (signature) =============== */
.deck-wrap{max-width:640px;margin:0 auto}
.fcard{
  perspective:1600px;height:min(56vh,380px);margin-bottom:18px;cursor:pointer;
}
.fcard-inner{
  position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);
  transform-style:preserve-3d;
}
.fcard.flipped .fcard-inner{transform:rotateX(180deg)}
.fface{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 2px 0 var(--canvas-2),0 3px 0 var(--line),0 20px 34px -24px rgba(22,35,43,.7);
  display:flex;flex-direction:column;justify-content:center;
  padding:34px 30px 30px 52px;overflow:auto;
  background-image:repeating-linear-gradient(transparent,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 46px;
}
.fface::before{content:'';position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.55}
.fface .ftag{position:absolute;top:12px;left:52px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.fface .ftext{font-family:'Fraunces',serif;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.6;font-weight:400}
.fback{transform:rotateX(180deg)}
.fback .ftext{font-family:'Karla',sans-serif;font-size:clamp(1rem,2.2vw,1.15rem);line-height:1.75}
.deck-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-faint)}

/* quiz ------------------------------------------------------- */
.qbox{max-width:760px}
.qstem{font-size:1.08rem;font-weight:600;margin:6px 0 18px;line-height:1.5}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  padding:13px 15px;margin-bottom:9px;border-radius:11px;border:1px solid var(--line);
  background:var(--paper);transition:border-color .12s ease,background .12s ease;
}
.opt:hover:not([disabled]){border-color:var(--ink-soft)}
.opt .k{
  flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;
}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--paper))}
.opt.right .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--margin);background:color-mix(in srgb,var(--margin) 9%,var(--paper))}
.opt.wrong .k{background:var(--margin);color:#fff;border-color:var(--margin)}
.opt.picked{border-color:var(--ink)}
.why{
  border-left:2px solid var(--rule);padding:2px 0 2px 14px;margin:14px 0 18px;
  color:var(--ink-soft);font-size:.93rem;
}
.why b{color:var(--ink)}
.qprog{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.qprog i{width:22px;height:5px;border-radius:3px;background:var(--canvas-2);border:1px solid var(--line)}
.qprog i.done{background:var(--ink);border-color:var(--ink)}
.qprog i.miss{background:var(--margin);border-color:var(--margin)}
.qprog i.now{background:var(--highlight);border-color:var(--highlight)}

/* timer ------------------------------------------------------ */
.timer{
  font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600;
  padding:6px 12px;border-radius:8px;background:var(--canvas-2);border:1px solid var(--line);
}
.timer.low{background:var(--margin);color:#fff;border-color:var(--margin)}

/* chat ------------------------------------------------------- */
.chat{display:flex;flex-direction:column;gap:12px;max-height:min(52vh,460px);overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:86%;padding:12px 15px;border-radius:14px;font-size:.94rem;line-height:1.6;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-faint);background:none;text-align:center}

/* ============== STUDY GUIDE (studious reading view) ========= */
.readprog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--highlight);z-index:200;transition:width .1s linear}
.guide-layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:960px){.guide-layout{grid-template-columns:1fr;gap:18px}.guide-toc{position:static !important;max-height:none}}
.guide-toc{position:sticky;top:26px}
.guide-toc .eyebrow{margin-bottom:10px}
.guide-toc a{
  display:block;padding:7px 0 7px 13px;font-size:.85rem;color:var(--ink-soft);
  text-decoration:none;border-left:2px solid var(--line);line-height:1.35;
}
.guide-toc a:hover{color:var(--ink);border-color:var(--ink-soft)}
.guide-toc a.on{color:var(--ink);border-color:var(--margin);font-weight:600}
.guide-page{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:40px 44px 40px 58px;position:relative;overflow:hidden;
}
.guide-page::before{content:'';position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.4}
@media (max-width:700px){.guide-page{padding:26px 20px 26px 30px}.guide-page::before{left:16px}}
.guide-page .owl-wm{position:absolute;right:-26px;top:-26px;width:150px;color:var(--ink);opacity:.045;pointer-events:none}
.guide-page .lede{
  font-family:'Newsreader',Georgia,serif;font-size:1.16rem;line-height:1.6;color:var(--ink-soft);
  border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px;
}
.guide-sec{scroll-margin-top:26px}
.guide-sec h3{
  font-family:'Fraunces',serif;font-size:1.28rem;margin:34px 0 12px;padding-left:0;
  display:flex;align-items:baseline;gap:11px;
}
.guide-sec h3::before{content:none}
.guide-sec .num{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--margin);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:0 0 auto;font-weight:500;
}
.guide-sec ul{list-style:none;margin:0;padding:0}
.guide-sec li{
  font-family:'Newsreader',Georgia,serif;font-size:1.06rem;line-height:1.72;
  margin-bottom:11px;padding-left:19px;position:relative;max-width:68ch;
}
.guide-sec li::before{content:'';position:absolute;left:0;top:.68em;width:7px;height:1.5px;background:var(--rule)}
.guide-sec li b{font-weight:600;background:linear-gradient(transparent 62%,var(--highlight) 62%)}
[data-theme="night"] .guide-sec li b{background:none;color:var(--highlight)}
.guide-sec li i{font-style:italic}
.keyterms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.keyterm{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--canvas-2)}
.keyterm b{display:block;font-size:.9rem;margin-bottom:3px}
.keyterm span{font-size:.82rem;color:var(--ink-soft);line-height:1.5}

/* ==================== ASK DOCK ============================== */
.ask-fab{
  position:fixed;right:22px;bottom:22px;z-index:120;display:inline-flex;align-items:center;gap:9px;
  padding:12px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
}
.ask-fab svg{width:19px;height:19px}
.ask-fab:hover{transform:translateY(-1px)}
@media (max-width:860px){.ask-fab{bottom:78px;right:14px;padding:11px 15px;font-size:.84rem}}
.ask-panel{
  position:fixed;right:22px;bottom:22px;z-index:130;width:min(400px,calc(100vw - 28px));
  max-height:min(620px,calc(100vh - 44px));display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 24px 60px -22px rgba(0,0,0,.55);overflow:hidden;
}
@media (max-width:860px){.ask-panel{bottom:70px;right:8px;left:8px;width:auto;max-height:calc(100vh - 130px)}}
.ask-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:var(--canvas-2)}
.ask-head .owl{width:24px;height:24px;color:var(--ink);flex:0 0 24px}
.ask-head b{font-size:.9rem;display:block;line-height:1.2}
.ask-head small{font-size:.72rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}
.ask-head button{margin-left:auto;background:none;border:0;cursor:pointer;font-size:1.15rem;color:var(--ink-faint);padding:2px 4px;line-height:1}
.ask-body{flex:1;overflow-y:auto;padding:14px 15px;display:flex;flex-direction:column;gap:11px;min-height:120px}
.ask-foot{border-top:1px solid var(--line);padding:11px 12px;display:flex;gap:8px;background:var(--canvas-2)}
.ask-foot input{flex:1;border-radius:9px}
.ask-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ask-suggest button{
  font-size:.78rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink-soft);cursor:pointer;text-align:left;
}
.ask-suggest button:hover{border-color:var(--ink-soft);color:var(--ink)}
.ask-src{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px;display:block}

/* ============ WORKSHEET / PRINT OUTPUT ===================== */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:36px 40px;box-shadow:var(--shadow);max-width:860px;margin:0 auto}
.sheet-head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:1.4rem}
.sheet-head .who{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-faint);text-align:right;line-height:2.1}
.sheet-head .who u{display:inline-block;min-width:150px;text-decoration:none;border-bottom:1px solid var(--ink-faint)}
.sheet-sub{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:22px}
.wcols{column-count:2;column-gap:34px;column-rule:1px solid var(--line)}
@media (max-width:700px){.wcols{column-count:1}}
.wrow{break-inside:avoid;margin-bottom:13px;padding-bottom:11px;border-bottom:1px dotted var(--line)}
.wrow b{display:block;font-size:.92rem;margin-bottom:3px}
.wrow span{font-size:.84rem;color:var(--ink-soft);line-height:1.5}
.wrow .blank{display:block;border-bottom:1px solid var(--ink-faint);height:1.15em;margin-top:5px}
.wq{break-inside:avoid;margin-bottom:16px}
.wq .stem{font-weight:600;font-size:.92rem;margin-bottom:6px}
.wq ol{margin:0;padding-left:22px;font-size:.86rem;color:var(--ink-soft)}
.wq ol li{margin-bottom:2px}
.cutcard{
  break-inside:avoid;border:1px dashed var(--ink-faint);border-radius:6px;
  padding:14px 15px;margin-bottom:11px;min-height:88px;display:flex;flex-direction:column;justify-content:center;
}
.cutcard b{font-size:.95rem;display:block}
.cutcard span{font-size:.8rem;color:var(--ink-soft);margin-top:5px;display:block}
.answerkey{page-break-before:always;margin-top:30px;border-top:2px solid var(--ink);padding-top:16px}

/* ---- Leitner boxes ---- */
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lbox{border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center;background:var(--paper)}
.lbox b{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;display:block;line-height:1.1}
.lbox span{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.lbox.b1{border-bottom:3px solid var(--margin)}
.lbox.b2{border-bottom:3px solid var(--highlight)}
.lbox.b3{border-bottom:3px solid var(--green)}
.due-pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--margin);color:#fff}

/* ---- accessibility ---- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fcard:focus-visible{outline:3px solid var(--margin);outline-offset:6px;border-radius:14px}
.skip-link{position:absolute;left:-9999px;top:8px;z-index:400;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700}
.skip-link:focus{left:8px}

/* ======================= PRINT ============================== */
@media print{
  .rail,.tabbar,.ask-fab,.ask-panel,.readprog,.mobile-top,.guide-toc,.crumb,.btn,.chip,.noprint{display:none !important}
  .sheet{border:0;box-shadow:none;padding:0;max-width:100%}
  .wrow,.wq,.cutcard{break-inside:avoid}
  .cutcard{border:1px dashed #999}
  .answerkey{page-break-before:always}
  @page{margin:0.6in}
  body{background:#fff}
  .main{padding:0;max-width:100%}
  .guide-page{border:0;box-shadow:none;padding:0}
  .guide-page::before,.owl-wm{display:none}
  .guide-layout{display:block}
  .guide-sec li b{background:none;text-decoration:underline}
  .keyterm{break-inside:avoid}
  a[href]::after{content:''}
}

/* misc ------------------------------------------------------- */
.empty{text-align:center;padding:44px 20px;color:var(--ink-soft)}
.empty .big{font-size:2.2rem;margin-bottom:8px;opacity:.5}
.note{background:var(--canvas-2);border:1px dashed var(--line);border-radius:11px;padding:13px 15px;font-size:.86rem;color:var(--ink-soft)}
.note b{color:var(--ink)}
.divide{height:1px;background:var(--line);margin:26px 0;border:0}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;display:block;text-decoration:none}
.crumb:hover{color:var(--ink)}
.hidden{display:none !important}
.center{text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .3s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .fcard-inner{transition:none}
}
.score-ring{
  width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;
  background:conic-gradient(var(--highlight) calc(var(--p)*1%), var(--canvas-2) 0);
}
.score-ring div{
  width:104px;height:104px;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:1.8rem;font-weight:600;
}
</style>

function addUnits(cid, units) {
  const c = COURSES.find(x => x.id === cid);

}

      c.fmt = c.id === 'sat' ? { q: 54, min: 64 } : { q: 75, min: 45 };
    }
    if (!c.group) c.group = 'Other';
  });
})();
</script>
<script>
/* ============================================================
   StudyBuddy app
   ============================================================ */

/* ---------- storage that never throws ---------- */
const store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('__sb', '1'); localStorage.removeItem('__sb'); }
  catch (e) { ok = false; }
  return {
    ok,
    get(k, d) {
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; }
    },
    wipe() { try { if (ok) ['sb.progress','sb.cards','sb.streak','sb.custom','sb.last'].forEach(k => localStorage.removeItem(k)); } catch (e) {} mem = {}; }
  };
})();

const S = {
  get progress() { return store.get('sb.progress', {}); },
  set progress(v) { store.set('sb.progress', v); },
  get cards() { return store.get('sb.cards', {}); },
  set cards(v) { store.set('sb.cards', v); },
  get custom() { return store.get('sb.custom', []); },
  set custom(v) { store.set('sb.custom', v); },
  get cfg() { return store.get('sb.cfg', { theme: 'day', key: '', model: 'claude-sonnet-4-6' }); },
  set cfg(v) { store.set('sb.cfg', v); }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const findCourse = id => COURSES.concat(customCourses()).find(c => c.id === id);
const findUnit = (c, uid) => c && c.units.find(u => u.id === uid);
const customCourses = () => S.custom.filter(d => !d.courseId).map(d => ({
  id: 'my-' + d.id, name: d.name, short: d.name, color: '#4B7F8C', exam: 'Mine',
  blurb: d.note || 'Made from your own notes.', mine: true, group: 'Made from your notes',
  units: [{ id: 'u1', title: d.name, guide: d.guide || [], cards: d.cards || [], quiz: d.quiz || [] }]
}));

function unitKey(cid, uid) { return cid + '/' + uid; }
function mastery(cid, uid) { const p = S.progress[unitKey(cid, uid)]; return p ? p.best : null; }
function courseMastery(c) {
  const vals = c.units.map(u => mastery(c.id, u.id)).filter(v => v !== null);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / c.units.length);
}
function recordScore(cid, uid, pct) {
  const p = S.progress, k = unitKey(cid, uid);
  const prev = p[k] || { best: 0, tries: 0 };
  p[k] = { best: Math.max(prev.best, pct), last: pct, tries: prev.tries + 1, when: today() };
  S.progress = p;
  bumpStreak();
}
function bumpStreak() {
  const st = store.get('sb.streak', { last: '', n: 0 });
  const t = today();
  if (st.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  st.n = st.last === y ? st.n + 1 : 1;
  st.last = t;
  store.set('sb.streak', st);
}
function streakCount() {
  const st = store.get('sb.streak', { last: '', n: 0 });
  if (!st.last) return 0;
  const t = today(), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  return (st.last === t || st.last === y) ? st.n : 0;
}
function allQuestions(filter) {
  const out = [];
  COURSES.concat(customCourses()).forEach(c => {
    if (filter && filter !== c.id) return;
    c.units.forEach(u => (u.quiz || []).forEach(q => out.push(Object.assign({}, q, { _c: c.id, _u: u.id, _cn: c.short, _un: u.title }))));
  });
  return out;
}

/* ---------- navigation ---------- */
const NAV = [

}

function applyTheme() {

}

}

/* ============================================================

/* ---------------- dashboard ---------------- */
function vDashboard() {

  })() : `<div class="card">

  return topbar() + `

  </div>

  <div class="grid g2" style="margin-bottom:22px">

      <div class="row"><a class="btn mark sm" href="#/tests">Take a timed test</a><button class="chip" onclick="toggleTheme()">${S.cfg.theme === 'night' ? '☀ Day mode' : '☾ Night mode'}</button></div>
    </div>
  </div>

  <div class="spread" style="margin-bottom:10px">
    <span class="eyebrow" style="margin:0">Ready to study now</span>
    <a class="chip" href="#/courses">All ${all.length} courses →</a>

  <div class="grid g3">${all.filter(c => !c.outlineOnly).map(courseTile).join('')}</div>`;
}

function courseTile(c) {
  const m = courseMastery(c);
  const nUnits = (c.outline || []).length || c.units.length;
  if (c.outlineOnly) {

  return `<a class="tile" href="#/course/${c.id}" style="--tcolor:${c.color}">

}

/* ---------------- course library ---------------- */
const GROUP_ORDER = ['College entrance exams', 'History & Social Science', 'Sciences', 'Math & Computer Science', 'English', 'World Languages', 'Arts', 'Made from your notes', 'Other'];
function vCourses() {

function setFilter(f) { store.set('sb.filter', f); render(); }

/* ---------------- one course ---------------- */
function vCourse(cid) {

/* ---------------- study guide ---------------- */
function vGuide(cid, uid) {
  const c = findCourse(cid), u = findUnit(c, uid);
  if (!u) return notFound();
  store.set('sb.last', { c: cid, u: uid });
  if (!(u.guide || []).length) return topbar() + `<a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a><div class="empty"><div class="big">▤</div>No written guide for this deck yet — try the flashcards.</div>`;
  const terms = (u.cards || []).slice(0, 6);
  const bullets = u.guide.reduce((n, sec) => n + sec.points.length, 0);
  const mins = Math.max(2, Math.round(bullets * 0.28));
  setTimeout(initGuideScroll, 0);
  return topbar() + `
  <div class="readprog" id="readprog"></div>
  <a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a>

    <nav class="guide-toc">

      <div style="margin-top:18px;display:flex;flex-direction:column;gap:7px">

      ${u.guide.map((sec, i) => `<section class="guide-sec" id="sec${i}">
        <h3><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${esc(sec.h)}</span></h3>
        <ul>${sec.points.map(pt => `<li>${pt}</li>`).join('')}</ul>

      ${terms.length ? `<hr class="divide">

function jumpSec(e, i) {

}
function initGuideScroll() {
  const bar = $('#readprog');
  const secs = [...document.querySelectorAll('.guide-sec')];
  const links = [...document.querySelectorAll('.guide-toc a[data-sec]')];
  if (!bar || !secs.length) return;
  const onScroll = () => {
    if (!document.body.contains(bar)) { window.removeEventListener('scroll', onScroll); return; }
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + '%';
    let active = 0;
    secs.forEach((sec, i) => { if (sec.getBoundingClientRect().top < 140) active = i; });
    links.forEach((a, i) => a.classList.toggle('on', i === active));
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ---------------- flashcards ---------------- */
let DECK = null;
function vCards(cid, uid) {
  const c = findCourse(cid), u = findUnit(c, uid);
  if (!u || !(u.cards || []).length) return notFound();
  store.set('sb.last', { c: cid, u: uid });
  DECK = { cid, uid, i: 0, flipped: false, order: shuffle(u.cards.map((_, i) => i)), cards: u.cards, missed: [] };
  setTimeout(paintCard, 0);
  return topbar() + `
  <a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a>
  <div class="page-head fade"><span class="eyebrow">Flashcards</span><h1>${esc(u.title)}</h1></div>
  <div class="deck-wrap" id="deckwrap"></div>`;
}
function paintCard() {
  const w = $('#deckwrap'); if (!w || !DECK) return;
  if (DECK.i >= DECK.order.length) {
    const known = DECK.order.length - DECK.missed.length;
    w.innerHTML = `<div class="card center fade">
      <span class="eyebrow">Deck finished</span>
      <div class="score-ring" style="--p:${Math.round(known / DECK.order.length * 100)}"><div>${known}/${DECK.order.length}</div></div>
      <p style="color:var(--ink-soft)">${DECK.missed.length ? `You marked ${DECK.missed.length} card${DECK.missed.length > 1 ? 's' : ''} for review.` : 'You knew every card. Go take the quiz.'}</p>
      <div class="row center" style="justify-content:center;margin-top:8px">
        ${DECK.missed.length ? `<button class="btn" onclick="redoMissed()">Review the ${DECK.missed.length} missed</button>` : ''}
        ${DECK.cid ? `<a class="btn ${DECK.missed.length ? 'ghost' : ''}" href="#/study/${DECK.cid}/${DECK.uid}/quiz">Take the quiz</a>` : `<a class="btn ghost" href="#/review">Back to review</a>`}
        <button class="btn ghost" onclick="location.reload()">Shuffle and restart</button>
      </div>
    </div>`;
    return;
  }
  const idx = DECK.order[DECK.i], card = DECK.cards[idx];
  w.innerHTML = `
    <div class="deck-meta">
      <span>Card ${DECK.i + 1} of ${DECK.order.length}${DECK.labels ? ' · ' + esc(DECK.labels[DECK.order[DECK.i]] || '') : ''}</span>
      <span>${DECK.missed.length} to review</span>
    </div>
    <div class="fcard" id="fc" tabindex="0" role="button" aria-expanded="false"
         aria-label="Flashcard ${DECK.i + 1} of ${DECK.order.length}. Term: ${esc(card[0])}. Press Enter or Space to reveal the definition."
         onclick="flipCard()" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();flipCard();}">
      <div class="fcard-inner">
        <div class="fface" aria-hidden="${DECK.flipped}"><span class="ftag">Term</span><div class="ftext">${esc(card[0])}</div></div>
        <div class="fface fback" aria-hidden="${!DECK.flipped}"><span class="ftag">Definition</span><div class="ftext">${esc(card[1])}</div></div>
      </div>
    </div>
    <p class="sr-only" id="fclive" aria-live="polite" role="status"></p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" onclick="flipCard()">Flip card</button>
      <button class="btn ghost" onclick="markCard(false)">Need review</button>
      <button class="btn mark" onclick="markCard(true)">I knew it</button>
    </div>
    <p class="center" style="color:var(--ink-faint);font-size:.78rem;margin-top:12px">Enter or Space flips · ← need review · → knew it</p>`;
  const fc = $('#fc');
  if (fc && DECK.autofocus) fc.focus();
  const live = $('#fclive');
  if (live && DECK.autofocus) live.textContent = `Card ${DECK.i + 1} of ${DECK.order.length}. Term: ${DECK.cards[DECK.order[DECK.i]][0]}`;
}
function flipCard() {
  DECK.flipped = !DECK.flipped;
  const el = $('#fc');
  el.classList.toggle('flipped');
  el.setAttribute('aria-expanded', String(DECK.flipped));
  const card = DECK.cards[DECK.order[DECK.i]];
  el.querySelectorAll('.fface')[0].setAttribute('aria-hidden', String(DECK.flipped));
  el.querySelectorAll('.fface')[1].setAttribute('aria-hidden', String(!DECK.flipped));
  const live = $('#fclive');
  if (live) live.textContent = DECK.flipped ? 'Definition: ' + card[1] : 'Term: ' + card[0];
}
function markCard(known) {
  tally('cards');
  if (!known) DECK.missed.push(DECK.order[DECK.i]);
  DECK.i++; DECK.flipped = false;
  DECK.autofocus = document.activeElement && document.activeElement.id === 'fc';
  paintCard(); bumpStreak();
}
function redoMissed() { DECK.order = shuffle(DECK.missed); DECK.missed = []; DECK.i = 0; paintCard(); }

/* ---------------- quiz ---------------- */
let QZ = null;
function prepQuestions(list) {
  return shuffle(list).map(q => {
    const pairs = q.c.map((t, i) => ({ t, correct: i === q.a }));
    const mixed = shuffle(pairs);

/* ============================================================
   AI TUTOR — works with or without an API key
   ============================================================ */
const STOP = new Set('the a an and or but of to in for on with is are was were be been being that this these those it its as at by from into than then so such not no can may might will would should could have has had do does did which who whom whose what when where why how all any both each few more most other some only own same too very just also about above after again against because before below between during further here once other over under until while'.split(' '));

function localCards(text) {
  const out = [], seen = new Set();
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const seps = [/\s+[—–]\s+/, /\s+-\s+/, /:\s+/, /\s+=\s+/, /\s+\u2013\s+/];
  lines.forEach(line => {
    const clean = line.replace(/^[-*•\d.)\s]+/, '').trim();
    for (const sep of seps) {
      const m = clean.split(sep);
      if (m.length >= 2 && m[0].length >= 2 && m[0].length <= 70 && m.slice(1).join(' ').length > 8) {
        const front = m[0].trim(), back = m.slice(1).join(' ').trim();
        if (!seen.has(front.toLowerCase())) { seen.add(front.toLowerCase()); out.push([front, back]); }
        return;
      }
    }
  });
  if (out.length >= 4) return out;
  /* fall back to cloze deletion on sentences */
  const sentences = text.replace(/\n/g, ' ').split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.split(' ').length >= 7);
  sentences.slice(0, 40).forEach(s => {
    const words = s.split(/\s+/);
    let best = null;
    words.forEach((w, i) => {
      const bare = w.replace(/[^A-Za-z-]/g, '');
      if (bare.length < 5 || STOP.has(bare.toLowerCase())) return;
      const score = bare.length + (/^[A-Z]/.test(bare) && i > 0 ? 6 : 0);
      if (!best || score > best.score) best = { w: bare, score, i };
    });
    if (!best) return;
    const blanked = words.map((w, i) => i === best.i ? '________' : w).join(' ');
    if (!seen.has(best.w.toLowerCase())) { seen.add(best.w.toLowerCase()); out.push([blanked, best.w]); }
  });
  return out;
}
function localQuiz(cards) {
  if (cards.length < 4) return [];
  return shuffle(cards).slice(0, 20).map(card => {
    const wrong = shuffle(cards.filter(c => c[0] !== card[0])).slice(0, 3).map(c => c[1]);
    if (wrong.length < 3) return null;
    const choices = shuffle([card[1], ...wrong]);
    return { q: card[0].includes('________') ? 'Fill in the blank: ' + card[0] : `Which best matches "${card[0]}"?`, c: choices, a: choices.indexOf(card[1]), why: `${card[0].includes('________') ? 'The missing term is' : card[0] + ' —'} ${card[1]}` };
  }).filter(Boolean);
}

async function askClaude(messages, system) {
  const cfg = S.cfg;
  const headers = { 'content-type': 'application/json' };
  if (cfg.key) {
    headers['x-api-key'] = cfg.key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers,
    body: JSON.stringify({ model: cfg.model || 'claude-sonnet-4-6', max_tokens: 2000, system, messages })
  });
  if (!r.ok) throw new Error('API returned ' + r.status);
  const d = await r.json();
  return (d.content || []).map(b => b.type === 'text' ? b.text : '').join('\n').trim();
}
function parseJSON(t) {
  const clean = t.replace(/```json|```/g, '').trim();
  const s = clean.indexOf('['), e = clean.lastIndexOf(']');
  const o = clean.indexOf('{'), oe = clean.lastIndexOf('}');
  try { return JSON.parse(clean); } catch (err) {}
  if (s > -1 && e > s) { try { return JSON.parse(clean.slice(s, e + 1)); } catch (err) {} }
  if (o > -1 && oe > o) { try { return JSON.parse(clean.slice(o, oe + 1)); } catch (err) {} }
  return null;
}

/* ---- spoken-style drilling ---- */
function pushMsg(role, content) {
  TUTOR.msgs.push({ role, content });
  const c = $('#chat');
  if (c) {
    if (TUTOR.msgs.length === 1) c.innerHTML = '';
    c.insertAdjacentHTML('beforeend', `<div class="msg ${role === 'user' ? 'me' : 'ai'} fade">${esc(content)}</div>`);
    c.scrollTop = c.scrollHeight;
  }
}
function startDrill() {
  const text = material();
  if (text.length < 60) { pushMsg('assistant', 'Paste some material into the box on the left first, then I can quiz you on it.'); return; }
  TUTOR.msgs = []; $('#chat').innerHTML = '';
  if (S.cfg.key) {
    TUTOR.mode = 'ai';
    TUTOR.api = [];
    pushMsg('assistant', 'Got it. I will ask one question at a time. Answer in your own words and I will tell you what you missed.');
    aiTurn('Start quizzing me on this material. Ask your first question.');
  } else {
    TUTOR.mode = 'local';
    TUTOR.drill = shuffle(localCards(text)).slice(0, 20);
    TUTOR.di = 0;
    if (!TUTOR.drill.length) { pushMsg('assistant', 'I could not pull terms out of that. Try writing a few lines as "term — definition" and press the button again.'); return; }
    pushMsg('assistant', `Ready — ${TUTOR.drill.length} questions from your notes. Answer in your own words.`);
    askLocal();
  }
}
function askLocal() {
  if (TUTOR.di >= TUTOR.drill.length) { pushMsg('assistant', 'That is the whole set. Press "Quiz me out loud" to run it again, or save it as a deck on the left.'); return; }
  const c = TUTOR.drill[TUTOR.di];
  pushMsg('assistant', c[0].includes('________') ? `Fill in the blank: ${c[0]}` : `What does this mean: ${c[0]}?`);
}
function gradeLocal(answer, correct) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w));
  const a = new Set(norm(answer)), b = norm(correct);
  if (!b.length) return 0;
  const hit = b.filter(w => a.has(w) || [...a].some(x => x.length > 4 && (x.startsWith(w.slice(0, 5)) || w.startsWith(x.slice(0, 5))))).length;
  return hit / b.length;
}
async function sendChat() {
  const inp = $('#chatin'); const t = inp.value.trim();
  if (!t) return;
  inp.value = '';
  pushMsg('user', t);
  if (TUTOR.mode === 'local' && TUTOR.drill) {
    const c = TUTOR.drill[TUTOR.di];
    if (!c) return;
    const score = gradeLocal(t, c[1]);
    pushMsg('assistant', score >= 0.5 ? `Right — ${c[1]}` : score >= 0.25 ? `Close. The full answer: ${c[1]}` : `Not quite. ${c[0].includes('________') ? 'The missing term is' : 'It means'}: ${c[1]}`);
    TUTOR.di++; bumpStreak();
    setTimeout(askLocal, 350);
    return;
  }
  if (S.cfg.key) { aiTurn(t); return; }
  pushMsg('assistant', 'Press "Quiz me out loud" to start a round from your notes, or add an API key in Settings for open-ended conversation.');
}
async function aiTurn(userText) {
  const c = $('#chat');
  c.insertAdjacentHTML('beforeend', `<div class="msg ai" id="think"><span class="spin"></span></div>`);
  c.scrollTop = c.scrollHeight;
  try {
    /* the API requires an alternating history that begins with a user turn */
    TUTOR.api.push({ role: 'user', content: userText });
    const history = TUTOR.api.slice(-12);
    while (history.length && history[0].role !== 'user') history.shift();
    const reply = await askClaude(history,
      `You are a patient tutor quizzing a student on material they provided. Ask ONE question at a time. After each answer, say briefly whether it was right, fill in what was missing, then ask the next question. Keep replies under 90 words. Never dump the whole answer key at once.\n\nThe student's material:\n${TUTOR.material.slice(0, 12000)}`);
    document.getElementById('think')?.remove();
    TUTOR.api.push({ role: 'assistant', content: reply || '…' });
    pushMsg('assistant', reply || 'No reply came back. Try again.');
    bumpStreak();
  } catch (e) {
    document.getElementById('think')?.remove();
    TUTOR.api.pop();
    pushMsg('assistant', `Could not reach the API (${e.message}). Check your key in Settings, or clear it to use the built-in generator instead.`);
  }
}

  </div>`;
}
function setTheme(t) { const c = S.cfg; c.theme = t; S.cfg = c; applyTheme(); render(); }
function saveKey() { const c = S.cfg; c.key = $('#keyin').value.trim(); c.model = $('#modelin').value.trim() || 'claude-sonnet-4-6'; S.cfg = c; render(); }
function clearKey() { const c = S.cfg; c.key = ''; S.cfg = c; render(); }
function exportData() {

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'studybuddy-data.json'; a.click();

function notFound() {
  return topbar() + `<div class="empty"><div class="big">◌</div><h2>Nothing here</h2><p>That page moved or never existed.</p><a class="btn" href="#/">Back to dashboard</a></div>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
function render() {
  if (typeof syncCustomUnits === 'function') syncCustomUnits();
  const raw = (location.hash || '#/').replace(/^#\/?/, '');

  }

  else if (parts[0] === 'assign') html = vAssign();
  else if (parts[0] === 'import') html = vImport();
  else if (parts[0] === 'account') html = vAccount();
  else if (parts[0] === 'group') html = vGroup();
  else if (parts[0] === 'print') html = vPrint(parts[1], parts[2], parts[3]);
  else if (parts[0] === 'exam') html = vMasterReview(parts[1]);
  else if (parts[0] === 'stats') html = vStats();
  else if (parts[0] === 'tests') html = vTests();

document.addEventListener('keydown', e => {
  if (!DECK) return;

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

     standard button behaviour; without this guard it would fire twice and cancel out */
  const onCard = e.target.closest && e.target.closest('.fcard');
  if (e.code === 'Space' && !onCard) { e.preventDefault(); flipCard(); }
  if (e.key === 'ArrowRight') markCard(true);

<script>
/* ============================================================
   ASK DOCK
   A tutor that lives on the study pages and answers from the
   material in front of the student. Works with no API key by
   searching the unit's own guide and flashcards; with a key it
   answers in full sentences, still grounded in the same text.
   ============================================================ */
const OWL = `<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" stroke-width="2.2"/><path d="M17 22.5 21.5 15 27 20M47 22.5 42.5 15 37 20"/><circle cx="24.5" cy="28" r="7.5"/><circle cx="39.5" cy="28" r="7.5"/><circle cx="24.5" cy="28" r="2.3" fill="currentColor" stroke="none"/><circle cx="39.5" cy="28" r="2.3" fill="currentColor" stroke="none"/><path d="M32 32.5 29.5 36.5 32 38 34.5 36.5Z"/><path d="M17.5 30.5C15.5 41 21 50 32 50s16.5-9 14.5-19.5"/><path d="M22 38c-1 5 1.5 8.5 4 9.5M42 38c1 5-1.5 8.5-4 9.5"/></g></svg>`;

const ASK = { open: false, msgs: [], ctx: null, busy: false };

/* strip the <b>/<i> tags out of guide bullets for searching and prompting */
const plain = h => String(h).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();

function currentUnit() {
  const m = (location.hash || '').match(/^#\/study\/([^/?]+)\/([^/?]+)/);
  if (!m) return null;
  const c = findCourse(m[1]);
  const u = findUnit(c, m[2]);
  return u ? { c, u } : null;
}

/* ---------- keyword search over the unit, no API needed ---------- */
function tokens(s) {
  return plain(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w));
}
function scoreAgainst(qTokens, text) {
  const t = tokens(text);
  if (!t.length) return 0;
  const set = new Set(t);
  let hits = 0;
  qTokens.forEach(w => {
    if (set.has(w)) { hits += 1; return; }
    for (const x of set) {
      if (x.length > 4 && w.length > 4 && (x.startsWith(w.slice(0, 5)) || w.startsWith(x.slice(0, 5)))) { hits += 0.6; return; }
    }
  });
  return hits / Math.sqrt(qTokens.length || 1);
}
function localAnswer(ctx, question) {
  const q = tokens(question);
  if (!q.length) return { text: 'Ask about a term or idea from this unit and I will find it for you.', src: null };
  const hits = [];
  (ctx.u.cards || []).forEach(card => {
    /* a question naming a term should strongly prefer that term's card */
    const s = scoreAgainst(q, card[0]) * 2.2 + scoreAgainst(q, card[1]) * 0.7;
    if (s > 0) hits.push({ s, text: `${card[0]} — ${card[1]}`, src: 'flashcard' });
  });
  (ctx.u.guide || []).forEach(sec => sec.points.forEach(pt => {
    const s = scoreAgainst(q, pt) + scoreAgainst(q, sec.h) * 0.5;
    if (s > 0) hits.push({ s, text: plain(pt), src: 'study guide · ' + sec.h });
  }));
  hits.sort((a, b) => b.s - a.s);
  if (!hits.length || hits[0].s < 0.5) {
    return {
      text: `I could not find that in this unit. It may be covered elsewhere in ${ctx.c.name} — or add a Claude API key in Settings and I can explain it properly instead of just searching.`,
      src: null
    };
  }
  const top = hits.slice(0, 3).filter((h, i) => i === 0 || h.s > hits[0].s * 0.55);
  return { text: top.map(h => h.text).join('\n\n'), src: top[0].src };
}

/* ---------- grounded answer with a key ---------- */
async function apiAnswer(ctx, question) {
  const material = [
    `COURSE: ${ctx.c.name}`,
    `UNIT: ${ctx.u.title}`,
    '',
    'STUDY GUIDE:',
    ...(ctx.u.guide || []).map(sec => `## ${sec.h}\n` + sec.points.map(p => '- ' + plain(p)).join('\n')),
    '',
    'KEY TERMS:',
    ...(ctx.u.cards || []).map(c => `- ${c[0]}: ${c[1]}`)
  ].join('\n');
  const history = ASK.msgs.filter(m => m.role === 'user' || m.role === 'assistant').slice(-8);
  history.push({ role: 'user', content: question });
  while (history.length && history[0].role !== 'user') history.shift();
  return askClaude(history,
    `You are a tutor helping a high school or college student who is reading the study material below. Answer their question using this material first. If the answer is not in it, say so plainly in one sentence and then give a short correct answer from your own knowledge, clearly marked as outside the unit.

Rules: keep answers under 120 words. Use plain language. Give a concrete example when it helps. Never invent facts about the exam. If the student seems confused about a distinction, name both sides of it directly.

MATERIAL:
${material}`);
}

/* ---------- UI ---------- */
function afterRender() {
  document.getElementById('askfab')?.remove();
  document.getElementById('askpanel')?.remove();
  const ctx = currentUnit();
  if (!ctx) { ASK.open = false; ASK.ctx = null; return; }
  if (!ASK.ctx || ASK.ctx.u !== ctx.u) { ASK.msgs = []; ASK.ctx = ctx; }
  document.body.insertAdjacentHTML('beforeend', ASK.open ? askPanelHTML() : askFabHTML());
  if (ASK.open) paintAsk();
}
function askFabHTML() {
  return `<button class="ask-fab" id="askfab" onclick="toggleAsk(true)">${OWL}<span>Ask about this</span></button>`;
}
function askPanelHTML() {
  const ctx = ASK.ctx;
  return `<div class="ask-panel fade" id="askpanel">
    <div class="ask-head">
      <span class="owl">${OWL}</span>
      <span><b>Ask about this unit</b><small>${esc(ctx.u.title)}</small></span>
      <button onclick="toggleAsk(false)" title="Close">✕</button>
    </div>
    <div class="ask-body" id="askbody"></div>
    <div class="ask-foot">
      <input type="text" id="askin" placeholder="What does this mean?" onkeydown="if(event.key==='Enter')sendAsk()">
      <button class="btn sm" onclick="sendAsk()">Ask</button>
    </div>
  </div>`;
}
function toggleAsk(open) {
  ASK.open = open;
  afterRender();
  if (open) setTimeout(() => $('#askin')?.focus(), 60);
}
function paintAsk() {
  const b = $('#askbody'); if (!b) return;
  const ctx = ASK.ctx;
  if (!ASK.msgs.length) {
    const picks = shuffle((ctx.u.cards || []).map(c => c[0])).slice(0, 3);
    b.innerHTML = `<div class="msg ai">Ask me anything about <b>${esc(ctx.u.title)}</b>. I answer from the study guide and flashcards on this page${S.cfg.key ? '' : ', so I am looking things up rather than chatting — add a key in Settings for full explanations'}.</div>
      ${picks.length ? `<div class="ask-suggest">${picks.map(p => `<button onclick="askThis(${JSON.stringify('What is ' + p + '?').replace(/"/g, '&quot;')})">What is ${esc(p)}?</button>`).join('')}</div>` : ''}`;
    return;
  }
  b.innerHTML = ASK.msgs.map(m => m.role === 'user'
    ? `<div class="msg me">${esc(m.content)}</div>`
    : `<div class="msg ai">${esc(m.content)}${m.src ? `<span class="ask-src">from the ${esc(m.src)}</span>` : ''}</div>`).join('')
    + (ASK.busy ? `<div class="msg ai"><span class="spin"></span></div>` : '');
  b.scrollTop = b.scrollHeight;
}
function askThis(q) { const i = $('#askin'); if (i) i.value = q; sendAsk(); }
async function sendAsk() {
  const inp = $('#askin'); if (!inp) return;
  const q = inp.value.trim();
  if (!q || ASK.busy) return;
  inp.value = '';
  ASK.msgs.push({ role: 'user', content: q });
  const ctx = ASK.ctx;
  if (!S.cfg.key) {
    const a = localAnswer(ctx, q);
    ASK.msgs.push({ role: 'assistant', content: a.text, src: a.src });
    paintAsk(); bumpStreak();
    return;
  }
  ASK.busy = true; paintAsk();
  try {
    const reply = await apiAnswer(ctx, q);
    ASK.msgs.push({ role: 'assistant', content: reply || 'No answer came back. Try rephrasing.' });
    bumpStreak();
  } catch (e) {
    const a = localAnswer(ctx, q);
    ASK.msgs.push({ role: 'assistant', content: `Could not reach the API (${e.message}), so here is what the unit says:\n\n${a.text}`, src: a.src });
  }
  ASK.busy = false; paintAsk();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ASK.open) toggleAsk(false);
});
</script>
<script>
/* ============================================================
   CONFIG — edit these two blocks, nothing else
   ============================================================ */
const CONFIG = {
  /* Live visitor counter. Uses CounterAPI, a free keyless service.
     Change `name` to something unique to you before you deploy, or the
     numbers will be shared with anyone else running this file. */
  counter: {
    enabled: true,
    workspace: 'studybuddy',
    name: 'finpathdev-studybuddy'
  },
  /* Optional email signup. Make a free form at formspree.io, paste the
     endpoint here, and a signup box appears on the Students page. */
  signup: {
    enabled: false,
    endpoint: ''   // e.g. 'https://formspree.io/f/xxxxxxxx'
  }
};

/* ---------- local tallies ---------- */
function tally(k) {
  const t = store.get('sb.tally', { cards: 0, questions: 0 });
  t[k] = (t[k] || 0) + 1;
  store.set('sb.tally', t);
}

/* ============================================================
   MASTER REVIEW — a cumulative exam across every written unit
   ============================================================ */
function courseQuestions(cid) {
  const c = findCourse(cid);
  if (!c) return [];
  const out = [];
  c.units.forEach(u => (u.quiz || []).forEach(q => out.push(Object.assign({}, q, { _cn: c.short, _un: u.title }))));
  return out;
}
function masterReviewCard(c) {
  const n = courseQuestions(c.id).length;
  if (n < 10) return '';
  const f = c.fmt || {};
  return `<div class="card" style="border-left:3px solid ${c.color};margin-bottom:18px">
    <div class="spread">
      <div style="max-width:60ch">
        <span class="eyebrow">Master review</span>
        <h3 style="margin-bottom:6px">Every unit at once, on the clock</h3>
        <p style="color:var(--ink-soft);font-size:.9rem;margin:0">
          Pulls from all ${n} questions across this course, shuffled, with no feedback until the end${f.q ? ` — timed to match the real multiple-choice section (${f.q} questions in ${f.min} minutes)` : ''}.
        </p>
      </div>
      <a class="btn mark" href="#/exam/${c.id}">Start master review</a>
    </div>
  </div>`;
}
function vMasterReview(cid) {
  const c = findCourse(cid);
  if (!c) return notFound();
  const pool = courseQuestions(cid);
  if (pool.length < 5) return notFound();
  const f = c.fmt || { q: 40, min: 50 };
  /* the real section length, scaled down to the questions that exist */
  const count = Math.min(f.q || 40, pool.length);
  const mins = f.min && f.q ? Math.max(5, Math.round(f.min * (count / f.q))) : 20;
  return topbar() + `
  <a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a>
  <div class="page-head fade">
    <span class="eyebrow">Master review</span>
    <h1>${esc(c.name)}</h1>
    <p>Cumulative review across every written unit. Answers lock as you go and explanations wait until the end, the way the real exam works.</p>
  </div>
  <div class="card" style="max-width:600px">
    <div class="row" style="gap:26px;margin-bottom:18px">
      <div class="stat"><b>${count}</b><span>questions</span></div>
      <div class="stat"><b>${mins}</b><span>minutes</span></div>
      <div class="stat"><b>${c.units.length}</b><span>units covered</span></div>
    </div>
    ${f.q && count < f.q ? `<div class="note" style="margin-bottom:16px">The real section is ${f.q} questions in ${f.min} minutes. This course has ${pool.length} written questions so far, so the timer is scaled to keep the same pace per question.</div>` : ''}
    <div class="row">
      <button class="btn" onclick="runMaster('${cid}',${count},${mins})">Start · ${mins} minutes</button>
      <button class="btn ghost" onclick="runMaster('${cid}',${count},0)">Start untimed</button>
    </div>
  </div>`;
}
function runMaster(cid, count, mins) {
  const c = findCourse(cid);
  const qs = prepQuestions(courseQuestions(cid)).slice(0, count);
  QZ = {
    cid: null, uid: null, title: mins ? `${qs.length} questions · ${mins} minutes` : `${qs.length} questions`,
    sub: c.name + ' · master review', qs, i: 0, right: 0, marks: [], answered: false,
    test: true, timed: !!mins, endsAt: Date.now() + (mins || 0) * 60000
  };
  view().innerHTML = topbar() + `<a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a><div id="qwrap"></div>`;
  paintQuiz();
}

/* ============================================================
   OUTLINE UNITS — the rest of the course, buildable from notes
   ============================================================ */
function outlineSection(c) {
  const outline = c.outline || [];
  if (!outline.length) return '';
  /* Match on the unit number rather than the full title. A written unit called
     "Units 1-2 - The Global Tapestry" covers catalog units 1 and 2, and small
     wording differences never cause a finished unit to look missing. */
  const keysOf = title => {
    const m = String(title).match(/^\s*(units?|periods?|big idea|content area)\s+([\d\s,\u2013\u2014-]+)/i);
    if (!m) return new Set();
    const kind = m[1].toLowerCase().replace(/s$/, '');
    const out = new Set();
    m[2].split(',').forEach(part => {
      const r = part.trim().match(/^(\d+)\s*[\u2013\u2014-]\s*(\d+)$/);
      if (r) { for (let i = +r[1]; i <= +r[2]; i++) out.add(kind + ':' + i); }
      else { const n = part.trim().match(/\d+/); if (n) out.add(kind + ':' + n[0]); }
    });
    return out;
  };
  const writtenKeys = new Set();
  const writtenTitles = c.units.map(u => u.title.toLowerCase());
  c.units.forEach(u => keysOf(u.title).forEach(k => writtenKeys.add(k)));
  const remaining = outline.filter(t => {
    if (writtenTitles.some(w => w === t.toLowerCase())) return false;
    const ks = keysOf(t);
    if (ks.size && [...ks].every(k => writtenKeys.has(k))) return false;
    return true;
  });
  if (!remaining.length) return '';
  const heading = c.outlineOnly ? 'Course units' : 'The rest of this course';
  const blurb = c.outlineOnly
    ? 'These are the real College Board units for this course. StudyBuddy has not written material for them yet — but paste your class notes for any unit and it will build you a deck and a quiz in a few seconds.'
    : 'These units do not have written material yet. Paste your notes for any of them and StudyBuddy will build the deck for you.';
  return `<hr class="divide">
  <span class="eyebrow">${heading}</span>
  <h2 style="margin-bottom:8px">${remaining.length} unit${remaining.length > 1 ? 's' : ''} you can build yourself</h2>
  <p style="color:var(--ink-soft);max-width:64ch;margin-bottom:16px">${blurb}</p>
  <div class="grid g2">
    ${remaining.map(t => `<div class="card" style="padding:14px 16px">
      <div class="spread" style="gap:10px">
        <span style="font-weight:600;font-size:.93rem;max-width:64%">${esc(t)}</span>
        <a class="btn ghost sm" href="#/tutor?for=${encodeURIComponent(c.name + ' — ' + t)}">Build it</a>
      </div>
    </div>`).join('')}
  </div>`;
}

/* ============================================================
   VISITOR COUNTER
   GitHub Pages has no server, so counts come from a free third-party
   API. If it is unreachable the page shows local numbers instead of a
   frozen fake total.
   ============================================================ */
const Counter = {
  base: 'https://api.counterapi.dev/v1',
  async call(name, action) {
    const c = CONFIG.counter;
    const url = `${this.base}/${encodeURIComponent(c.workspace)}/${encodeURIComponent(c.name + '-' + name)}${action ? '/' + action : ''}`;
    const r = await fetch(url, { method: 'GET' });
    if (!r.ok) throw new Error('counter ' + r.status);
    const d = await r.json();
    const v = d.count ?? d.value ?? (d.data && (d.data.count ?? d.data.up_count));
    if (typeof v !== 'number') throw new Error('unexpected counter response');
    return v;
  },
  async register() {
    if (!CONFIG.counter.enabled) return null;
    const firstEver = !store.get('sb.seen', false);
    if (firstEver) store.set('sb.seen', true);
    let newSession = true;
    try {
      if (sessionStorage.getItem('sb.session')) newSession = false;
      else sessionStorage.setItem('sb.session', '1');
    } catch (e) {}
    const out = {};
    try {
      out.visits = await this.call('visits', newSession ? 'up' : '');
      out.devices = firstEver ? await this.call('devices', 'up') : await this.call('devices', '');
      out.live = true;
    } catch (e) {
      out.live = false; out.error = e.message;
    }
    out.returning = !firstEver;
    return out;
  }
};
let COUNTS = null;
function initCounter() {
  if (!CONFIG.counter.enabled) return;
  Counter.register().then(r => {
    COUNTS = r;
    if (location.hash.startsWith('#/stats')) render();
  }).catch(() => {});
}

/* ============================================================
   STUDENTS PAGE
   ============================================================ */
function vStats() {
  const t = store.get('sb.tally', { cards: 0, questions: 0 });
  const p = S.progress;
  const unitsStarted = Object.keys(p).length;
  const avg = unitsStarted ? Math.round(Object.values(p).reduce((a, b) => a + b.best, 0) / unitsStarted) : 0;
  const all = COURSES.concat(customCourses());
  const written = all.filter(c => !c.outlineOnly).length;

  let live;
  if (!CONFIG.counter.enabled) {
    live = `<div class="note">The live counter is switched off. Turn it on in <b>CONFIG.counter</b> at the top of <b>index.html</b>.</div>`;
  } else if (COUNTS === null) {
    live = `<div class="note"><span class="spin"></span> Checking the counter…</div>`;
  } else if (COUNTS.live) {
    live = `<div class="row" style="gap:30px">
        <div class="stat"><b>${COUNTS.visits.toLocaleString()}</b><span>total visits</span></div>
        <div class="stat"><b>${COUNTS.devices.toLocaleString()}</b><span>unique devices</span></div>
        <div class="stat"><b>${COUNTS.returning ? 'Yes' : 'First time'}</b><span>you, returning</span></div>
      </div>
      <p style="font-size:.82rem;color:var(--ink-faint);margin:16px 0 0">Counted once per browser session. Unique devices counts each browser once, so one person on a phone and a laptop counts twice.</p>`;
  } else {

    <span class="eyebrow">Who is here</span>

<script>
/* ============================================================
   LEITNER SPACED REPETITION (3 boxes)
   Box 1 → review today. Box 2 → in 3 days. Box 3 → in 7 days.
   Right answer promotes one box, wrong answer drops to box 1.
   ============================================================ */
const Leitner = {
  GAP: { 1: 0, 2: 3, 3: 7 },
  all() { return store.get('sb.leitner', {}); },
  save(m) { store.set('sb.leitner', m); },
  plus(days) { return new Date(Date.now() + days * 864e5).toISOString().slice(0, 10); },
  get(k) { return this.all()[k] || null; },
  grade(k, correct, meta) {
    const m = this.all();
    const cur = m[k] || { box: 1, seen: 0 };
    const box = correct ? Math.min(3, (cur.box || 1) + 1) : 1;
    m[k] = { box, due: this.plus(this.GAP[box]), seen: (cur.seen || 0) + 1, last: today(), ...(meta || cur.meta ? { meta: meta || cur.meta } : {}) };
    this.save(m);
    return box;
  },
  counts() {
    const c = { 1: 0, 2: 0, 3: 0, due: 0, total: 0 };
    const t = today();
    Object.values(this.all()).forEach(v => {
      c.total++; c[v.box] = (c[v.box] || 0) + 1;
      if (!v.due || v.due <= t) c.due++;
    });
    return c;
  },
  /* every card in the app that is scheduled and due now */
  dueCards() {
    const m = this.all(), t = today(), out = [];
    COURSES.concat(customCourses()).forEach(c => c.units.forEach(u => {
      (u.cards || []).forEach((card, i) => {
        const k = 'card:' + c.id + '/' + u.id + '/' + i;
        const rec = m[k];
        if (rec && (!rec.due || rec.due <= t)) out.push({ k, card, cid: c.id, uid: u.id, cn: c.short, un: u.title, box: rec.box });
      });
    }));
    return out;
  }
};

/* flashcards feed the schedule */
const _markCard = markCard;
markCard = function (known) {
  if (DECK) {
    const idx = DECK.order[DECK.i];
    if (idx !== undefined) Leitner.grade('card:' + DECK.cid + '/' + DECK.uid + '/' + idx, known);
  }
  return _markCard(known);
};
/* quizzes feed it too */
const _answerL = answer;
answer = function (i) {
  if (QZ && !QZ.answered) {
    const q = QZ.qs[QZ.i];
    if (q) Leitner.grade('q:' + qid(q.q), i === q.a);
  }
  return _answerL(i);
};

/* ---- due review session ---- */
function vReview() {
  const due = Leitner.dueCards();
  const c = Leitner.counts();
  if (!due.length) {
    return topbar() + `
    <div class="page-head fade"><span class="eyebrow">Spaced repetition</span><h1>Nothing due today</h1>
    <p>Cards come back on a schedule: miss one and it returns tomorrow, get it right and it waits 3 days, then 7. Studying any deck adds cards to the schedule.</p></div>
    ${leitnerBoxes()}
    <div class="empty" style="margin-top:20px"><div class="big">◷</div>
      <p>${c.total ? 'Everything scheduled is resting. Come back tomorrow.' : 'Study a flashcard deck and cards start appearing here.'}</p>
      <a class="btn" href="#/courses">Pick a deck</a></div>`;
  }
  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Spaced repetition</span>
    <h1><span class="hl">${due.length}</span> card${due.length > 1 ? 's' : ''} due today</h1>
    <p>These are the cards the schedule says you are about to forget. Working through them is the highest-value ten minutes available to you today.</p>
  </div>
  ${leitnerBoxes()}
  <div class="card" style="margin-top:16px;max-width:560px">
    <p style="color:var(--ink-soft);font-size:.9rem;margin-bottom:14px">Pulled from ${new Set(due.map(d => d.cn)).size} course${new Set(due.map(d => d.cn)).size > 1 ? 's' : ''}, shuffled together.</p>
    <button class="btn mark" onclick="startReview()">Start review · ${due.length} cards</button>
  </div>`;
}
function leitnerBoxes() {
  const c = Leitner.counts();
  return `<div class="boxes" style="max-width:560px">
    <div class="lbox b1"><b>${c[1] || 0}</b><span>Box 1 · daily</span></div>
    <div class="lbox b2"><b>${c[2] || 0}</b><span>Box 2 · 3 days</span></div>
    <div class="lbox b3"><b>${c[3] || 0}</b><span>Box 3 · 7 days</span></div>
  </div>`;
}
function startReview() {
  const due = shuffle(Leitner.dueCards());
  DECK = {
    cid: null, uid: null, review: true, i: 0, flipped: false,
    order: due.map((_, i) => i), cards: due.map(d => d.card), keys: due.map(d => d.k),
    labels: due.map(d => d.cn + ' · ' + d.un), missed: []
  };
  view().innerHTML = topbar() + `<a class="crumb" href="#/review">← Spaced repetition</a>
    <div class="page-head fade"><span class="eyebrow">Due today</span><h1>Review session</h1></div>
    <div class="deck-wrap" id="deckwrap"></div>`;
  paintCard();
}

/* ============================================================
   BACKUP AND RESTORE
   ============================================================ */
const BACKUP_KEYS = ['sb.progress', 'sb.cards', 'sb.streak', 'sb.custom', 'sb.last', 'sb.missed', 'sb.leitner', 'sb.tally'];
function collectData() {
  const out = { app: 'StudyBuddy', version: 2, exported: new Date().toISOString(), data: {} };
  BACKUP_KEYS.forEach(k => { const v = store.get(k, null); if (v !== null) out.data[k] = v; });
  return out;
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(collectData(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `studybuddy-backup-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function restoreBackup(file, mode) {
  const msg = $('#restoremsg');
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const j = JSON.parse(reader.result);
      if (!j || j.app !== 'StudyBuddy' || !j.data) throw new Error('That is not a StudyBuddy backup file.');
      if (mode === 'replace') {
        BACKUP_KEYS.forEach(k => { if (j.data[k] !== undefined) store.set(k, j.data[k]); });
      } else {
        /* merge: keep the better result for every unit, union everything else */
        const p = store.get('sb.progress', {}), np = j.data['sb.progress'] || {};
        Object.entries(np).forEach(([k, v]) => {
          p[k] = (!p[k] || v.best > p[k].best) ? v : p[k];
        });
        store.set('sb.progress', p);
        const miss = store.get('sb.missed', {}), nm = j.data['sb.missed'] || {};
        Object.entries(nm).forEach(([k, v]) => {
          miss[k] = miss[k] ? { ...v, n: Math.max(v.n, miss[k].n) } : v;
        });
        store.set('sb.missed', miss);
        const lt = store.get('sb.leitner', {}), nl = j.data['sb.leitner'] || {};
        Object.entries(nl).forEach(([k, v]) => {
          /* the lower box is the safer assumption when two devices disagree */
          lt[k] = lt[k] ? (v.box < lt[k].box ? v : lt[k]) : v;
        });
        store.set('sb.leitner', lt);
        const cust = store.get('sb.custom', []), nc = j.data['sb.custom'] || [];
        const ids = new Set(cust.map(d => d.id));
        nc.forEach(d => { if (!ids.has(d.id)) cust.push(d); });
        store.set('sb.custom', cust);
        const t = store.get('sb.tally', { cards: 0, questions: 0 }), nt = j.data['sb.tally'] || {};
        store.set('sb.tally', { cards: Math.max(t.cards || 0, nt.cards || 0), questions: Math.max(t.questions || 0, nt.questions || 0) });
      }
      msg.innerHTML = `<p style="color:var(--green);font-size:.85rem;margin:10px 0 0">Restored from ${esc((j.exported || '').slice(0, 10))}. Reloading…</p>`;
      setTimeout(() => location.reload(), 900);
    } catch (e) {
      msg.innerHTML = `<p style="color:var(--margin);font-size:.85rem;margin:10px 0 0">${esc(e.message)}</p>`;
    }
  };
  reader.onerror = () => { msg.innerHTML = `<p style="color:var(--margin);font-size:.85rem;margin:10px 0 0">Could not read that file.</p>`; };
  reader.readAsText(file);
}

        <div class="answerkey"><h3>Answer key</h3><div class="wcols">

    } else if (type === 'cut') {

        <a class="chip ${type === 'cut' ? 'on' : ''}" href="#/print/cut/${cid}/${uid}">Cut-out cards</a>

  </div>
  <div class="sheet">

/* ============================================================
   ASSIGNMENT LINKS  (tutor → student)
   ============================================================ */
function b64e(str) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(str)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s + '==='.slice((s.length + 3) % 4));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}

let ASSIGN = { cards: [], quiz: [], name: '' };
function vAssign() {
  const all = COURSES.concat(customCourses()).filter(c => !c.outlineOnly);
  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Tutor tools</span>
    <h1>Make an assignment</h1>
    <p>Build a targeted set and get a link. Send it to a student and it opens straight into StudyBuddy with the deck loaded — no account, no app, no file.</p>
  </div>
  <div class="grid g2" style="align-items:start">
    <div class="card">
      <label class="fld"><span>Assignment name</span>
        <input type="text" id="asname" value="${esc(ASSIGN.name)}" placeholder="e.g. Integration by parts — practice set">
      </label>
      <label class="fld"><span>Pull from a unit</span>
        <select id="assrc" onchange="assignPreview()">
          <option value="">Choose a unit…</option>
          ${all.map(c => `<optgroup label="${esc(c.name)}">${c.units.map(u =>
            `<option value="${c.id}|${u.id}">${esc(u.title)}</option>`).join('')}</optgroup>`).join('')}
        </select>
      </label>
      <div class="row" style="margin-bottom:14px">
        <label style="font-size:.86rem"><input type="checkbox" id="asC" checked onchange="assignPreview()"> flashcards</label>
        <label style="font-size:.86rem"><input type="checkbox" id="asQ" checked onchange="assignPreview()"> questions</label>
        <label style="font-size:.86rem">limit <input type="number" id="asN" value="10" min="1" max="50" style="width:64px;display:inline-block;padding:5px 8px" onchange="assignPreview()"></label>
      </div>
      <hr class="divide">
      <label class="fld"><span>Or write your own</span>
        <textarea id="asown" placeholder="One per line:&#10;Integration by parts — ∫u dv = uv − ∫v du&#10;LIATE: order for choosing u" style="min-height:110px" onchange="assignPreview()"></textarea>
        <small>Same <b>term — definition</b> format as the tutor. These get added to whatever you selected above.</small>
      </label>
      <button class="btn" onclick="makeAssignment()">Create the link</button>
    </div>
    <div class="card">
      <span class="eyebrow">Preview</span>
      <div id="aspreview"><p style="color:var(--ink-faint);font-size:.88rem">Pick a unit to see what the student will get.</p></div>
    </div>
  </div>`;
}
function assignPreview() {
  const sel = $('#assrc').value, wantC = $('#asC').checked, wantQ = $('#asQ').checked;
  const n = Math.max(1, Math.min(50, +$('#asN').value || 10));
  let cards = [], quiz = [];
  if (sel) {
    const [cid, uid] = sel.split('|');
    const u = findUnit(findCourse(cid), uid);
    if (u) {
      if (wantC) cards = shuffle(u.cards || []).slice(0, n);
      if (wantQ) quiz = shuffle(u.quiz || []).slice(0, n);
    }
  }
  const own = ($('#asown') ? $('#asown').value : '').trim();
  if (own) cards = cards.concat(localCards(own));
  ASSIGN = { cards, quiz, name: $('#asname').value.trim() };
  $('#aspreview').innerHTML = (cards.length || quiz.length)
    ? `<h3 style="margin-bottom:8px">${cards.length} cards · ${quiz.length} questions</h3>
       ${cards.slice(0, 5).map(c => `<p style="font-size:.86rem;margin-bottom:6px"><b>${esc(c[0])}</b><br><span style="color:var(--ink-soft)">${esc(c[1])}</span></p>`).join('')}
       ${cards.length > 5 ? `<p style="font-size:.8rem;color:var(--ink-faint)">+ ${cards.length - 5} more</p>` : ''}`
    : `<p style="color:var(--ink-faint);font-size:.88rem">Nothing selected yet.</p>`;

function makeAssignment() {
  assignPreview();

    return;
  }
  const payload = { n: ASSIGN.name || 'Practice set', c: ASSIGN.cards, q: ASSIGN.quiz };

  $('#aspreview').innerHTML = `
    <span class="eyebrow">Ready to send</span>

    <label class="fld" style="margin-top:12px"><span>Link</span>
      <textarea id="aslink" readonly style="min-height:90px;font-size:.76rem;font-family:'IBM Plex Mono',monospace">${esc(url)}</textarea>

function copyAssign() {

  else { document.execCommand('copy'); done(); }
}

function vImport() {
  const d = ROUTE_Q.get('d');
  if (!d) return notFound();
  let p;
  try { p = JSON.parse(b64d(d)); } catch (e) { p = null; }
  if (!p || (!p.c && !p.q)) {
    return topbar() + `<div class="empty"><div class="big">◌</div><h2>That link is damaged</h2>
      <p>It may have been cut short by a chat app. Ask for it again, or have your tutor send fewer cards.</p>
