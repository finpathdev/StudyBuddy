<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StudyBuddy — free AP, SAT & ACT studying</title>
<meta name="description" content="Free study platform for AP classes, SAT and ACT. Study guides, flashcards, quizzes, timed practice tests, and an AI that quizzes you on your own notes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%2316232B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='32' cy='32' r='28'/%3E%3Cpath d='M17 22.5 L21.5 15 L27 20M47 22.5 L42.5 15 L37 20'/%3E%3Ccircle cx='24.5' cy='28' r='7.5'/%3E%3Ccircle cx='39.5' cy='28' r='7.5'/%3E%3Cpath d='M32 32.5 L29.5 36.5 L32 38 L34.5 36.5Z'/%3E%3Cpath d='M17.5 30.5C15.5 41 21 50 32 50C43 50 48.5 41 46.5 30.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   StudyBuddy — design tokens
   Direction: index card + highlighter. Cool oat canvas, ruled
   paper cards, red margin rule, highlighter-stroke progress.
   ============================================================ */
:root{
  --canvas:#E6E8E1;
  --canvas-2:#DDE0D7;
  --paper:#FCFCF9;
  --ink:#16232B;
  --ink-soft:#5C6B72;
  --ink-faint:#93A0A6;
  --rule:#A9C3D2;
  --margin:#CF5945;
  --highlight:#F2E14C;
  --green:#2E7D5B;
  --line:rgba(22,35,43,.14);
  --shadow:0 1px 0 rgba(22,35,43,.06), 0 10px 24px -18px rgba(22,35,43,.5);
  --radius:14px;
  --blend:multiply;
}
[data-theme="night"]{
  --canvas:#12181C;
  --canvas-2:#0D1216;
  --paper:#1B2429;
  --ink:#E8EDEC;
  --ink-soft:#9AABB2;
  --ink-faint:#6B7C84;
  --rule:#33505F;
  --margin:#E2705C;
  --highlight:#C8B92E;
  --green:#4FBA8B;
  --line:rgba(232,237,236,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 30px -20px #000;
  --blend:screen;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:'Karla',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.2vw,2.9rem)}
h2{font-size:clamp(1.35rem,2.6vw,1.85rem)}
h3{font-size:1.12rem}
p{margin:0 0 .8em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--margin);outline-offset:2px;border-radius:4px}
::selection{background:var(--highlight);color:#16232B}

/* eyebrow / utility type ------------------------------------ */
.eyebrow{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 .5rem;display:block;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* highlighter stroke ---------------------------------------- */
.hl{position:relative;display:inline;z-index:0}
.hl::after{
  content:'';position:absolute;left:-.12em;right:-.12em;top:.12em;bottom:.02em;
  background:var(--highlight);mix-blend-mode:var(--blend);
  border-radius:.4em .7em .35em .6em;transform:rotate(-.7deg);z-index:-1;
}

/* ============================ shell ======================== */
.app{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;padding:22px 14px 24px;
  border-right:1px solid var(--line);
  background:var(--canvas-2);
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;text-decoration:none}
.brand-mark{width:36px;height:36px;flex:0 0 36px;display:block;color:var(--ink)}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-name{font-family:'Fraunces',serif;font-weight:700;font-size:1.16rem;letter-spacing:-.02em}
.brand-sub{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);padding:16px 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  text-decoration:none;color:var(--ink-soft);font-weight:600;font-size:.93rem;
  border:1px solid transparent;
}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a.on{background:var(--paper);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.nav a .ico{width:18px;text-align:center;opacity:.85;font-size:1rem}
.rail-foot{margin-top:auto;padding:18px 10px 0;font-size:.76rem;color:var(--ink-faint);line-height:1.4}

.main{flex:1;min-width:0;padding:34px clamp(16px,3.4vw,44px) 96px;max-width:1180px}
.page-head{margin-bottom:26px;position:relative;padding-left:18px}
.page-head::before{content:'';position:absolute;left:0;top:.15em;bottom:.15em;width:2px;background:var(--margin);opacity:.85;border-radius:2px}
.page-head p{color:var(--ink-soft);max-width:62ch;margin:.5rem 0 0}

/* mobile tabs ------------------------------------------------ */
.tabbar{display:none}
@media (max-width:860px){
  .rail{display:none}
  .main{padding:20px 16px 100px;max-width:100%}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--paper);border-top:1px solid var(--line);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tabbar a{
    flex:1;text-align:center;text-decoration:none;color:var(--ink-faint);
    font-size:.62rem;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;
    text-transform:uppercase;display:flex;flex-direction:column;gap:3px;padding:4px 2px;border-radius:8px;
  }
  .tabbar a .ico{font-size:1.15rem}
  .tabbar a.on{color:var(--ink);background:var(--canvas-2)}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
}
@media (min-width:861px){.mobile-top{display:none}}

/* ============================ cards ======================== */
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* buttons ---------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:10px 16px;border-radius:10px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-weight:700;font-size:.9rem;
  text-decoration:none;transition:transform .12s ease, box-shadow .12s ease;
  box-shadow:0 2px 0 rgba(22,35,43,.25);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none;font-weight:600}
.btn.ghost:hover{border-color:var(--ink);background:var(--paper)}
.btn.mark{background:var(--highlight);color:#16232B;border-color:transparent;box-shadow:0 2px 0 rgba(22,35,43,.2)}
.btn.red{background:var(--margin);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);font-size:.78rem;font-weight:600;
  color:var(--ink-soft);cursor:pointer;text-decoration:none;
}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{
  font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;background:var(--canvas-2);color:var(--ink-soft);border:1px solid var(--line);
}

/* inputs ----------------------------------------------------- */
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--paper);font-size:.94rem;
}
textarea{min-height:150px;resize:vertical;line-height:1.6}
label.fld{display:block;margin-bottom:14px}
label.fld span{display:block;font-weight:700;font-size:.84rem;margin-bottom:5px}
label.fld small{color:var(--ink-faint);font-weight:400;display:block;margin-top:5px;font-size:.78rem}

/* highlighter progress -------------------------------------- */
.meter{height:12px;background:var(--canvas-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.meter i{
  display:block;height:100%;background:var(--highlight);
  border-radius:2px 8px 4px 7px;transform:rotate(-.35deg) scaleY(1.25);transform-origin:left center;
  mix-blend-mode:var(--blend);transition:width .5s cubic-bezier(.2,.7,.3,1);
}
.meter.good i{background:var(--green);mix-blend-mode:normal;opacity:.85}

/* stat block ------------------------------------------------- */
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:'IBM Plex Mono',monospace;font-size:1.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:'IBM Plex Mono',monospace;font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}

/* course tile ------------------------------------------------ */
.tile{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px 22px;box-shadow:var(--shadow);text-decoration:none;display:block;
  position:relative;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease;
}
.tile::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--tcolor,var(--margin));opacity:.75}
.tile:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(22,35,43,.06),0 18px 30px -20px rgba(22,35,43,.6)}
.tile h3{margin-bottom:4px}
.tile .blurb{color:var(--ink-soft);font-size:.85rem;margin:0 0 12px}
.tile .foot{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}

/* study guide ------------------------------------------------ */
.guide h3{margin:26px 0 8px;padding-left:14px;position:relative}
.guide h3::before{content:'';position:absolute;left:0;top:.25em;bottom:.25em;width:2px;background:var(--rule)}
.guide ul{margin:0 0 4px;padding-left:20px}
.guide li{margin-bottom:7px}
.guide li b{background:linear-gradient(transparent 62%,var(--highlight) 62%)}
[data-theme="night"] .guide li b{background:none;color:var(--highlight)}
/* in night mode a solid highlighter block kills contrast — use a stroke instead */
[data-theme="night"] .hl::after{
  top:auto;bottom:.02em;height:.28em;background:var(--highlight);
  mix-blend-mode:normal;opacity:.85;border-radius:2px;
}
[data-theme="night"] .meter i{mix-blend-mode:normal;opacity:.9}

/* ====================== FLASHCARD (signature) =============== */
.deck-wrap{max-width:640px;margin:0 auto}
.fcard{
  perspective:1600px;height:min(56vh,380px);margin-bottom:18px;cursor:pointer;
}
.fcard-inner{
  position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);
  transform-style:preserve-3d;
}
.fcard.flipped .fcard-inner{transform:rotateX(180deg)}
.fface{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 2px 0 var(--canvas-2),0 3px 0 var(--line),0 20px 34px -24px rgba(22,35,43,.7);
  display:flex;flex-direction:column;justify-content:center;
  padding:34px 30px 30px 52px;overflow:auto;
  background-image:repeating-linear-gradient(transparent,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 46px;
}
.fface::before{content:'';position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.55}
.fface .ftag{position:absolute;top:12px;left:52px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.fface .ftext{font-family:'Fraunces',serif;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.6;font-weight:400}
.fback{transform:rotateX(180deg)}
.fback .ftext{font-family:'Karla',sans-serif;font-size:clamp(1rem,2.2vw,1.15rem);line-height:1.75}
.deck-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--ink-faint)}

/* quiz ------------------------------------------------------- */
.qbox{max-width:760px}
.qstem{font-size:1.08rem;font-weight:600;margin:6px 0 18px;line-height:1.5}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  padding:13px 15px;margin-bottom:9px;border-radius:11px;border:1px solid var(--line);
  background:var(--paper);transition:border-color .12s ease,background .12s ease;
}
.opt:hover:not([disabled]){border-color:var(--ink-soft)}
.opt .k{
  flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;
}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--paper))}
.opt.right .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--margin);background:color-mix(in srgb,var(--margin) 9%,var(--paper))}
.opt.wrong .k{background:var(--margin);color:#fff;border-color:var(--margin)}
.opt.picked{border-color:var(--ink)}
.why{
  border-left:2px solid var(--rule);padding:2px 0 2px 14px;margin:14px 0 18px;
  color:var(--ink-soft);font-size:.93rem;
}
.why b{color:var(--ink)}
.qprog{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.qprog i{width:22px;height:5px;border-radius:3px;background:var(--canvas-2);border:1px solid var(--line)}
.qprog i.done{background:var(--ink);border-color:var(--ink)}
.qprog i.miss{background:var(--margin);border-color:var(--margin)}
.qprog i.now{background:var(--highlight);border-color:var(--highlight)}

/* timer ------------------------------------------------------ */
.timer{
  font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600;
  padding:6px 12px;border-radius:8px;background:var(--canvas-2);border:1px solid var(--line);
}
.timer.low{background:var(--margin);color:#fff;border-color:var(--margin)}

/* chat ------------------------------------------------------- */
.chat{display:flex;flex-direction:column;gap:12px;max-height:min(52vh,460px);overflow-y:auto;padding:4px 2px 8px}
.msg{max-width:86%;padding:12px 15px;border-radius:14px;font-size:.94rem;line-height:1.6;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-faint);background:none;text-align:center}

/* ============== STUDY GUIDE (studious reading view) ========= */
.readprog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--highlight);z-index:200;transition:width .1s linear}
.guide-layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:960px){.guide-layout{grid-template-columns:1fr;gap:18px}.guide-toc{position:static !important;max-height:none}}
.guide-toc{position:sticky;top:26px}
.guide-toc .eyebrow{margin-bottom:10px}
.guide-toc a{
  display:block;padding:7px 0 7px 13px;font-size:.85rem;color:var(--ink-soft);
  text-decoration:none;border-left:2px solid var(--line);line-height:1.35;
}
.guide-toc a:hover{color:var(--ink);border-color:var(--ink-soft)}
.guide-toc a.on{color:var(--ink);border-color:var(--margin);font-weight:600}
.guide-page{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:40px 44px 40px 58px;position:relative;overflow:hidden;
}
.guide-page::before{content:'';position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.4}
@media (max-width:700px){.guide-page{padding:26px 20px 26px 30px}.guide-page::before{left:16px}}
.guide-page .owl-wm{position:absolute;right:-26px;top:-26px;width:150px;color:var(--ink);opacity:.045;pointer-events:none}
.guide-page .lede{
  font-family:'Newsreader',Georgia,serif;font-size:1.16rem;line-height:1.6;color:var(--ink-soft);
  border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px;
}
.guide-sec{scroll-margin-top:26px}
.guide-sec h3{
  font-family:'Fraunces',serif;font-size:1.28rem;margin:34px 0 12px;padding-left:0;
  display:flex;align-items:baseline;gap:11px;
}
.guide-sec h3::before{content:none}
.guide-sec .num{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--margin);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:0 0 auto;font-weight:500;
}
.guide-sec ul{list-style:none;margin:0;padding:0}
.guide-sec li{
  font-family:'Newsreader',Georgia,serif;font-size:1.06rem;line-height:1.72;
  margin-bottom:11px;padding-left:19px;position:relative;max-width:68ch;
}
.guide-sec li::before{content:'';position:absolute;left:0;top:.68em;width:7px;height:1.5px;background:var(--rule)}
.guide-sec li b{font-weight:600;background:linear-gradient(transparent 62%,var(--highlight) 62%)}
[data-theme="night"] .guide-sec li b{background:none;color:var(--highlight)}
.guide-sec li i{font-style:italic}
.keyterms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.keyterm{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--canvas-2)}
.keyterm b{display:block;font-size:.9rem;margin-bottom:3px}
.keyterm span{font-size:.82rem;color:var(--ink-soft);line-height:1.5}

/* ==================== ASK DOCK ============================== */
.ask-fab{
  position:fixed;right:22px;bottom:22px;z-index:120;display:inline-flex;align-items:center;gap:9px;
  padding:12px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 10px 26px -12px rgba(0,0,0,.6);
}
.ask-fab svg{width:19px;height:19px}
.ask-fab:hover{transform:translateY(-1px)}
@media (max-width:860px){.ask-fab{bottom:78px;right:14px;padding:11px 15px;font-size:.84rem}}
.ask-panel{
  position:fixed;right:22px;bottom:22px;z-index:130;width:min(400px,calc(100vw - 28px));
  max-height:min(620px,calc(100vh - 44px));display:flex;flex-direction:column;
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 24px 60px -22px rgba(0,0,0,.55);overflow:hidden;
}
@media (max-width:860px){.ask-panel{bottom:70px;right:8px;left:8px;width:auto;max-height:calc(100vh - 130px)}}
.ask-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:var(--canvas-2)}
.ask-head .owl{width:24px;height:24px;color:var(--ink);flex:0 0 24px}
.ask-head b{font-size:.9rem;display:block;line-height:1.2}
.ask-head small{font-size:.72rem;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}
.ask-head button{margin-left:auto;background:none;border:0;cursor:pointer;font-size:1.15rem;color:var(--ink-faint);padding:2px 4px;line-height:1}
.ask-body{flex:1;overflow-y:auto;padding:14px 15px;display:flex;flex-direction:column;gap:11px;min-height:120px}
.ask-foot{border-top:1px solid var(--line);padding:11px 12px;display:flex;gap:8px;background:var(--canvas-2)}
.ask-foot input{flex:1;border-radius:9px}
.ask-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ask-suggest button{
  font-size:.78rem;padding:6px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink-soft);cursor:pointer;text-align:left;
}
.ask-suggest button:hover{border-color:var(--ink-soft);color:var(--ink)}
.ask-src{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px;display:block}

/* ==================== INSTALL PAGE ========================= */
.big-install{
  display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  padding:20px 24px;border-radius:14px;border:1px solid var(--ink);
  background:var(--ink);color:var(--paper);font-weight:700;font-size:1.08rem;
  cursor:pointer;box-shadow:0 3px 0 rgba(22,35,43,.28);transition:transform .12s ease;
}
.big-install:hover{transform:translateY(-2px)}
.big-install:active{transform:translateY(1px);box-shadow:none}
.big-install svg{width:24px;height:24px;flex:0 0 24px}
.big-install[disabled]{opacity:.5;pointer-events:none}
.steps{list-style:none;counter-reset:s;margin:0;padding:0}
.steps li{
  counter-increment:s;position:relative;padding:0 0 20px 52px;
  font-size:1rem;line-height:1.55;
}
.steps li:not(:last-child)::after{
  content:'';position:absolute;left:17px;top:38px;bottom:6px;width:2px;
  background:var(--line);border-radius:2px;
}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:-2px;
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--ink);color:var(--paper);font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:.95rem;
}
.steps li b{font-weight:700}
.tapicon{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;border:1.5px solid var(--ink);
  background:var(--paper);vertical-align:-11px;margin:0 4px;
}
.tapicon svg{width:19px;height:19px;color:var(--ink)}
.devicetabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}

/* ==================== MATH RENDERING ======================= */
.math{
  font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-style:normal;white-space:nowrap;display:inline-block;
  line-height:1.1;vertical-align:middle;letter-spacing:0;
}
.mfrac{
  display:inline-flex;flex-direction:column;text-align:center;
  vertical-align:middle;margin:0 .2em;position:relative;top:-.08em;
}
.mnum{padding:0 .32em .1em;border-bottom:1.3px solid currentColor}
.mden{padding:.1em .32em 0}
.msqrt{display:inline-flex;align-items:stretch;margin:0 .14em}
.mrad{font-size:1.15em;line-height:1.05}
.mund{border-top:1.3px solid currentColor;padding:.1em .2em 0 .1em;margin-left:-.05em}
.mop{display:inline-flex;align-items:center;margin:0 .2em;vertical-align:middle}
.mglyph{font-size:1.5em;line-height:.85;font-family:Georgia,'Times New Roman',serif}
.mop-sum .mglyph,.mop-prod .mglyph{font-size:1.3em;font-family:inherit}
.mop-lim .mglyph{font-size:1em;font-family:inherit}
.mlim{display:inline-flex;flex-direction:column;font-size:.6em;line-height:1.15;margin-left:.12em}
.mlim .msup{min-height:1em}
.mlim .msub{min-height:1em}
.mtext{font-family:'Karla',ui-sans-serif,system-ui,sans-serif;padding:0 .2em;font-size:.94em}
.mthin{display:inline-block;width:.22em}
.math sup,.math sub{font-size:.66em;line-height:0}
.math sup{vertical-align:super}
.math sub{vertical-align:sub}
/* formulas inside a study guide bullet get a touch more breathing room */
.guide-sec li .math{font-size:1.02em;margin:0 .05em}
.keyterm .math,.opt .math,.qstem .math{font-size:.98em}
@media print{.math{white-space:normal}}

/* ============ WORKSHEET / PRINT OUTPUT ===================== */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:36px 40px;box-shadow:var(--shadow);max-width:860px;margin:0 auto}
.sheet-head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:1.4rem}
.sheet-head .who{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-faint);text-align:right;line-height:2.1}
.sheet-head .who u{display:inline-block;min-width:150px;text-decoration:none;border-bottom:1px solid var(--ink-faint)}
.sheet-sub{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:22px}
.wcols{column-count:2;column-gap:34px;column-rule:1px solid var(--line)}
@media (max-width:700px){.wcols{column-count:1}}
.wrow{break-inside:avoid;margin-bottom:13px;padding-bottom:11px;border-bottom:1px dotted var(--line)}
.wrow b{display:block;font-size:.92rem;margin-bottom:3px}
.wrow span{font-size:.84rem;color:var(--ink-soft);line-height:1.5}
.wrow .blank{display:block;border-bottom:1px solid var(--ink-faint);height:1.15em;margin-top:5px}
.wq{break-inside:avoid;margin-bottom:16px}
.wq .stem{font-weight:600;font-size:.92rem;margin-bottom:6px}
.wq ol{margin:0;padding-left:22px;font-size:.86rem;color:var(--ink-soft)}
.wq ol li{margin-bottom:2px}
.cutcard{
  break-inside:avoid;border:1px dashed var(--ink-faint);border-radius:6px;
  padding:14px 15px;margin-bottom:11px;min-height:88px;display:flex;flex-direction:column;justify-content:center;
}
.cutcard b{font-size:.95rem;display:block}
.cutcard span{font-size:.8rem;color:var(--ink-soft);margin-top:5px;display:block}
.answerkey{page-break-before:always;margin-top:30px;border-top:2px solid var(--ink);padding-top:16px}

/* ---- Leitner boxes ---- */
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lbox{border:1px solid var(--line);border-radius:11px;padding:13px;text-align:center;background:var(--paper)}
.lbox b{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;display:block;line-height:1.1}
.lbox span{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.lbox.b1{border-bottom:3px solid var(--margin)}
.lbox.b2{border-bottom:3px solid var(--highlight)}
.lbox.b3{border-bottom:3px solid var(--green)}
.due-pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--margin);color:#fff}

/* ---- accessibility ---- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fcard:focus-visible{outline:3px solid var(--margin);outline-offset:6px;border-radius:14px}
.skip-link{position:absolute;left:-9999px;top:8px;z-index:400;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700}
.skip-link:focus{left:8px}

/* ======================= PRINT ============================== */
@media print{
  .rail,.tabbar,.ask-fab,.ask-panel,.readprog,.mobile-top,.guide-toc,.crumb,.btn,.chip,.noprint{display:none !important}
  .sheet{border:0;box-shadow:none;padding:0;max-width:100%}
  .wrow,.wq,.cutcard{break-inside:avoid}
  .cutcard{border:1px dashed #999}
  .answerkey{page-break-before:always}
  @page{margin:0.6in}
  body{background:#fff}
  .main{padding:0;max-width:100%}
  .guide-page{border:0;box-shadow:none;padding:0}
  .guide-page::before,.owl-wm{display:none}
  .guide-layout{display:block}
  .guide-sec li b{background:none;text-decoration:underline}
  .keyterm{break-inside:avoid}
  a[href]::after{content:''}
}

/* misc ------------------------------------------------------- */
.empty{text-align:center;padding:44px 20px;color:var(--ink-soft)}
.empty .big{font-size:2.2rem;margin-bottom:8px;opacity:.5}
.note{background:var(--canvas-2);border:1px dashed var(--line);border-radius:11px;padding:13px 15px;font-size:.86rem;color:var(--ink-soft)}
.note b{color:var(--ink)}
.divide{height:1px;background:var(--line);margin:26px 0;border:0}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;display:block;text-decoration:none}
.crumb:hover{color:var(--ink)}
.hidden{display:none !important}
.center{text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .3s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .fcard-inner{transition:none}
}
.score-ring{
  width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;
  background:conic-gradient(var(--highlight) calc(var(--p)*1%), var(--canvas-2) 0);
}
.score-ring div{
  width:104px;height:104px;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:1.8rem;font-weight:600;
}
</style>

guide:[
 {h:'Thresholds and adaptation', points:[
  '<b>Sensation</b> is detecting raw stimuli; <b>perception</b> is organizing and interpreting them.',
  '<b>Transduction</b> converts physical energy into neural signals.',
  '<b>Absolute threshold</b> is the minimum stimulation detected 50% of the time.',
  '<b>Difference threshold</b> (JND) is the smallest detectable change; <b>Weber\u2019s law</b> says it is a constant proportion, not a fixed amount.',
  '<b>Sensory adaptation</b> is diminished sensitivity to an unchanging stimulus — you stop noticing your socks.',
  '<b>Signal detection theory</b> says detection depends on expectations, motivation, and fatigue, not just stimulus strength.'
 ]},
 {h:'Vision', points:[
  'Light passes the cornea and lens, which <b>accommodates</b> by changing shape, and lands on the retina.',
  '<b>Rods</b> handle black-and-white and peripheral vision in dim light; <b>cones</b> cluster in the fovea for color and detail.',
  '<b>Trichromatic theory</b> explains the retina: three cone types for red, green, and blue.',
  '<b>Opponent-process theory</b> explains afterimages: cells fire in opposing pairs (red-green, blue-yellow, black-white).',
  '<b>Feature detectors</b> in the visual cortex respond to edges, angles, and movement.',
  '<b>Parallel processing</b> handles color, motion, form, and depth simultaneously.'
 ]},
 {h:'Hearing and other senses', points:[
  'Sound waves move the eardrum, then the hammer-anvil-stirrup, then the cochlea, where hair cells transduce.',
  '<b>Place theory</b> explains high pitches by where on the basilar membrane hair cells vibrate; <b>frequency theory</b> explains low pitches by how fast the whole membrane fires.',
  '<b>Conduction deafness</b> is mechanical damage; <b>sensorineural deafness</b> is hair cell or nerve damage, treatable by cochlear implant.',
  '<b>Kinesthesis</b> senses body part position; the <b>vestibular sense</b> in the inner ear tracks balance.',
  '<b>Gate-control theory</b> holds that the spinal cord contains a gate that can block or allow pain signals.'
 ]},
 {h:'Perceptual organization', points:[
  '<b>Bottom-up</b> processing builds from sensory data; <b>top-down</b> uses expectations and schemas.',
  '<b>Gestalt principles</b>: figure-ground, proximity, similarity, closure, continuity.',
  'Binocular depth cues: <b>retinal disparity</b> and <b>convergence</b>. Monocular cues: relative size, interposition, linear perspective, texture gradient, relative height.',
  '<b>Perceptual constancy</b> keeps size, shape, and color stable despite changing images on the retina.',
  '<b>Perceptual set</b> is a mental predisposition to perceive one thing and not another.',
  '<b>Inattentional blindness</b> means failing to see a visible object when attention is elsewhere.'
 ]}
],
cards:[
 ['Transduction','Converting physical stimulus energy into neural impulses the brain can read.'],
 ['Absolute threshold','The minimum stimulation needed to detect a stimulus 50% of the time.'],
 ['Weber\u2019s law','Two stimuli must differ by a constant proportion, not a constant amount, to be perceived as different.'],
 ['Sensory adaptation','Reduced sensitivity to a constant, unchanging stimulus.'],
 ['Signal detection theory','Detection depends on the stimulus plus the observer\u2019s experience, expectations, and alertness.'],
 ['Rods vs. cones','Rods: dim light, peripheral, black-and-white. Cones: bright light, fovea, color and detail.'],
 ['Trichromatic theory','The retina has three color receptors — red, green, blue — that combine to make all colors.'],
 ['Opponent-process theory','Color is processed in opposing pairs, explaining afterimages.'],
 ['Feature detectors','Visual cortex neurons that respond to specific edges, lines, angles, or movements.'],
 ['Place theory','Pitch is determined by which part of the basilar membrane is stimulated; explains high tones.'],
 ['Gate-control theory','The spinal cord has a neural gate that can block or allow pain signals to reach the brain.'],
 ['Retinal disparity','A binocular cue: the greater the difference between the two eyes\u2019 images, the closer the object.'],
 ['Perceptual constancy','Perceiving objects as unchanging in size, shape, and color despite changing retinal images.'],
 ['Perceptual set','A mental predisposition that shapes what you perceive.'],
 ['Inattentional blindness','Failing to notice a fully visible object because attention is directed elsewhere.']
],
quiz:[
 {q:'You stop noticing the hum of an air conditioner after a few minutes. This illustrates:',
  c:['Sensory adaptation','Inattentional blindness','Weber\u2019s law','Sensory interaction'],
  a:0, why:'Sensory adaptation is reduced responsiveness to a constant stimulus, which frees attention for changes in the environment.'},
 {q:'Staring at a green square then looking at white paper produces a red afterimage. This supports:',
  c:['Trichromatic theory','Opponent-process theory','Place theory','Gate-control theory'],
  a:1, why:'Opposing pairs fatigue and rebound: tiring the green response leaves the red response dominant.'},
 {q:'Which is a monocular depth cue?',
  c:['Convergence','Retinal disparity','Linear perspective','Binaural timing'],
  a:2, why:'Linear perspective works with one eye. Convergence and retinal disparity both require two eyes.'},
 {q:'Reading a smudged word correctly because of the surrounding sentence is an example of:',
  c:['Bottom-up processing','Top-down processing','Transduction','Sensory adaptation'],
  a:1, why:'Top-down processing uses context and expectations to interpret incomplete sensory data.'},
 {q:'Weber\u2019s law predicts that if you can just detect a 2-oz difference in a 20-oz weight, then for a 40-oz weight you would need a difference of about:',
  c:['2 oz','3 oz','4 oz','8 oz'],
  a:2, why:'The JND is a constant proportion — here 10% — so 40 oz requires roughly a 4-oz difference.'},
 {q:'Damage to hair cells in the cochlea produces:',
  c:['Conduction deafness','Sensorineural deafness','Perceptual set','Accommodation failure'],
  a:1, why:'Sensorineural (nerve) deafness comes from hair cell or auditory nerve damage and can sometimes be helped by a cochlear implant.'},
 {q:'The Gestalt principle of closure explains why we:',
  c:['Group nearby items together','Fill in gaps to perceive a complete figure','See objects as unchanging in size','Perceive a figure against a background'],
  a:1, why:'Closure is the tendency to complete incomplete figures into whole, meaningful forms.'}
]
},
{
id:'u4', title:'Unit 4 · Learning',
guide:[
 {h:'Classical conditioning', points:[
  'Pavlov paired a neutral stimulus with an <b>unconditioned stimulus</b> (food) that produced an <b>unconditioned response</b> (salivation).',
  'After pairing, the neutral stimulus becomes a <b>conditioned stimulus</b> producing a <b>conditioned response</b>.',
  '<b>Acquisition</b> works best when the CS comes just before the UCS.',
  '<b>Extinction</b> occurs when the CS appears without the UCS; <b>spontaneous recovery</b> is the reappearance after a pause.',
  '<b>Generalization</b> is responding to similar stimuli; <b>discrimination</b> is learning to respond only to the CS.',
  'Watson\u2019s Little Albert study conditioned fear of a white rat that generalized to furry objects.'
 ]},
 {h:'Operant conditioning', points:[
  'Thorndike\u2019s <b>law of effect</b>: behaviors followed by good outcomes are repeated.',
  '<b>Positive</b> means adding a stimulus, <b>negative</b> means removing one. <b>Reinforcement</b> increases behavior, <b>punishment</b> decreases it.',
  'Negative reinforcement is not punishment — taking away something unpleasant strengthens the behavior.',
  '<b>Primary reinforcers</b> satisfy biological needs; <b>secondary reinforcers</b> like money gain value by association.',
  '<b>Shaping</b> reinforces successive approximations toward a target behavior.'
 ]},
 {h:'Reinforcement schedules', points:[
  '<b>Fixed-ratio</b>: reward after a set number of responses — high rate with a brief post-reward pause.',
  '<b>Variable-ratio</b>: reward after an unpredictable number — highest, steadiest rate and hardest to extinguish (slot machines).',
  '<b>Fixed-interval</b>: reward for the first response after a set time — a scalloped pattern of activity near the deadline.',
  '<b>Variable-interval</b>: reward after unpredictable time — slow, steady responding.',
  '<b>Continuous</b> reinforcement produces fastest acquisition; <b>partial</b> reinforcement produces greatest resistance to extinction.'
 ]},
 {h:'Cognitive and observational learning', points:[
  'Tolman showed <b>latent learning</b>: rats formed <b>cognitive maps</b> without reinforcement, revealed only when rewarded.',
  '<b>Overjustification effect</b>: rewarding an already enjoyable activity can reduce intrinsic motivation.',
  'Bandura\u2019s Bobo doll study demonstrated <b>observational learning</b> through modeling.',
  '<b>Mirror neurons</b> are proposed to fire both when acting and when watching another act.',
  'Seligman\u2019s <b>learned helplessness</b>: after inescapable aversive events, organisms stop trying even when escape is possible.',
  '<b>Taste aversion</b> forms after a single pairing with long delay, showing <b>biological preparedness</b> limits conditioning.'
 ]}
],
cards:[
 ['Unconditioned stimulus (UCS)','A stimulus that naturally triggers a response without learning.'],
 ['Conditioned stimulus (CS)','A previously neutral stimulus that triggers a response after pairing with the UCS.'],
 ['Spontaneous recovery','Reappearance of an extinguished conditioned response after a rest period.'],
 ['Stimulus generalization','Responding to stimuli similar to the conditioned stimulus.'],
 ['Law of effect','Behaviors followed by favorable consequences become more likely to recur.'],
 ['Negative reinforcement','Removing an unpleasant stimulus to increase a behavior — not punishment.'],
 ['Positive punishment','Adding an unpleasant consequence to decrease a behavior.'],
 ['Shaping','Reinforcing successive approximations toward a desired behavior.'],
 ['Variable-ratio schedule','Reinforcement after an unpredictable number of responses; produces high, steady, extinction-resistant responding.'],
 ['Fixed-interval schedule','Reinforcement for the first response after a set time; produces a scalloped response pattern.'],
 ['Partial reinforcement effect','Behavior reinforced intermittently resists extinction longer than continuously reinforced behavior.'],
 ['Latent learning','Learning that occurs without reinforcement and is not shown until there is a reason to demonstrate it.'],
 ['Observational learning','Learning by watching and imitating a model, demonstrated by Bandura\u2019s Bobo doll study.'],
 ['Learned helplessness','Passive resignation after repeated inescapable aversive events.'],
 ['Taste aversion','A conditioned avoidance of a food learned in one trial even with a long delay; evidence of biological preparedness.'],
 ['Overjustification effect','External rewards for an intrinsically enjoyable task can undermine intrinsic motivation.']
],
quiz:[

  c:['Positive reinforcement','Negative reinforcement','Positive punishment','Negative punishment'],
  a:1, why:'Something unpleasant is removed and the behavior increases — that is negative reinforcement, not punishment.'},
 {q:'Which schedule produces the highest and most extinction-resistant rate of responding?',
  c:['Fixed-ratio','Variable-ratio','Fixed-interval','Variable-interval'],
  a:1, why:'Unpredictable reward after an unpredictable number of responses keeps responding constant — the slot machine effect.'},
 {q:'A dog salivates at the sound of a can opener. The can opener sound is the:',

  a:1, why:'The sound was neutral until paired with food; after pairing it triggers salivation, making it the CS.'},
 {q:'A student who was paid to read for pleasure now reads less when the payments stop. This best illustrates:',
  c:['Extinction','The overjustification effect','Learned helplessness','Spontaneous recovery'],
  a:1, why:'External rewards replaced intrinsic interest, so removing the reward removes the motivation.'},
 {q:'Getting sick after eating shrimp once and avoiding it for years illustrates:',
  c:['Operant conditioning','Taste aversion and biological preparedness','Observational learning','Latent learning'],
  a:1, why:'One-trial learning across a long delay shows some associations are biologically prepared because they aided survival.'},
 {q:'Rats that explored a maze without reward later ran it quickly once food appeared. Tolman called this:',

 {q:'Bandura\u2019s Bobo doll experiment demonstrated that:',
  c:['Punishment is more effective than reinforcement','Children imitate aggressive behavior they observe in models','Aggression is entirely genetic','Conditioning requires biological preparedness'],

]
},
{
id:'u5', title:'Unit 5 · Cognition and Memory',
guide:[
 {h:'Memory models and encoding', points:[
  'The three-stage model: <b>sensory memory</b> → <b>short-term/working memory</b> → <b>long-term memory</b>.',
  'Sensory memory holds iconic images about 0.3 seconds and echoic sounds 3–4 seconds.',
  'Working memory holds roughly 7±2 items for about 20 seconds without rehearsal.',
  '<b>Chunking</b> groups items into meaningful units; <b>mnemonics</b> add structure and imagery.',
  '<b>Automatic processing</b> handles space, time, and frequency; <b>effortful processing</b> requires attention.',
  'The <b>spacing effect</b>: distributed practice beats cramming for long-term retention.'
 ]},
 {h:'Storage and retrieval', points:[
  '<b>Explicit (declarative)</b> memory covers facts and events, handled by the hippocampus.',
  '<b>Implicit (procedural)</b> memory covers skills and conditioned responses, handled by the cerebellum and basal ganglia.',
  '<b>Recall</b> retrieves without cues; <b>recognition</b> only requires identifying — which is why multiple choice feels easier.',
  '<b>Priming</b>, <b>context-dependent</b>, and <b>state-dependent</b> memory all show that retrieval cues matter.',
  'The <b>serial position effect</b> produces better memory for the first (primacy) and last (recency) items in a list.',
  '<b>Levels of processing</b>: semantic encoding beats shallow visual or acoustic encoding.'
 ]},
 {h:'Forgetting and memory errors', points:[
  'Ebbinghaus\u2019s <b>forgetting curve</b> drops sharply at first and then levels off.',
  '<b>Proactive interference</b>: old learning disrupts new. <b>Retroactive interference</b>: new learning disrupts old.',
  '<b>Anterograde amnesia</b> blocks new memories; <b>retrograde amnesia</b> erases old ones.',
  'Loftus\u2019s <b>misinformation effect</b> shows that post-event information reshapes eyewitness memory.',
  '<b>Source amnesia</b> is remembering information but misattributing where it came from.'
 ]},
 {h:'Thinking and problem solving', points:[
  '<b>Algorithms</b> guarantee a solution but are slow; <b>heuristics</b> are fast mental shortcuts that can misfire.',
  '<b>Availability heuristic</b>: judging likelihood by how easily examples come to mind — why people fear plane crashes more than car crashes.',
  '<b>Representativeness heuristic</b>: judging by how well something matches a prototype, ignoring base rates.',
  '<b>Confirmation bias</b> seeks evidence that supports existing beliefs; <b>belief perseverance</b> clings to them after they are discredited.',
  '<b>Functional fixedness</b> limits objects to their usual uses; <b>mental set</b> repeats strategies that worked before.',
  '<b>Framing</b> changes decisions by changing wording: "90% survival" reads better than "10% mortality."'
 ]}
],
cards:[
 ['Working memory','Short-term store that actively manipulates about 7±2 items for roughly 20 seconds.'],
 ['Chunking','Organizing information into familiar, meaningful units to expand short-term capacity.'],
 ['Spacing effect','Distributed practice over time produces better long-term retention than massed cramming.'],
 ['Explicit vs. implicit memory','Explicit = conscious facts and events (hippocampus); implicit = skills and conditioning (cerebellum).'],
 ['Serial position effect','Better recall for items at the beginning (primacy) and end (recency) of a list.'],
 ['Context-dependent memory','Retrieval improves when the environment matches the one where encoding occurred.'],
 ['State-dependent memory','Retrieval improves when your internal state matches the one at encoding.'],
 ['Proactive interference','Older learning disrupts recall of newer information.'],
 ['Retroactive interference','Newer learning disrupts recall of older information.'],
 ['Misinformation effect','Exposure to misleading information after an event alters the memory of that event.'],
 ['Anterograde amnesia','Inability to form new long-term memories after brain injury.'],
 ['Availability heuristic','Estimating likelihood by how easily examples come to mind.'],
 ['Representativeness heuristic','Judging likelihood by resemblance to a prototype, often ignoring base rates.'],
 ['Functional fixedness','Inability to see an object as having a use beyond its typical one.'],
 ['Framing','How an issue is worded changes the judgment or decision people make.'],
 ['Belief perseverance','Holding onto a belief even after the evidence for it has been discredited.']
],
quiz:[
 {q:'A student remembers the first and last vocabulary words on a list best. This is:',
  c:['The spacing effect','The serial position effect','Proactive interference','Chunking'],
  a:1, why:'Primacy reflects extra rehearsal into long-term memory; recency reflects items still in short-term memory.'},
 {q:'After learning Spanish, a student struggles to recall French learned earlier. This is:',

 {q:'A method that guarantees a correct answer but may be slow is a(n):',
  c:['Heuristic','Algorithm','Prototype','Mental set'],
  a:1, why:'Algorithms exhaust all possibilities and are guaranteed but inefficient; heuristics trade accuracy for speed.'}
]
},
{

guide:[
 {h:'Attribution and attitudes', points:[
  '<b>Fundamental attribution error</b>: overestimating personality and underestimating the situation when explaining others\u2019 behavior.',
  '<b>Actor-observer bias</b>: we explain our own behavior situationally but others\u2019 dispositionally.',
  '<b>Self-serving bias</b>: crediting success to ourselves and blaming failure on circumstances.',
  '<b>Cognitive dissonance</b> (Festinger): discomfort from conflicting attitudes and actions pushes us to change attitudes to match behavior.',

 ]},
 {h:'Conformity and obedience', points:[

  'Milgram\u2019s obedience study: 65% delivered the maximum shock when an authority insisted.',

 ]},
 {h:'Group behavior', points:[

  '<b>Social loafing</b>: individuals exert less effort in a group when contributions are pooled.',
  '<b>Deindividuation</b>: anonymity in a group loosens self-restraint.',
  '<b>Group polarization</b>: discussion among like-minded people strengthens their shared position.',

  '<b>Bystander effect</b>: the more witnesses present, the less likely any one person helps, due to diffusion of responsibility.'
 ]},
 {h:'Prejudice, aggression, and attraction', points:[

  '<b>Just-world hypothesis</b>: believing people get what they deserve.',
  '<b>Stereotype threat</b>: anxiety about confirming a negative stereotype depresses performance.',
  'Attraction rises with <b>proximity</b>, the <b>mere exposure effect</b>, physical attractiveness, and similarity.',
  'Sherif\u2019s Robbers Cave study reduced conflict through <b>superordinate goals</b> requiring cooperation.'
 ]}
],
cards:[
 ['Fundamental attribution error','Overweighting disposition and underweighting situation when explaining others\u2019 behavior.'],
 ['Self-serving bias','Attributing successes to ourselves and failures to external circumstances.'],
 ['Cognitive dissonance','Tension from mismatched attitudes and actions, usually resolved by changing the attitude.'],
 ['Normative social influence','Conforming to gain approval or avoid rejection.'],
 ['Informational social influence','Conforming because others are believed to have accurate information.'],
 ['Foot-in-the-door phenomenon','Agreeing to a small request increases later compliance with a larger one.'],
 ['Social facilitation','Improved performance on simple or well-practiced tasks in the presence of others.'],
 ['Social loafing','Reduced individual effort when working in a group toward a pooled result.'],
 ['Deindividuation','Loss of self-awareness and restraint in group situations that provide anonymity.'],
 ['Group polarization','Discussion among like-minded people intensifies their shared attitudes.'],
 ['Groupthink','Poor decision making caused by prioritizing group harmony over critical evaluation.'],
 ['Bystander effect','The presence of other witnesses reduces any individual\u2019s likelihood of helping.'],
 ['Diffusion of responsibility','Each person feels less personally accountable when others are present.'],
 ['Mere exposure effect','Repeated exposure to a stimulus increases liking for it.'],
 ['Superordinate goals','Shared goals requiring cooperation, which reduce intergroup conflict.'],
 ['Stereotype threat','Underperformance caused by anxiety about confirming a negative stereotype about one\u2019s group.']
],

  const c = COURSES.find(x => x.id === cid);
  if (!c) return;

}

/* ---- merge the catalog into COURSES ---- */
(function mergeCatalog(){
  const byId = {};
  COURSES.forEach(c => byId[c.id] = c);
  CATALOG.forEach(cat => {
    const built = byId[cat.id];
    if (built) {
      built.outline = cat.units;
      built.fmt = cat.fmt;
      built.group = cat.g;
      if (cat.note) built.note = cat.note;
    } else {
      COURSES.push({
        id: cat.id, name: cat.name, short: cat.short, color: cat.color,
        exam: 'AP', group: cat.g, blurb: cat.blurb || '', note: cat.note || '',
        fmt: cat.fmt, outline: cat.units, units: [], outlineOnly: true
      });
    }
  });
  /* the two entrance exams sit in their own group */
  COURSES.forEach(c => { if (FORMAL[c.id]) c.formal = FORMAL[c.id]; });
  COURSES.forEach(c => {
    if (c.exam === 'Test') {
      c.group = 'College entrance exams';
      c.fmt = c.id === 'sat' ? { q: 54, min: 64 } : { q: 75, min: 45 };
    }
    if (!c.group) c.group = 'Other';
  });
})();

  c:['Travel farther from the well','Stay closest to the well','Do not move','Move toward the negative electrode'],
  a:0, why:'Smaller fragments navigate the gel matrix more easily and migrate farther in the same time.'},
 {q:'Alternative splicing explains how:',
  c:['Bacteria regulate operons','One gene can produce several distinct proteins','DNA replicates semiconservatively','Mutations are repaired'],
  a:1, why:'Different combinations of exons can be retained, yielding different mRNAs from one gene.'}
]
},
{
id:'u7', title:'Unit 7 · Natural Selection',
guide:[
 {h:'Selection and evolution', points:[
  'Natural selection requires variation, heritability, overproduction, and differential reproductive success.',
  '<b>Fitness</b> means reproductive success, not strength or size.',
  'Selection types: <b>directional</b> (favours one extreme), <b>stabilizing</b> (favours the middle), <b>disruptive</b> (favours both extremes).',
  '<b>Sexual selection</b> favours traits that improve mating success even when they hurt survival.',
  'Other mechanisms: <b>genetic drift</b> (bottleneck and founder effects), <b>gene flow</b>, and mutation as the ultimate source of new alleles.'
 ]},
 {h:'Evidence and speciation', points:[
  'Evidence: fossils, <b>homologous</b> structures (common ancestry), <b>analogous</b> structures (convergent evolution), vestigial traits, embryology, and molecular similarity.',
  '<b>Hardy-Weinberg</b>: p + q = 1 and @@p^{2} + 2pq + q^{2} = 1@@, valid only with no selection, no mutation, no migration, random mating, and a large population.',
  'Deviation from Hardy-Weinberg is evidence that evolution is occurring.',
  '<b>Allopatric speciation</b> follows geographic isolation; <b>sympatric</b> occurs without it, often via polyploidy in plants.',
  'Reproductive barriers may be <b>prezygotic</b> (habitat, timing, behaviour) or <b>postzygotic</b> (hybrid sterility).',
  '<b>Phylogenetic trees</b> and <b>cladograms</b> map relationships using shared derived characters.'
 ]}
],
cards:[
 ['Fitness','An organism\u2019s relative contribution of offspring to the next generation.'],
 ['Directional selection','Favours one extreme phenotype, shifting the population mean.'],
 ['Stabilizing selection','Favours intermediate phenotypes and reduces variation.'],
 ['Disruptive selection','Favours both extremes over intermediates.'],
 ['Genetic drift','Random change in allele frequency, strongest in small populations.'],
 ['Bottleneck effect','A sharp population reduction that randomly alters allele frequencies.'],
 ['Founder effect','A small group starting a new population with a nonrepresentative allele sample.'],
 ['Homologous vs. analogous structures','Homologous share ancestry; analogous share function from convergent evolution.'],
 ['Hardy-Weinberg equilibrium','@@p^{2} + 2pq + q^{2} = 1@@; holds only when no evolutionary forces act.'],
 ['Allopatric speciation','New species arising after geographic separation.'],
 ['Prezygotic barrier','Prevents mating or fertilization, such as differing habitats or timing.'],
 ['Cladogram','Diagram grouping organisms by shared derived characteristics.']
],
quiz:[
 {q:'In a population at Hardy-Weinberg equilibrium, q² = 0.09. The heterozygote frequency is:',
  c:['0.09','0.21','0.42','0.49'],
  a:2, why:'q = 0.3 so p = 0.7, and 2pq = 2(0.7)(0.3) = 0.42.'},
 {q:'Bat wings and insect wings are:',
  c:['Homologous structures','Analogous structures','Vestigial structures','Evidence of shared ancestry'],
  a:1, why:'Same function evolved independently, which is convergent evolution.'},
 {q:'A hurricane randomly kills most of an island lizard population. This is:',
  c:['Directional selection','The bottleneck effect','Gene flow','Sexual selection'],
  a:1, why:'Non-selective random loss changes allele frequencies, which is genetic drift.'},
 {q:'Two frog species living in the same pond breed in different months. This is a:',
  c:['Postzygotic barrier','Prezygotic temporal barrier','Hybrid sterility','Founder effect'],
  a:1, why:'Mating never occurs, so the barrier acts before any zygote could form.'},
 {q:'A peacock\u2019s enormous tail persists despite hindering escape because of:',
  c:['Stabilizing selection','Sexual selection','Genetic drift','Gene flow'],
  a:1, why:'Improved mating success outweighs the survival cost in terms of overall reproductive fitness.'}
]
},
{
id:'u8', title:'Unit 8 · Ecology',
guide:[
 {h:'Populations and communities', points:[
  '<b>Exponential growth</b> is J-shaped; <b>logistic growth</b> is S-shaped and levels at carrying capacity (K).',
  '<b>r-selected</b> species produce many low-investment offspring; <b>K-selected</b> produce few with high investment.',
  'Interactions: competition, predation, and symbiosis (<b>mutualism</b>, <b>commensalism</b>, <b>parasitism</b>).',
  'The <b>competitive exclusion principle</b> forbids identical niches; <b>resource partitioning</b> resolves it.',
  '<b>Keystone species</b> shape communities far beyond their abundance.',
  '<b>Succession</b> rebuilds communities after disturbance, from pioneer species to a stable community.'
 ]},
 {h:'Ecosystems and human impact', points:[
  'Energy flows one way; about <b>10%</b> transfers between trophic levels, which limits food chain length.',
  'Matter cycles rather than flowing: carbon, nitrogen, and phosphorus all return through decomposition.',
  '<b>Nitrogen fixation</b> by bacteria converts N₂ into usable ammonia.',
  'Organisms maintain <b>homeostasis</b>; disruptions cascade through connected populations.',
  'Human impacts: habitat loss, invasive species, pollution, and climate change reduce biodiversity.',
  'Greater biodiversity generally increases ecosystem stability and resilience.'
 ]}
],
cards:[
 ['Exponential vs. logistic growth','Exponential is J-shaped and unlimited; logistic is S-shaped and levels at carrying capacity.'],
 ['Carrying capacity (K)','The maximum population an environment can sustain over time.'],
 ['r-selected vs. K-selected','r: many offspring, little care. K: few offspring, heavy investment.'],
 ['Mutualism','A relationship benefiting both species.'],
 ['Commensalism','One species benefits while the other is unaffected.'],
 ['Competitive exclusion principle','Two species cannot occupy the identical niche indefinitely.'],
 ['Resource partitioning','Species divide a shared resource by time, space, or method to coexist.'],
 ['Keystone species','A species whose removal dramatically restructures its community.'],
 ['10% rule','Roughly 10% of energy passes from one trophic level to the next.'],
 ['Nitrogen fixation','Bacterial conversion of atmospheric N₂ into usable ammonia.'],
 ['Energy vs. matter in ecosystems','Energy flows one way and is lost as heat; matter cycles and is reused.'],
 ['Biodiversity and stability','Greater diversity generally increases ecosystem resilience to disturbance.']
],
quiz:[
 {q:'Producers capture 20,000 kcal. Roughly how much reaches tertiary consumers?',
  c:['2,000 kcal','200 kcal','20 kcal','2 kcal'],
  a:2, why:'Three transfers at about 10% each: 20,000 → 2,000 → 200 → 20 kcal.'},
 {q:'Two warbler species feed in different parts of the same tree. This is:',
  c:['Competitive exclusion','Resource partitioning','Parasitism','Commensalism'],
  a:1, why:'Dividing the resource by spatial niche allows both species to coexist.'},
 {q:'A logistic growth curve levels off because:',
  c:['Mutation rates fall','Density-dependent factors intensify near carrying capacity','Predators go extinct','Energy transfer improves'],
  a:1, why:'Competition, disease, and limited resources increase as N approaches K.'},
 {q:'Which best describes energy and matter in an ecosystem?',
  c:['Both cycle continuously','Both flow one way','Energy flows one way while matter cycles','Matter flows one way while energy cycles'],
  a:2, why:'Energy is ultimately lost as heat, whereas atoms are reused indefinitely through decomposition.'},
 {q:'Barnacles attached to a whale, feeding on passing plankton without affecting it, is:',
  c:['Mutualism','Commensalism','Parasitism','Competition'],
  a:1, why:'The barnacle gains transport and feeding opportunity while the whale is essentially unaffected.'}
]
}
]);
clearOutlineFlags();
</script>
<script>
/* ============================================================
   StudyBuddy app
   ============================================================ */

/* ---------- storage that never throws ---------- */
const store = (() => {
  let ok = true, mem = {};
  try { localStorage.setItem('__sb', '1'); localStorage.removeItem('__sb'); }
  catch (e) { ok = false; }
  return {
    ok,
    get(k, d) {
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) { mem[k] = s; }
    },
    wipe() { try { if (ok) ['sb.progress','sb.cards','sb.streak','sb.custom','sb.last'].forEach(k => localStorage.removeItem(k)); } catch (e) {} mem = {}; }
  };
})();

const S = {
  get progress() { return store.get('sb.progress', {}); },
  set progress(v) { store.set('sb.progress', v); },
  get cards() { return store.get('sb.cards', {}); },
  set cards(v) { store.set('sb.cards', v); },
  get custom() { return store.get('sb.custom', []); },
  set custom(v) { store.set('sb.custom', v); },
  get cfg() { return store.get('sb.cfg', { theme: 'day', key: '', model: 'claude-sonnet-4-6' }); },
  set cfg(v) { store.set('sb.cfg', v); }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const findCourse = id => COURSES.concat(customCourses()).find(c => c.id === id);
const findUnit = (c, uid) => c && c.units.find(u => u.id === uid);
const customCourses = () => S.custom.filter(d => !d.courseId).map(d => ({
  id: 'my-' + d.id, name: d.name, short: d.name, color: '#4B7F8C', exam: 'Mine',
  blurb: d.note || 'Made from your own notes.', mine: true, group: 'Made from your notes',
  units: [{ id: 'u1', title: d.name, guide: d.guide || [], cards: d.cards || [], quiz: d.quiz || [] }]
}));

function unitKey(cid, uid) { return cid + '/' + uid; }
function mastery(cid, uid) { const p = S.progress[unitKey(cid, uid)]; return p ? p.best : null; }
function courseMastery(c) {
  const vals = c.units.map(u => mastery(c.id, u.id)).filter(v => v !== null);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / c.units.length);
}
function recordScore(cid, uid, pct) {
  const p = S.progress, k = unitKey(cid, uid);
  const prev = p[k] || { best: 0, tries: 0 };
  p[k] = { best: Math.max(prev.best, pct), last: pct, tries: prev.tries + 1, when: today() };
  S.progress = p;
  bumpStreak();
}
function bumpStreak() {
  const st = store.get('sb.streak', { last: '', n: 0 });
  const t = today();
  if (st.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  st.n = st.last === y ? st.n + 1 : 1;
  st.last = t;
  store.set('sb.streak', st);
}
function streakCount() {
  const st = store.get('sb.streak', { last: '', n: 0 });
  if (!st.last) return 0;
  const t = today(), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  return (st.last === t || st.last === y) ? st.n : 0;
}
function allQuestions(filter) {
  const out = [];
  COURSES.concat(customCourses()).forEach(c => {
    if (filter && filter !== c.id) return;
    c.units.forEach(u => (u.quiz || []).forEach(q => out.push(Object.assign({}, q, { _c: c.id, _u: u.id, _cn: c.short, _un: u.title }))));
  });
  return out;
}

/* ---------- navigation ---------- */
const NAV = [
  { h: '#/', t: 'Dashboard', i: '◧', m: 'Home' },
  { h: '#/courses', t: 'Courses', i: '▤', m: 'Courses' },
  { h: '#/tutor', t: 'AI Tutor', i: '✦', m: 'Tutor' },
  { h: '#/tests', t: 'Practice tests', i: '⏱', m: 'Tests' },
  { h: '#/review', t: 'Due today', i: '◷', m: 'Due' },
  { h: '#/stats', t: 'Students', i: '◉', m: 'Stats' },
  { h: '#/settings', t: 'Settings', i: '⚙', m: 'More' }
];
function paintNav() {
  const h = location.hash || '#/';
  $('#nav').innerHTML = '<span class="nav-label">Study</span>' + NAV.map(n =>
    `<a href="${n.h}" class="${h === n.h || (n.h !== '#/' && h.startsWith(n.h)) ? 'on' : ''}"><span class="ico">${n.i}</span>${n.t}</a>`).join('');
  $('#tabbar').innerHTML = NAV.map(n =>
    `<a href="${n.h}" class="${h === n.h || (n.h !== '#/' && h.startsWith(n.h)) ? 'on' : ''}"><span class="ico">${n.i}</span>${n.m || n.t.split(' ')[0]}</a>`).join('');
}

/* ---------- theme ---------- */
function applyTheme() {
  document.documentElement.dataset.theme = S.cfg.theme || 'day';
}
function toggleTheme() {
  const c = S.cfg; c.theme = c.theme === 'night' ? 'day' : 'night'; S.cfg = c; applyTheme(); render();
}

/* ============================================================
   VIEWS
   ============================================================ */
const view = () => $('#view');

function topbar() {
  return `<div class="mobile-top">
    <a class="brand" href="#/" style="padding:0"><span class="brand-mark">${OWL}</span><span class="brand-name">StudyBuddy</span></a>
    <button class="chip" onclick="toggleTheme()">${S.cfg.theme === 'night' ? '☀ Day' : '☾ Night'}</button>
  </div>`;
}

/* ---------------- dashboard ---------------- */
function vDashboard() {
  const all = COURSES.concat(customCourses());
  const studied = Object.keys(S.progress).length;
  const last = store.get('sb.last', null);
  const totalCards = all.reduce((n, c) => n + c.units.reduce((m, u) => m + (u.cards || []).length, 0), 0);
  const totalQs = allQuestions().length;

  const resume = last && findCourse(last.c) ? (() => {
    const c = findCourse(last.c), u = findUnit(c, last.u);
    if (!u) return '';
    return `<div class="card" style="border-left:3px solid ${c.color}">
      <span class="eyebrow">Pick up where you left off</span>
      <h3 style="margin-bottom:2px">${esc(u.title)}</h3>
      <p style="color:var(--ink-soft);font-size:.88rem;margin-bottom:14px">${esc(c.name)}</p>
      <div class="row">
        <a class="btn" href="#/study/${c.id}/${u.id}/cards">Flashcards</a>
        <a class="btn ghost" href="#/study/${c.id}/${u.id}/quiz">Quiz</a>
        <a class="btn ghost" href="#/study/${c.id}/${u.id}/guide">Study guide</a>
      </div>
    </div>`;
  })() : `<div class="card">
      <span class="eyebrow">Start here</span>
      <h3 style="margin-bottom:6px">Nothing studied yet</h3>
      <p style="color:var(--ink-soft);font-size:.9rem;margin-bottom:14px">Pick a course below, or paste your own notes and let the tutor build a deck from them.</p>
      <div class="row"><a class="btn" href="#/courses">Browse courses</a><a class="btn ghost" href="#/tutor">Use my notes</a></div>
    </div>`;

  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Free · no account · no limits</span>
    <h1>Study something <span class="hl">today</span>.</h1>
    <p>Study guides, flashcards, quizzes, and timed practice for AP courses, the SAT, and the ACT — plus a tutor that quizzes you on your own notes.</p>
  </div>

  <div class="grid g2" style="margin-bottom:22px">
    ${resume}
    <div class="card">
      <span class="eyebrow">Your numbers</span>
      <div class="row" style="gap:26px;margin-top:8px">
        <div class="stat"><b>${streakCount()}</b><span>day streak</span></div>
        <div class="stat"><b>${studied}</b><span>units started</span></div>
        <div class="stat"><b>${totalCards}</b><span>cards ready</span></div>
        <div class="stat"><b>${totalQs}</b><span>questions</span></div>
      </div>
      <hr class="divide" style="margin:18px 0">
      <div class="row"><a class="btn mark sm" href="#/tests">Take a timed test</a><button class="chip" onclick="toggleTheme()">${S.cfg.theme === 'night' ? '☀ Day mode' : '☾ Night mode'}</button></div>
    </div>
  </div>

  <div class="spread" style="margin-bottom:10px">
    <span class="eyebrow" style="margin:0">Ready to study now</span>
    <a class="chip" href="#/courses">All ${all.length} courses →</a>
  </div>
  <div class="grid g3">${all.filter(c => !c.outlineOnly).map(courseTile).join('')}</div>`;
}

function courseTile(c) {
  const m = courseMastery(c);
  const nUnits = (c.outline || []).length || c.units.length;
  if (c.outlineOnly) {
    return `<a class="tile" href="#/course/${c.id}" style="--tcolor:${c.color};opacity:.82">
      <span class="tag" style="margin-bottom:8px;display:inline-block">Outline</span>
      <h3>${esc(c.name)}</h3>
      <p class="blurb">${esc(c.blurb)}</p>
      <div class="foot"><span>${nUnits} units listed</span><span>·</span><span>build from your notes</span></div>
    </a>`;
  }
  const built = c.units.length, total = Math.max(nUnits, built);
  return `<a class="tile" href="#/course/${c.id}" style="--tcolor:${c.color}">
    <span class="tag" style="margin-bottom:8px;display:inline-block">${esc(c.exam)}</span>
    <h3>${esc(c.name)}</h3>
    <p class="blurb">${esc(c.blurb)}</p>
    <div class="meter ${m !== null && m >= 80 ? 'good' : ''}"><i style="width:${m || 0}%"></i></div>
    <div class="foot" style="margin-top:8px">
      <span>${built} of ${total} units written</span><span>·</span>
      <span>${m === null ? 'not started' : m + '% mastered'}</span>
    </div>
  </a>`;
}

/* ---------------- course library ---------------- */
const GROUP_ORDER = ['College entrance exams', 'History & Social Science', 'Sciences', 'Math & Computer Science', 'English', 'World Languages', 'Arts', 'Made from your notes', 'Other'];
function vCourses() {
  const filter = store.get('sb.filter', 'ready');
  const all = COURSES.concat(customCourses());
  const shown = filter === 'ready' ? all.filter(c => !c.outlineOnly) : all;
  const written = all.filter(c => !c.outlineOnly).length;
  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Library · ${all.length} courses</span>
    <h1>Courses</h1>
    <p>Every AP course is here. ${written} of them have study guides, flashcards, and quizzes written and ready. The rest list their real College Board units, and you can build any unit from your own notes in about a minute.</p>
  </div>
  <div class="row" style="margin-bottom:18px">
    <button class="chip ${filter === 'ready' ? 'on' : ''}" onclick="setFilter('ready')">Ready to study (${written})</button>
    <button class="chip ${filter === 'all' ? 'on' : ''}" onclick="setFilter('all')">Every course (${all.length})</button>
  </div>
  ${GROUP_ORDER.map(g => {
    const list = shown.filter(c => c.group === g);
    if (!list.length) return '';
    return `<span class="eyebrow" style="margin-top:22px">${esc(g)}</span><div class="grid g3" style="margin-bottom:8px">${list.map(courseTile).join('')}</div>`;
  }).join('')}`;
}
function setFilter(f) { store.set('sb.filter', f); render(); }

/* ---------------- one course ---------------- */
function vCourse(cid) {
  const c = findCourse(cid);
  if (!c) return notFound();
  return topbar() + `
  <a class="crumb" href="#/courses">← All courses</a>
  <div class="page-head fade">
    <span class="eyebrow">${esc(c.exam)} · ${c.units.length ? c.units.length + ' units written' : 'outline'}${(c.outline || []).length ? ' of ' + c.outline.length : ''}</span>
    <h1>${esc(c.name)}</h1>
    ${c.formal && c.formal !== c.name ? `<p style="font-family:'IBM Plex Mono',monospace;font-size:.76rem;letter-spacing:.04em;color:var(--ink-faint);margin:6px 0 8px">${esc(c.formal)}</p>` : ''}
    <p>${esc(c.blurb)}</p>
    ${c.note ? `<div class="note" style="margin-top:14px;max-width:62ch">${esc(c.note)}</div>` : ''}
  </div>
  ${masterReviewCard(c)}
  <div class="grid g2">
    ${c.units.map(u => {
      const m = mastery(c.id, u.id);
      return `<div class="card" style="border-left:3px solid ${c.color}">
        <div class="spread" style="align-items:flex-start">
          <h3 style="max-width:80%">${esc(u.title)}</h3>
          <span class="tag">${m === null ? 'new' : m + '%'}</span>
        </div>
        <div class="meter ${m !== null && m >= 80 ? 'good' : ''}" style="margin:12px 0 14px"><i style="width:${m || 0}%"></i></div>
        <div class="row">
          ${(u.guide || []).length ? `<a class="btn ghost sm" href="#/study/${c.id}/${u.id}/guide">Study guide</a>` : ''}
          ${(u.cards || []).length ? `<a class="btn ghost sm" href="#/study/${c.id}/${u.id}/cards">${u.cards.length} flashcards</a>` : ''}
          ${(u.quiz || []).length ? `<a class="btn sm" href="#/study/${c.id}/${u.id}/quiz">Quiz me</a>` : ''}
          ${(u.cards || []).length ? `<a class="chip" href="#/print/cards/${c.id}/${u.id}">Print</a>` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>
  ${outlineSection(c)}
  ${c.mine ? `<hr class="divide"><button class="btn ghost sm" onclick="deleteDeck('${c.id.slice(3)}')">Delete this deck</button>` : ''}`;
}

/* ---------------- study guide ---------------- */
function vGuide(cid, uid) {
  const c = findCourse(cid), u = findUnit(c, uid);
  if (!u) return notFound();
  store.set('sb.last', { c: cid, u: uid });
  if (!(u.guide || []).length) return topbar() + `<a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a><div class="empty"><div class="big">▤</div>No written guide for this deck yet — try the flashcards.</div>`;
  const terms = (u.cards || []).slice(0, 6);
  const bullets = u.guide.reduce((n, sec) => n + sec.points.length, 0);
  const mins = Math.max(2, Math.round(bullets * 0.28));
  setTimeout(initGuideScroll, 0);
  return topbar() + `
  <div class="readprog" id="readprog"></div>
  <a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a>
  <div class="guide-layout">
    <nav class="guide-toc">
      <span class="eyebrow">In this unit</span>
      ${u.guide.map((sec, i) => `<a href="#sec${i}" data-sec="${i}" onclick="jumpSec(event,${i})">${esc(sec.h)}</a>`).join('')}
      <div style="margin-top:18px;display:flex;flex-direction:column;gap:7px">
        <a class="btn ghost sm" href="#/study/${cid}/${uid}/cards" style="justify-content:center">Flashcards</a>
        <a class="btn sm" href="#/study/${cid}/${uid}/quiz" style="justify-content:center">Quiz me</a>
        <button class="chip" onclick="window.print()" style="justify-content:center">Print guide</button>
      </div>
    </nav>
    <article class="guide-page fade">
      <div class="owl-wm">${OWL}</div>
      <span class="eyebrow">${esc(c.name)} · study guide</span>
      <h1 style="margin-bottom:14px">${esc(u.title)}</h1>
      <p class="lede">${u.guide.length} sections, ${bullets} points, about ${mins} minutes of reading. Anything unclear, press <b>Ask about this</b> in the corner — the tutor answers from this page.</p>
      ${u.guide.map((sec, i) => `<section class="guide-sec" id="sec${i}">
        <h3><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${esc(sec.h)}</span></h3>
        <ul>${sec.points.map(pt => `<li>${pt}</li>`).join('')}</ul>
      </section>`).join('')}

    return { q: q.q, c: mixed.map(p => p.t), a: mixed.findIndex(p => p.correct), why: q.why, tag: q._cn ? q._cn + ' · ' + q._un : '' };

/* ============================================================
   AI TUTOR — works with or without an API key
   ============================================================ */
const STOP = new Set('the a an and or but of to in for on with is are was were be been being that this these those it its as at by from into than then so such not no can may might will would should could have has had do does did which who whom whose what when where why how all any both each few more most other some only own same too very just also about above after again against because before below between during further here once other over under until while'.split(' '));

function localCards(text) {
  const out = [], seen = new Set();
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const seps = [/\s+[—–]\s+/, /\s+-\s+/, /:\s+/, /\s+=\s+/, /\s+\u2013\s+/];
  lines.forEach(line => {
    const clean = line.replace(/^[-*•\d.)\s]+/, '').trim();
    for (const sep of seps) {
      const m = clean.split(sep);
      if (m.length >= 2 && m[0].length >= 2 && m[0].length <= 70 && m.slice(1).join(' ').length > 8) {
        const front = m[0].trim(), back = m.slice(1).join(' ').trim();
        if (!seen.has(front.toLowerCase())) { seen.add(front.toLowerCase()); out.push([front, back]); }
        return;
      }
    }
  });
  if (out.length >= 4) return out;
  /* fall back to cloze deletion on sentences */
  const sentences = text.replace(/\n/g, ' ').split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.split(' ').length >= 7);
  sentences.slice(0, 40).forEach(s => {
    const words = s.split(/\s+/);
    let best = null;
    words.forEach((w, i) => {
      const bare = w.replace(/[^A-Za-z-]/g, '');
      if (bare.length < 5 || STOP.has(bare.toLowerCase())) return;
      const score = bare.length + (/^[A-Z]/.test(bare) && i > 0 ? 6 : 0);
      if (!best || score > best.score) best = { w: bare, score, i };
    });
    if (!best) return;
    const blanked = words.map((w, i) => i === best.i ? '________' : w).join(' ');
    if (!seen.has(best.w.toLowerCase())) { seen.add(best.w.toLowerCase()); out.push([blanked, best.w]); }
  });
  return out;
}
function localQuiz(cards) {
  if (cards.length < 4) return [];
  return shuffle(cards).slice(0, 20).map(card => {
    const wrong = shuffle(cards.filter(c => c[0] !== card[0])).slice(0, 3).map(c => c[1]);
    if (wrong.length < 3) return null;
    const choices = shuffle([card[1], ...wrong]);
    return { q: card[0].includes('________') ? 'Fill in the blank: ' + card[0] : `Which best matches "${card[0]}"?`, c: choices, a: choices.indexOf(card[1]), why: `${card[0].includes('________') ? 'The missing term is' : card[0] + ' —'} ${card[1]}` };
  }).filter(Boolean);
}

async function askClaude(messages, system) {
  const cfg = S.cfg;
  const headers = { 'content-type': 'application/json' };
  if (cfg.key) {
    headers['x-api-key'] = cfg.key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', headers,
    body: JSON.stringify({ model: cfg.model || 'claude-sonnet-4-6', max_tokens: 2000, system, messages })
  });
  if (!r.ok) throw new Error('API returned ' + r.status);
  const d = await r.json();
  return (d.content || []).map(b => b.type === 'text' ? b.text : '').join('\n').trim();
}
function parseJSON(t) {
  const clean = t.replace(/```json|```/g, '').trim();
  const s = clean.indexOf('['), e = clean.lastIndexOf(']');
  const o = clean.indexOf('{'), oe = clean.lastIndexOf('}');
  try { return JSON.parse(clean); } catch (err) {}
  if (s > -1 && e > s) { try { return JSON.parse(clean.slice(s, e + 1)); } catch (err) {} }
  if (o > -1 && oe > o) { try { return JSON.parse(clean.slice(o, oe + 1)); } catch (err) {} }
  return null;
}

  const text = material();

  if (text.length < 60) { out.innerHTML = `<div class="note">Paste at least a few sentences of material first — the generator needs something to work with.</div>`; return; }

  const list = S.custom;
  list.push({ id: String(Date.now()), name: ($('#dname').value || 'My deck').slice(0, 60), cards: TUTOR.gen.cards, quiz: TUTOR.gen.quiz, note: 'Built from your notes.' });
