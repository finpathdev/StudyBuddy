/* ---- spoken-style drilling ---- */
function pushMsg(role, content) {
  TUTOR.msgs.push({ role, content });
  const c = $('#chat');
  if (c) {
    if (TUTOR.msgs.length === 1) c.innerHTML = '';
    c.insertAdjacentHTML('beforeend', `<div class="msg ${role === 'user' ? 'me' : 'ai'} fade">${esc(content)}</div>`);
    c.scrollTop = c.scrollHeight;
  }
}
function startDrill() {
  const text = material();
  if (text.length < 60) { pushMsg('assistant', 'Paste some material into the box on the left first, then I can quiz you on it.'); return; }
  TUTOR.msgs = []; $('#chat').innerHTML = '';
  if (S.cfg.key) {
    TUTOR.mode = 'ai';
    TUTOR.api = [];
    pushMsg('assistant', 'Got it. I will ask one question at a time. Answer in your own words and I will tell you what you missed.');
    aiTurn('Start quizzing me on this material. Ask your first question.');
  } else {
    TUTOR.mode = 'local';
    TUTOR.drill = shuffle(localCards(text)).slice(0, 20);
    TUTOR.di = 0;
    if (!TUTOR.drill.length) { pushMsg('assistant', 'I could not pull terms out of that. Try writing a few lines as "term — definition" and press the button again.'); return; }
    pushMsg('assistant', `Ready — ${TUTOR.drill.length} questions from your notes. Answer in your own words.`);
    askLocal();
  }
}
function askLocal() {
  if (TUTOR.di >= TUTOR.drill.length) { pushMsg('assistant', 'That is the whole set. Press "Quiz me out loud" to run it again, or save it as a deck on the left.'); return; }
  const c = TUTOR.drill[TUTOR.di];
  pushMsg('assistant', c[0].includes('________') ? `Fill in the blank: ${c[0]}` : `What does this mean: ${c[0]}?`);
}
function gradeLocal(answer, correct) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w && !STOP.has(w));
  const a = new Set(norm(answer)), b = norm(correct);
  if (!b.length) return 0;
  const hit = b.filter(w => a.has(w) || [...a].some(x => x.length > 4 && (x.startsWith(w.slice(0, 5)) || w.startsWith(x.slice(0, 5))))).length;
  return hit / b.length;
}
async function sendChat() {
  const inp = $('#chatin'); const t = inp.value.trim();
  if (!t) return;
  inp.value = '';
  pushMsg('user', t);
  if (TUTOR.mode === 'local' && TUTOR.drill) {
    const c = TUTOR.drill[TUTOR.di];
    if (!c) return;
    const score = gradeLocal(t, c[1]);
    pushMsg('assistant', score >= 0.5 ? `Right — ${c[1]}` : score >= 0.25 ? `Close. The full answer: ${c[1]}` : `Not quite. ${c[0].includes('________') ? 'The missing term is' : 'It means'}: ${c[1]}`);
    TUTOR.di++; bumpStreak();
    setTimeout(askLocal, 350);
    return;
  }
  if (S.cfg.key) { aiTurn(t); return; }
  pushMsg('assistant', 'Press "Quiz me out loud" to start a round from your notes, or add an API key in Settings for open-ended conversation.');
}
async function aiTurn(userText) {
  const c = $('#chat');
  c.insertAdjacentHTML('beforeend', `<div class="msg ai" id="think"><span class="spin"></span></div>`);
  c.scrollTop = c.scrollHeight;
  try {
    /* the API requires an alternating history that begins with a user turn */
    TUTOR.api.push({ role: 'user', content: userText });
    const history = TUTOR.api.slice(-12);
    while (history.length && history[0].role !== 'user') history.shift();
    const reply = await askClaude(history,
      `You are a patient tutor quizzing a student on material they provided. Ask ONE question at a time. After each answer, say briefly whether it was right, fill in what was missing, then ask the next question. Keep replies under 90 words. Never dump the whole answer key at once.\n\nThe student's material:\n${TUTOR.material.slice(0, 12000)}`);
    document.getElementById('think')?.remove();
    TUTOR.api.push({ role: 'assistant', content: reply || '…' });
    pushMsg('assistant', reply || 'No reply came back. Try again.');
    bumpStreak();
  } catch (e) {
    document.getElementById('think')?.remove();
    TUTOR.api.pop();
    pushMsg('assistant', `Could not reach the API (${e.message}). Check your key in Settings, or clear it to use the built-in generator instead.`);
  }
}

<script>
/* ============================================================
   ASK DOCK
   A tutor that lives on the study pages and answers from the
   material in front of the student. Works with no API key by
   searching the unit's own guide and flashcards; with a key it
   answers in full sentences, still grounded in the same text.
   ============================================================ */
const OWL = `<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28" stroke-width="2.2"/><path d="M17 22.5 21.5 15 27 20M47 22.5 42.5 15 37 20"/><circle cx="24.5" cy="28" r="7.5"/><circle cx="39.5" cy="28" r="7.5"/><circle cx="24.5" cy="28" r="2.3" fill="currentColor" stroke="none"/><circle cx="39.5" cy="28" r="2.3" fill="currentColor" stroke="none"/><path d="M32 32.5 29.5 36.5 32 38 34.5 36.5Z"/><path d="M17.5 30.5C15.5 41 21 50 32 50s16.5-9 14.5-19.5"/><path d="M22 38c-1 5 1.5 8.5 4 9.5M42 38c1 5-1.5 8.5-4 9.5"/></g></svg>`;

const ASK = { open: false, msgs: [], ctx: null, busy: false };

/* strip the <b>/<i> tags out of guide bullets for searching and prompting */
const plain = h => String(h).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();

function currentUnit() {
  const m = (location.hash || '').match(/^#\/study\/([^/?]+)\/([^/?]+)/);
  if (!m) return null;
  const c = findCourse(m[1]);
  const u = findUnit(c, m[2]);
  return u ? { c, u } : null;
}

/* ---------- keyword search over the unit, no API needed ---------- */
function tokens(s) {
  return plain(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w));
}
function scoreAgainst(qTokens, text) {
  const t = tokens(text);
  if (!t.length) return 0;
  const set = new Set(t);
  let hits = 0;
  qTokens.forEach(w => {
    if (set.has(w)) { hits += 1; return; }
    for (const x of set) {
      if (x.length > 4 && w.length > 4 && (x.startsWith(w.slice(0, 5)) || w.startsWith(x.slice(0, 5)))) { hits += 0.6; return; }
    }
  });
  return hits / Math.sqrt(qTokens.length || 1);
}
function localAnswer(ctx, question) {
  const q = tokens(question);
  if (!q.length) return { text: 'Ask about a term or idea from this unit and I will find it for you.', src: null };
  const hits = [];
  (ctx.u.cards || []).forEach(card => {
    /* a question naming a term should strongly prefer that term's card */
    const s = scoreAgainst(q, card[0]) * 2.2 + scoreAgainst(q, card[1]) * 0.7;
    if (s > 0) hits.push({ s, text: `${card[0]} — ${card[1]}`, src: 'flashcard' });
  });
  (ctx.u.guide || []).forEach(sec => sec.points.forEach(pt => {
    const s = scoreAgainst(q, pt) + scoreAgainst(q, sec.h) * 0.5;
    if (s > 0) hits.push({ s, text: plain(pt), src: 'study guide · ' + sec.h });
  }));
  hits.sort((a, b) => b.s - a.s);
  if (!hits.length || hits[0].s < 0.5) {
    return {
      text: `I could not find that in this unit. It may be covered elsewhere in ${ctx.c.name} — or add a Claude API key in Settings and I can explain it properly instead of just searching.`,
      src: null
    };
  }
  const top = hits.slice(0, 3).filter((h, i) => i === 0 || h.s > hits[0].s * 0.55);
  return { text: top.map(h => h.text).join('\n\n'), src: top[0].src };
}

/* ---------- grounded answer with a key ---------- */
async function apiAnswer(ctx, question) {
  const material = [
    `COURSE: ${ctx.c.name}`,
    `UNIT: ${ctx.u.title}`,
    '',
    'STUDY GUIDE:',
    ...(ctx.u.guide || []).map(sec => `## ${sec.h}\n` + sec.points.map(p => '- ' + plain(p)).join('\n')),
    '',
    'KEY TERMS:',
    ...(ctx.u.cards || []).map(c => `- ${c[0]}: ${c[1]}`)
  ].join('\n');
  const history = ASK.msgs.filter(m => m.role === 'user' || m.role === 'assistant').slice(-8);
  history.push({ role: 'user', content: question });
  while (history.length && history[0].role !== 'user') history.shift();
  return askClaude(history,
    `You are a tutor helping a high school or college student who is reading the study material below. Answer their question using this material first. If the answer is not in it, say so plainly in one sentence and then give a short correct answer from your own knowledge, clearly marked as outside the unit.

Rules: keep answers under 120 words. Use plain language. Give a concrete example when it helps. Never invent facts about the exam. If the student seems confused about a distinction, name both sides of it directly.

MATERIAL:
${material}`);
}

/* ---------- UI ---------- */
function afterRender() {
  document.getElementById('askfab')?.remove();
  document.getElementById('askpanel')?.remove();
  if (typeof mountInstallFab === 'function') mountInstallFab();
  const ctx = currentUnit();
  if (!ctx) { ASK.open = false; ASK.ctx = null; return; }
  if (!ASK.ctx || ASK.ctx.u !== ctx.u) { ASK.msgs = []; ASK.ctx = ctx; }
  document.body.insertAdjacentHTML('beforeend', ASK.open ? askPanelHTML() : askFabHTML());
  if (ASK.open) paintAsk();
}
function askFabHTML() {
  return `<button class="ask-fab" id="askfab" onclick="toggleAsk(true)">${OWL}<span>Ask about this</span></button>`;
}
function askPanelHTML() {
  const ctx = ASK.ctx;
  return `<div class="ask-panel fade" id="askpanel">
    <div class="ask-head">
      <span class="owl">${OWL}</span>
      <span><b>Ask about this unit</b><small>${esc(ctx.u.title)}</small></span>
      <button onclick="toggleAsk(false)" title="Close">✕</button>
    </div>
    <div class="ask-body" id="askbody"></div>
    <div class="ask-foot">
      <input type="text" id="askin" placeholder="What does this mean?" onkeydown="if(event.key==='Enter')sendAsk()">
      <button class="btn sm" onclick="sendAsk()">Ask</button>
    </div>
  </div>`;
}
function toggleAsk(open) {
  ASK.open = open;
  afterRender();
  if (open) setTimeout(() => $('#askin')?.focus(), 60);
}
function paintAsk() {
  const b = $('#askbody'); if (!b) return;
  const ctx = ASK.ctx;
  if (!ASK.msgs.length) {
    const picks = shuffle((ctx.u.cards || []).map(c => c[0])).slice(0, 3);
    b.innerHTML = `<div class="msg ai">Ask me anything about <b>${esc(ctx.u.title)}</b>. I answer from the study guide and flashcards on this page${S.cfg.key ? '' : ', so I am looking things up rather than chatting — add a key in Settings for full explanations'}.</div>
      ${picks.length ? `<div class="ask-suggest">${picks.map(p => `<button onclick="askThis(${JSON.stringify('What is ' + p + '?').replace(/"/g, '&quot;')})">What is ${esc(p)}?</button>`).join('')}</div>` : ''}`;
    return;
  }
  b.innerHTML = ASK.msgs.map(m => m.role === 'user'
    ? `<div class="msg me">${esc(m.content)}</div>`
    : `<div class="msg ai">${esc(m.content)}${m.src ? `<span class="ask-src">from the ${esc(m.src)}</span>` : ''}</div>`).join('')
    + (ASK.busy ? `<div class="msg ai"><span class="spin"></span></div>` : '');
  b.scrollTop = b.scrollHeight;
}
function askThis(q) { const i = $('#askin'); if (i) i.value = q; sendAsk(); }
async function sendAsk() {
  const inp = $('#askin'); if (!inp) return;
  const q = inp.value.trim();
  if (!q || ASK.busy) return;
  inp.value = '';
  ASK.msgs.push({ role: 'user', content: q });
  const ctx = ASK.ctx;
  if (!S.cfg.key) {
    const a = localAnswer(ctx, q);
    ASK.msgs.push({ role: 'assistant', content: a.text, src: a.src });
    paintAsk(); bumpStreak();
    return;
  }
  ASK.busy = true; paintAsk();
  try {
    const reply = await apiAnswer(ctx, q);
    ASK.msgs.push({ role: 'assistant', content: reply || 'No answer came back. Try rephrasing.' });
    bumpStreak();
  } catch (e) {
    const a = localAnswer(ctx, q);
    ASK.msgs.push({ role: 'assistant', content: `Could not reach the API (${e.message}), so here is what the unit says:\n\n${a.text}`, src: a.src });
  }
  ASK.busy = false; paintAsk();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ASK.open) toggleAsk(false);
});
</script>
<script>
/* ============================================================
   CONFIG — edit these two blocks, nothing else
   ============================================================ */
const CONFIG = {
  /* Live visitor counter. Uses CounterAPI, a free keyless service.
     Change `name` to something unique to you before you deploy, or the
     numbers will be shared with anyone else running this file. */
  counter: {
    enabled: true,
    workspace: 'studybuddy',
    name: 'finpathdev-studybuddy'
  },
  /* Optional email signup. Make a free form at formspree.io, paste the
     endpoint here, and a signup box appears on the Students page. */
  signup: {
    enabled: false,
    endpoint: ''   // e.g. 'https://formspree.io/f/xxxxxxxx'
  }
};

/* ---------- local tallies ---------- */
function tally(k) {
  const t = store.get('sb.tally', { cards: 0, questions: 0 });
  t[k] = (t[k] || 0) + 1;
  store.set('sb.tally', t);
}

/* ============================================================
   MASTER REVIEW — a cumulative exam across every written unit
   ============================================================ */
function courseQuestions(cid) {
  const c = findCourse(cid);
  if (!c) return [];
  const out = [];
  c.units.forEach(u => (u.quiz || []).forEach(q => out.push(Object.assign({}, q, { _cn: c.short, _un: u.title }))));
  return out;
}
function masterReviewCard(c) {
  const n = courseQuestions(c.id).length;
  if (n < 10) return '';
  const f = c.fmt || {};
  return `<div class="card" style="border-left:3px solid ${c.color};margin-bottom:18px">
    <div class="spread">
      <div style="max-width:60ch">
        <span class="eyebrow">Master review</span>
        <h3 style="margin-bottom:6px">Every unit at once, on the clock</h3>
        <p style="color:var(--ink-soft);font-size:.9rem;margin:0">
          Pulls from all ${n} questions across this course, shuffled, with no feedback until the end${f.q ? ` — timed to match the real multiple-choice section (${f.q} questions in ${f.min} minutes)` : ''}.
        </p>
      </div>
      <a class="btn mark" href="#/exam/${c.id}">Start master review</a>
    </div>
  </div>`;
}
function vMasterReview(cid) {
  const c = findCourse(cid);
  if (!c) return notFound();
  const pool = courseQuestions(cid);
  if (pool.length < 5) return notFound();
  const f = c.fmt || { q: 40, min: 50 };
  /* the real section length, scaled down to the questions that exist */
  const count = Math.min(f.q || 40, pool.length);
  const mins = f.min && f.q ? Math.max(5, Math.round(f.min * (count / f.q))) : 20;
  return topbar() + `
  <a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a>
  <div class="page-head fade">
    <span class="eyebrow">Master review</span>
    <h1>${esc(c.name)}</h1>
    <p>Cumulative review across every written unit. Answers lock as you go and explanations wait until the end, the way the real exam works.</p>
  </div>
  <div class="card" style="max-width:600px">
    <div class="row" style="gap:26px;margin-bottom:18px">
      <div class="stat"><b>${count}</b><span>questions</span></div>
      <div class="stat"><b>${mins}</b><span>minutes</span></div>
      <div class="stat"><b>${c.units.length}</b><span>units covered</span></div>
    </div>

    <div class="row">
      <button class="btn" onclick="runMaster('${cid}',${count},${mins})">Start · ${mins} minutes</button>
      <button class="btn ghost" onclick="runMaster('${cid}',${count},0)">Start untimed</button>
    </div>
  </div>`;
}
function runMaster(cid, count, mins) {
  const c = findCourse(cid);
  const qs = prepQuestions(courseQuestions(cid)).slice(0, count);
  QZ = {
    cid: null, uid: null, title: mins ? `${qs.length} questions · ${mins} minutes` : `${qs.length} questions`,
    sub: c.name + ' · master review', qs, i: 0, right: 0, marks: [], answered: false,

/* ============================================================
   OUTLINE UNITS — the rest of the course, buildable from notes
   ============================================================ */
function outlineSection(c) {
  const outline = c.outline || [];
  if (!outline.length) return '';
  /* Match on the unit number rather than the full title. A written unit called
     "Units 1-2 - The Global Tapestry" covers catalog units 1 and 2, and small
     wording differences never cause a finished unit to look missing. */
  const keysOf = title => {
    const m = String(title).match(/^\s*(units?|periods?|big idea|content area)\s+([\d\s,\u2013\u2014-]+)/i);
    if (!m) return new Set();
    const kind = m[1].toLowerCase().replace(/s$/, '');
    const out = new Set();
    m[2].split(',').forEach(part => {
      const r = part.trim().match(/^(\d+)\s*[\u2013\u2014-]\s*(\d+)$/);
      if (r) { for (let i = +r[1]; i <= +r[2]; i++) out.add(kind + ':' + i); }
      else { const n = part.trim().match(/\d+/); if (n) out.add(kind + ':' + n[0]); }
    });
    return out;
  };
  const writtenKeys = new Set();
  const writtenTitles = c.units.map(u => u.title.toLowerCase());
  c.units.forEach(u => keysOf(u.title).forEach(k => writtenKeys.add(k)));
  const remaining = outline.filter(t => {
    if (writtenTitles.some(w => w === t.toLowerCase())) return false;
    const ks = keysOf(t);
    if (ks.size && [...ks].every(k => writtenKeys.has(k))) return false;
    return true;
  });
  if (!remaining.length) return '';
  const heading = c.outlineOnly ? 'Course units' : 'The rest of this course';
  const blurb = c.outlineOnly
    ? 'These are the real College Board units for this course. StudyBuddy has not written material for them yet — but paste your class notes for any unit and it will build you a deck and a quiz in a few seconds.'
    : 'These units do not have written material yet. Paste your notes for any of them and StudyBuddy will build the deck for you.';
  return `<hr class="divide">
  <span class="eyebrow">${heading}</span>
  <h2 style="margin-bottom:8px">${remaining.length} unit${remaining.length > 1 ? 's' : ''} you can build yourself</h2>
  <p style="color:var(--ink-soft);max-width:64ch;margin-bottom:16px">${blurb}</p>
  <div class="grid g2">
    ${remaining.map(t => `<div class="card" style="padding:14px 16px">
      <div class="spread" style="gap:10px">
        <span style="font-weight:600;font-size:.93rem;max-width:64%">${esc(t)}</span>
        <a class="btn ghost sm" href="#/tutor?for=${encodeURIComponent(c.name + ' — ' + t)}">Build it</a>
      </div>
    </div>`).join('')}
  </div>`;
}

/* ============================================================
   VISITOR COUNTER
   GitHub Pages has no server, so counts come from a free third-party
   API. If it is unreachable the page shows local numbers instead of a
   frozen fake total.
   ============================================================ */
const Counter = {
  base: 'https://api.counterapi.dev/v1',
  async call(name, action) {
    const c = CONFIG.counter;
    const url = `${this.base}/${encodeURIComponent(c.workspace)}/${encodeURIComponent(c.name + '-' + name)}${action ? '/' + action : ''}`;
    const r = await fetch(url, { method: 'GET' });
    if (!r.ok) throw new Error('counter ' + r.status);
    const d = await r.json();
    const v = d.count ?? d.value ?? (d.data && (d.data.count ?? d.data.up_count));
    if (typeof v !== 'number') throw new Error('unexpected counter response');
    return v;
  },
  async register() {
    if (!CONFIG.counter.enabled) return null;
    const firstEver = !store.get('sb.seen', false);
    if (firstEver) store.set('sb.seen', true);
    let newSession = true;
    try {
      if (sessionStorage.getItem('sb.session')) newSession = false;
      else sessionStorage.setItem('sb.session', '1');
    } catch (e) {}
    const out = {};
    try {
      out.visits = await this.call('visits', newSession ? 'up' : '');
      out.devices = firstEver ? await this.call('devices', 'up') : await this.call('devices', '');
      out.live = true;
    } catch (e) {
      out.live = false; out.error = e.message;
    }
    out.returning = !firstEver;
    return out;
  }
};
let COUNTS = null;
function initCounter() {
  if (!CONFIG.counter.enabled) return;
  Counter.register().then(r => {
    COUNTS = r;
    if (location.hash.startsWith('#/stats')) render();
  }).catch(() => {});
}

<script>
/* ============================================================
   LEITNER SPACED REPETITION (3 boxes)
   Box 1 → review today. Box 2 → in 3 days. Box 3 → in 7 days.
   Right answer promotes one box, wrong answer drops to box 1.
   ============================================================ */
const Leitner = {
  GAP: { 1: 0, 2: 3, 3: 7 },
  all() { return store.get('sb.leitner', {}); },
  save(m) { store.set('sb.leitner', m); },
  plus(days) { return new Date(Date.now() + days * 864e5).toISOString().slice(0, 10); },
  get(k) { return this.all()[k] || null; },
  grade(k, correct, meta) {
    const m = this.all();
    const cur = m[k] || { box: 1, seen: 0 };
    const box = correct ? Math.min(3, (cur.box || 1) + 1) : 1;
    m[k] = { box, due: this.plus(this.GAP[box]), seen: (cur.seen || 0) + 1, last: today(), ...(meta || cur.meta ? { meta: meta || cur.meta } : {}) };
    this.save(m);
    return box;
  },
  counts() {
    const c = { 1: 0, 2: 0, 3: 0, due: 0, total: 0 };
    const t = today();
    Object.values(this.all()).forEach(v => {
      c.total++; c[v.box] = (c[v.box] || 0) + 1;
      if (!v.due || v.due <= t) c.due++;
    });
    return c;
  },
  /* every card in the app that is scheduled and due now */
  dueCards() {
    const m = this.all(), t = today(), out = [];
    COURSES.concat(customCourses()).forEach(c => c.units.forEach(u => {
      (u.cards || []).forEach((card, i) => {
        const k = 'card:' + c.id + '/' + u.id + '/' + i;
        const rec = m[k];
        if (rec && (!rec.due || rec.due <= t)) out.push({ k, card, cid: c.id, uid: u.id, cn: c.short, un: u.title, box: rec.box });
      });
    }));
    return out;
  }
};

/* flashcards feed the schedule */
const _markCard = markCard;
markCard = function (known) {
  if (DECK) {
    const idx = DECK.order[DECK.i];
    if (idx !== undefined) Leitner.grade('card:' + DECK.cid + '/' + DECK.uid + '/' + idx, known);
  }
  return _markCard(known);
};
/* quizzes feed it too */
const _answerL = answer;
answer = function (i) {
  if (QZ && !QZ.answered) {
    const q = QZ.qs[QZ.i];
    if (q) Leitner.grade('q:' + qid(q.q), i === q.a);
  }
  return _answerL(i);
};

/* ---- due review session ---- */
function vReview() {
  const due = Leitner.dueCards();
  const c = Leitner.counts();
  if (!due.length) {
    return topbar() + `
    <div class="page-head fade"><span class="eyebrow">Spaced repetition</span><h1>Nothing due today</h1>
    <p>Cards come back on a schedule: miss one and it returns tomorrow, get it right and it waits 3 days, then 7. Studying any deck adds cards to the schedule.</p></div>
    ${leitnerBoxes()}
    <div class="empty" style="margin-top:20px"><div class="big">◷</div>
      <p>${c.total ? 'Everything scheduled is resting. Come back tomorrow.' : 'Study a flashcard deck and cards start appearing here.'}</p>
      <a class="btn" href="#/courses">Pick a deck</a></div>`;
  }
  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Spaced repetition</span>
    <h1><span class="hl">${due.length}</span> card${due.length > 1 ? 's' : ''} due today</h1>
    <p>These are the cards the schedule says you are about to forget. Working through them is the highest-value ten minutes available to you today.</p>
  </div>
  ${leitnerBoxes()}
  <div class="card" style="margin-top:16px;max-width:560px">
    <p style="color:var(--ink-soft);font-size:.9rem;margin-bottom:14px">Pulled from ${new Set(due.map(d => d.cn)).size} course${new Set(due.map(d => d.cn)).size > 1 ? 's' : ''}, shuffled together.</p>
    <button class="btn mark" onclick="startReview()">Start review · ${due.length} cards</button>
  </div>`;
}
function leitnerBoxes() {
  const c = Leitner.counts();
  return `<div class="boxes" style="max-width:560px">
    <div class="lbox b1"><b>${c[1] || 0}</b><span>Box 1 · daily</span></div>
    <div class="lbox b2"><b>${c[2] || 0}</b><span>Box 2 · 3 days</span></div>
    <div class="lbox b3"><b>${c[3] || 0}</b><span>Box 3 · 7 days</span></div>
  </div>`;
}
function startReview() {
  const due = shuffle(Leitner.dueCards());
  DECK = {
    cid: null, uid: null, review: true, i: 0, flipped: false,
    order: due.map((_, i) => i), cards: due.map(d => d.card), keys: due.map(d => d.k),
    labels: due.map(d => d.cn + ' · ' + d.un), missed: []
  };
  view().innerHTML = topbar() + `<a class="crumb" href="#/review">← Spaced repetition</a>
    <div class="page-head fade"><span class="eyebrow">Due today</span><h1>Review session</h1></div>
    <div class="deck-wrap" id="deckwrap"></div>`;
  paintCard();
}

/* ============================================================
   BACKUP AND RESTORE
   ============================================================ */
const BACKUP_KEYS = ['sb.progress', 'sb.cards', 'sb.streak', 'sb.custom', 'sb.last', 'sb.missed', 'sb.leitner', 'sb.tally'];
function collectData() {
  const out = { app: 'StudyBuddy', version: 2, exported: new Date().toISOString(), data: {} };
  BACKUP_KEYS.forEach(k => { const v = store.get(k, null); if (v !== null) out.data[k] = v; });
  return out;
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(collectData(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `studybuddy-backup-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function restoreBackup(file, mode) {
  const msg = $('#restoremsg');
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const j = JSON.parse(reader.result);
      if (!j || j.app !== 'StudyBuddy' || !j.data) throw new Error('That is not a StudyBuddy backup file.');
      if (mode === 'replace') {
        BACKUP_KEYS.forEach(k => { if (j.data[k] !== undefined) store.set(k, j.data[k]); });
      } else {
        /* merge: keep the better result for every unit, union everything else */
        const p = store.get('sb.progress', {}), np = j.data['sb.progress'] || {};
        Object.entries(np).forEach(([k, v]) => {
          p[k] = (!p[k] || v.best > p[k].best) ? v : p[k];
        });
        store.set('sb.progress', p);
        const miss = store.get('sb.missed', {}), nm = j.data['sb.missed'] || {};
        Object.entries(nm).forEach(([k, v]) => {
          miss[k] = miss[k] ? { ...v, n: Math.max(v.n, miss[k].n) } : v;
        });
        store.set('sb.missed', miss);
        const lt = store.get('sb.leitner', {}), nl = j.data['sb.leitner'] || {};
        Object.entries(nl).forEach(([k, v]) => {
          /* the lower box is the safer assumption when two devices disagree */
          lt[k] = lt[k] ? (v.box < lt[k].box ? v : lt[k]) : v;
        });
        store.set('sb.leitner', lt);
        const cust = store.get('sb.custom', []), nc = j.data['sb.custom'] || [];
        const ids = new Set(cust.map(d => d.id));
        nc.forEach(d => { if (!ids.has(d.id)) cust.push(d); });
        store.set('sb.custom', cust);
        const t = store.get('sb.tally', { cards: 0, questions: 0 }), nt = j.data['sb.tally'] || {};
        store.set('sb.tally', { cards: Math.max(t.cards || 0, nt.cards || 0), questions: Math.max(t.questions || 0, nt.questions || 0) });
      }
      msg.innerHTML = `<p style="color:var(--green);font-size:.85rem;margin:10px 0 0">Restored from ${esc((j.exported || '').slice(0, 10))}. Reloading…</p>`;
      setTimeout(() => location.reload(), 900);
    } catch (e) {
      msg.innerHTML = `<p style="color:var(--margin);font-size:.85rem;margin:10px 0 0">${esc(e.message)}</p>`;
    }
  };
  reader.onerror = () => { msg.innerHTML = `<p style="color:var(--margin);font-size:.85rem;margin:10px 0 0">Could not read that file.</p>`; };
  reader.readAsText(file);
}

/* ============================================================

function b64e(str) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(str)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64d(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s + '==='.slice((s.length + 3) % 4));
  return new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)));
}

function saveImport(raw) {

<script>
/* ============================================================
   SUPABASE — sign in, cloud sync, live group study
   Only the PUBLISHABLE key belongs here. It is designed to be
   public and is gated by Row Level Security. A secret key
   (sb_secret_...) must never appear in this file.
   ============================================================ */
CONFIG.supabase = {
  /* Base project URL only — no /rest/v1 on the end. Paths like
     /rest/v1/ or /auth/v1/ are stripped automatically below, since
     the Supabase dashboard shows the REST URL in several places. */
  url: 'https://xknuowthtkgrzwedklfu.supabase.co',
  publishableKey: 'sb_publishable_UE8ZBYXw6oO1L1h_1ZKNzQ_34Ys_6DF'
};

/* accept a REST or auth endpoint and reduce it to the project origin */
(function normalizeSupabaseUrl() {
  let u = (CONFIG.supabase.url || '').trim();
  if (!u) return;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { u = new URL(u).origin; } catch (e) { u = u.replace(/\/(rest|auth|realtime|storage)\/v\d.*$/i, '').replace(/\/+$/, ''); }
  CONFIG.supabase.url = u;
})();

const SB = { client: null, user: null, ready: false, error: null };
function sbConfigured() { return !!(CONFIG.supabase.url && CONFIG.supabase.publishableKey); }

async function sbClient() {
  if (SB.client) return SB.client;
  if (!sbConfigured()) throw new Error('Supabase project URL is not set');
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  SB.client = createClient(CONFIG.supabase.url, CONFIG.supabase.publishableKey, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  return SB.client;
}
async function sbInit() {
  if (!sbConfigured()) return;
  try {
    const c = await sbClient();
    const { data } = await c.auth.getSession();
    SB.user = data.session ? data.session.user : null;
    SB.ready = true;
    c.auth.onAuthStateChange((_e, s) => {
      SB.user = s ? s.user : null;
      if (location.hash.startsWith('#/account')) render();
    });
    if (SB.user) pullCloud();
  } catch (e) { SB.error = e.message; }
}

/* ---------------- connection test ----------------
   Runs without the JS client so it still reports usefully when the
   CDN is blocked. Checks the URL, the key, whether the progress
   table exists, and whether Row Level Security is actually on. */
async function testSupabase() {
  const box = $('#sbtest');
  const line = (txt, kind) => `<p style="font-size:.85rem;margin:6px 0 0;color:${kind === 'ok' ? 'var(--green)' : kind === 'warn' ? 'var(--margin)' : 'var(--ink-soft)'}">${txt}</p>`;
  box.innerHTML = `<p style="font-size:.85rem;margin:10px 0 0"><span class="spin"></span> Checking…</p>`;
  const base = CONFIG.supabase.url, key = CONFIG.supabase.publishableKey;
  const out = [];
  out.push(line('Project URL: <span class="mono">' + esc(base) + '</span>'));
  try {
    const r = await fetch(base + '/rest/v1/progress?select=user_id&limit=1', {
      headers: { apikey: key, Authorization: 'Bearer ' + key }
    });
    if (r.status === 401 || r.status === 403) {
      out.push(line('✕ The key was rejected. Check the publishable key in CONFIG.supabase.', 'warn'));
    } else if (r.status === 404) {
      out.push(line('✕ No <b>progress</b> table. Run the SQL from the README in the Supabase SQL editor.', 'warn'));
    } else if (r.ok) {
      const rows = await r.json();
      out.push(line('✓ Connected, and the <b>progress</b> table exists.', 'ok'));
      if (Array.isArray(rows) && rows.length) {
        out.push(line('⚠ <b>Row Level Security looks off.</b> A signed-out request just read a row. Anyone could read every student\u2019s data. Run the policy SQL before letting anyone sign in.', 'warn'));
      } else {
        out.push(line('✓ Signed-out reads return nothing, which is what Row Level Security should do.', 'ok'));
      }
    } else {
      const body = await r.text();
      out.push(line('✕ Unexpected response ' + r.status + ': ' + esc(body.slice(0, 160)), 'warn'));
    }
  } catch (e) {
    out.push(line('✕ Could not reach the project: ' + esc(e.message) + '. Check the URL and that you are online.', 'warn'));
  }
  box.innerHTML = out.join('');
}

/* ---------------- account ---------------- */
function vAccount() {
  if (!sbConfigured()) {
    return topbar() + `

      <p style="color:var(--ink-soft);font-size:.9rem">Open <b>index.html</b>, find <b>CONFIG.supabase</b> near the bottom, and paste your project URL. Find it in Supabase under Project Settings → API. It looks like <span class="mono">https://abcdefghijk.supabase.co</span></p>
      <div class="note" style="margin-top:14px">Only the <b>publishable</b> key goes in this file. A secret key would give anyone who views the page full access to your database.</div>
      <hr class="divide">

        <p style="color:var(--ink-faint);font-size:.82rem">${last ? 'Last synced ' + esc(last) : 'Not synced yet'}</p>
        <div class="row" style="margin-top:14px">
          <button class="btn" onclick="pushCloud()">Save to cloud</button>
          <button class="btn ghost" onclick="pullCloud(true)">Load from cloud</button>
        </div>
        <div id="syncmsg"></div>
        <hr class="divide">
        <div class="row"><button class="chip" onclick="testSupabase()">Test the connection</button>
        <button class="btn ghost sm" onclick="sbSignOut()">Sign out</button></div>
        <div id="sbtest"></div>
      </div>
      <div class="card">
        <span class="eyebrow">Live group study</span>
        <h3 style="margin-bottom:6px">Run a session</h3>
        <p style="color:var(--ink-soft);font-size:.88rem">Everyone answers the same question at once and you see the tally live. Good for club workshops.</p>
        <a class="btn mark" href="#/group" style="margin-top:10px">Open group study</a>
      </div>
    </div>`;
  }
  return topbar() + `
  <div class="page-head fade"><span class="eyebrow">Optional</span><h1>Sign in</h1>
  <p>You do not need an account to use StudyBuddy. Signing in syncs your progress across devices and unlocks live group study.</p></div>
  <div class="card" style="max-width:440px">
    <label class="fld"><span>Email</span><input type="text" id="authEmail" placeholder="you@school.edu"></label>
    <label class="fld"><span>Password</span><input type="password" id="authPass" placeholder="at least 6 characters" onkeydown="if(event.key==='Enter')sbSignIn()"></label>
    <div class="row">
      <button class="btn" onclick="sbSignIn()">Sign in</button>
      <button class="btn ghost" onclick="sbSignUp()">Create account</button>
    </div>
    <div id="authmsg"></div>
    <hr class="divide">
    <button class="chip" onclick="testSupabase()">Test the connection</button>
    <div id="sbtest"></div>
    <hr class="divide">
    <p style="font-size:.83rem;color:var(--ink-faint)">Prefer no account? <a href="#/settings" style="color:var(--ink)">Back up to a file</a> instead — same result, no server.</p>
  </div>`;
}
function authMsg(text, ok) {
  const el = $('#authmsg'); if (!el) return;
  el.innerHTML = `<p style="color:${ok ? 'var(--green)' : 'var(--margin)'};font-size:.85rem;margin:10px 0 0">${esc(text)}</p>`;
}
async function sbSignIn() {
  const email = $('#authEmail').value.trim(), password = $('#authPass').value;
  if (!email || !password) return authMsg('Enter an email and password.');
  authMsg('Signing in…', true);
  try {
    const c = await sbClient();
    const { error } = await c.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await pullCloud();
    location.hash = '#/account'; render();
  } catch (e) { authMsg(e.message || 'Could not sign in.'); }
}
async function sbSignUp() {
  const email = $('#authEmail').value.trim(), password = $('#authPass').value;
  if (!email || password.length < 6) return authMsg('Password needs at least 6 characters.');
  authMsg('Creating your account…', true);
  try {
    const c = await sbClient();
    const { error } = await c.auth.signUp({ email, password });
    if (error) throw error;
    authMsg('Account created. Check your email if confirmation is required, then sign in.', true);
  } catch (e) { authMsg(e.message || 'Could not create the account.'); }
}
async function sbSignOut() {
  try { const c = await sbClient(); await c.auth.signOut(); } catch (e) {}
  SB.user = null; render();
}

/* ---------------- cloud sync ---------------- */
function syncMsg(text, ok) {
  const el = $('#syncmsg'); if (!el) return;
  el.innerHTML = `<p style="color:${ok ? 'var(--green)' : 'var(--margin)'};font-size:.84rem;margin:10px 0 0">${esc(text)}</p>`;
}
async function pushCloud() {
  if (!SB.user) return;
  syncMsg('Saving…', true);
  try {
    const c = await sbClient();
    const { error } = await c.from('progress').upsert({
      user_id: SB.user.id, data: collectData(), updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
    if (error) throw error;
    store.set('sb.syncedAt', new Date().toLocaleString());
    syncMsg('Saved to your account.', true);
  } catch (e) { syncMsg('Could not save: ' + (e.message || e), false); }
}
async function pullCloud(loud) {
  if (!SB.user) return;
  if (loud) syncMsg('Loading…', true);
  try {
    const c = await sbClient();
    const { data, error } = await c.from('progress').select('data').eq('user_id', SB.user.id).maybeSingle();
    if (error) throw error;
    if (!data || !data.data) { if (loud) syncMsg('Nothing saved to this account yet.', false); return; }
    const j = data.data;
    BACKUP_KEYS.forEach(k => { if (j.data && j.data[k] !== undefined) store.set(k, j.data[k]); });
    store.set('sb.syncedAt', new Date().toLocaleString());
    if (loud) { syncMsg('Loaded. Reloading…', true); setTimeout(() => location.reload(), 800); }
  } catch (e) { if (loud) syncMsg('Could not load: ' + (e.message || e), false); }
}

/* ============================================================
   LIVE GROUP STUDY  (Supabase Realtime broadcast, no tables)
   ============================================================ */
const GROUP = { channel: null, code: '', host: false, q: null, tally: {}, answered: false, name: '' };
function vGroup() {
  if (!sbConfigured()) return vAccount();
  if (GROUP.channel) return groupRoomHTML();
  const all = COURSES.concat(customCourses()).filter(c => !c.outlineOnly);
  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Group study</span>
    <h1>Everyone answers together</h1>
    <p>One person hosts and pushes questions to the room. Everyone else joins with the code and answers on their own device. The host sees the tally as it comes in.</p>
  </div>
  <div class="grid g2" style="align-items:start">
    <div class="card">
      <span class="eyebrow">Join a room</span>
      <h3 style="margin-bottom:10px">Got a code?</h3>
      <label class="fld"><span>Your name</span><input type="text" id="gname" placeholder="First name"></label>
      <label class="fld"><span>Room code</span><input type="text" id="gcode" placeholder="ABCD" maxlength="6" style="text-transform:uppercase;font-family:'IBM Plex Mono',monospace;letter-spacing:.2em"></label>
      <button class="btn" onclick="joinRoom()">Join</button>
      <div id="gmsg"></div>
    </div>
    <div class="card">
      <span class="eyebrow">Host a room</span>
      <h3 style="margin-bottom:10px">Run the session</h3>
      <label class="fld"><span>Questions from</span>
        <select id="gunit">
          ${all.map(c => `<optgroup label="${esc(c.name)}">${c.units.filter(u => (u.quiz || []).length).map(u =>
            `<option value="${c.id}|${u.id}">${esc(u.title)}</option>`).join('')}</optgroup>`).join('')}
        </select>
      </label>
      <button class="btn mark" onclick="hostRoom()">Start hosting</button>
    </div>
  </div>`;
}
function roomCode() { return Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join(''); }
async function openChannel(code) {
  const c = await sbClient();
  const ch = c.channel('study-' + code, { config: { broadcast: { self: false } } });
  ch.on('broadcast', { event: 'question' }, ({ payload }) => {
    GROUP.q = payload; GROUP.answered = false; GROUP.tally = {};
    render();
  });
  ch.on('broadcast', { event: 'answer' }, ({ payload }) => {
    if (!GROUP.host) return;
    GROUP.tally[payload.name] = payload.pick;
    render();
  });
  ch.on('broadcast', { event: 'end' }, () => { leaveRoom(true); });
  await ch.subscribe();
  GROUP.channel = ch; GROUP.code = code;
  return ch;
}
async function hostRoom() {
  const sel = $('#gunit').value;
  if (!sel) return;
  const [cid, uid] = sel.split('|');
  const u = findUnit(findCourse(cid), uid);
  GROUP.host = true; GROUP.pool = prepQuestions(u.quiz); GROUP.idx = -1;
  try { await openChannel(roomCode()); render(); }
  catch (e) { $('#gmsg') && ($('#gmsg').innerHTML = `<p style="color:var(--margin);font-size:.85rem">${esc(e.message)}</p>`); }
}
async function joinRoom() {
  const code = ($('#gcode').value || '').trim().toUpperCase();
  GROUP.name = ($('#gname').value || 'Student').trim().slice(0, 20);
  if (code.length < 4) { $('#gmsg').innerHTML = `<p style="color:var(--margin);font-size:.85rem">Enter the 4-letter code.</p>`; return; }
  GROUP.host = false;
  try { await openChannel(code); render(); }
  catch (e) { $('#gmsg').innerHTML = `<p style="color:var(--margin);font-size:.85rem">${esc(e.message)}</p>`; }
}
function nextGroupQuestion() {
  GROUP.idx++;
  const q = GROUP.pool[GROUP.idx];
  if (!q) { GROUP.q = null; render(); return; }
  GROUP.q = { q: q.q, c: q.c, a: q.a, why: q.why, n: GROUP.idx + 1, total: GROUP.pool.length };
  GROUP.tally = {};
  GROUP.channel.send({ type: 'broadcast', event: 'question', payload: { ...GROUP.q, a: undefined, why: undefined } });
  render();
}
function groupAnswer(i) {
  if (GROUP.answered) return;
  GROUP.answered = i;
  GROUP.channel.send({ type: 'broadcast', event: 'answer', payload: { name: GROUP.name, pick: i } });
  render();
}
function leaveRoom(silent) {
  if (GROUP.channel) {
    if (GROUP.host && !silent) GROUP.channel.send({ type: 'broadcast', event: 'end', payload: {} });

<script>
/* ============================================================
   COVERAGE COUNTING
   A written unit titled "Units 5-6 - ..." covers two catalog
   units. Counting raw units made finished courses look unfinished,
   so counts are computed from what is actually covered.
   ============================================================ */
function unitKeys(title) {
  const m = String(title).match(/^\s*(units?|periods?|big idea|content area)\s+([\d\s,\u2013\u2014-]+)/i);
  if (!m) return new Set();
  const kind = m[1].toLowerCase().replace(/s$/, '');
  const out = new Set();
  m[2].split(',').forEach(part => {
    const r = part.trim().match(/^(\d+)\s*[\u2013\u2014-]\s*(\d+)$/);
    if (r) { for (let i = +r[1]; i <= +r[2]; i++) out.add(kind + ':' + i); }
    else { const n = part.trim().match(/\d+/); if (n) out.add(kind + ':' + n[0]); }
  });
  return out;
}
function coverage(c) {
  const outline = c.outline || [];
  if (!outline.length) return { done: c.units.length, total: c.units.length, complete: !!c.units.length };
  const written = new Set(), titles = c.units.map(u => u.title.toLowerCase());
  c.units.forEach(u => unitKeys(u.title).forEach(k => written.add(k)));
  let done = 0;
  outline.forEach(t => {
    if (titles.some(w => w === t.toLowerCase())) { done++; return; }
    const ks = unitKeys(t);
    if (ks.size && [...ks].every(k => written.has(k))) done++;
  });
  return { done, total: outline.length, complete: done >= outline.length };
}

/* course tiles and headers now report coverage */
const _courseTile = courseTile;
courseTile = function (c) {
  const html = _courseTile(c);
  if (c.outlineOnly) return html;
  const cv = coverage(c);
  return html.replace(/<span>\d+ of \d+ units written<\/span>/,
    `<span>${cv.complete ? 'all ' + cv.total + ' units' : cv.done + ' of ' + cv.total + ' units'}</span>`);
};
const _vCourse = vCourse;
vCourse = function (cid) {
  const c = findCourse(cid);
  const html = _vCourse(cid);
  if (!c || c.outlineOnly) return html;
  const cv = coverage(c);
  return html.replace(/<span class="eyebrow">([^<]*?) · \d+ units written(?: of \d+)?<\/span>/,
    `<span class="eyebrow">$1 · ${cv.complete ? 'complete · all ' + cv.total + ' units' : cv.done + ' of ' + cv.total + ' units written'}</span>`);
};

<script>
/* ============================================================
   MATH RENDERING
   Formulas are written between @@ markers in a small LaTeX subset and
   rendered as real stacked fractions, radicals, and integrals. No
   library and no network, so it still works offline.

   Supported: \frac{}{}  \sqrt{}  \int \sum \lim with _{} ^{}
              x^{} x_{}  \text{}  and the common Greek and operators.
   ============================================================ */
const MSYM = {
  pi:'π', theta:'θ', Theta:'Θ', Delta:'Δ', delta:'δ', alpha:'α', beta:'β',
  gamma:'γ', Gamma:'Γ', mu:'μ', nu:'ν', sigma:'σ', Sigma:'Σ', omega:'ω',
  Omega:'Ω', rho:'ρ', lambda:'λ', Lambda:'Λ', phi:'φ', Phi:'Φ', epsilon:'ε',
  tau:'τ', chi:'χ', psi:'ψ', eta:'η', kappa:'κ',
  le:'≤', ge:'≥', ne:'≠', neq:'≠', pm:'±', mp:'∓', times:'×', cdot:'·',
  div:'÷', to:'→', infty:'∞', approx:'≈', propto:'∝', partial:'∂',
  cdots:'⋯', ldots:'…', in:'∈', deg:'°', prime:'′', ell:'ℓ', bar:'‾'
};
const BIGOP = { int: '∫', sum: 'Σ', prod: '∏', lim: 'lim' };

function mathHTML(src) {
  let i = 0, out = '';
  function readGroup() {
    while (src[i] === ' ') i++;
    if (src[i] === '{') {
      i++; let depth = 1; const start = i;
      while (i < src.length && depth > 0) {
        if (src[i] === '{') depth++;
        else if (src[i] === '}') depth--;
        i++;
      }
      return mathHTML(src.slice(start, i - 1));
    }
    if (src[i] === '\\') {
      const s = i; i++;
      while (i < src.length && /[A-Za-z]/.test(src[i])) i++;
      return mathHTML(src.slice(s, i));
    }
    return src[i++] || '';
  }
  while (i < src.length) {
    const ch = src[i];
    if (ch === '\\') {
      i++;
      if (src[i] === ',' || src[i] === ' ') { i++; out += '<span class="mthin"></span>'; continue; }
      const s = i;
      while (i < src.length && /[A-Za-z]/.test(src[i])) i++;
      const cmd = src.slice(s, i);
      if (cmd === 'frac') {
        const n = readGroup(), d = readGroup();
        out += `<span class="mfrac"><span class="mnum">${n}</span><span class="mden">${d}</span></span>`;
      } else if (cmd === 'sqrt') {
        const r = readGroup();
        out += `<span class="msqrt"><span class="mrad">√</span><span class="mund">${r}</span></span>`;
      } else if (cmd === 'text') {
        out += `<span class="mtext">${readGroup()}</span>`;
      } else if (BIGOP[cmd]) {
        let sub = '', sup = '';
        while (src[i] === '_' || src[i] === '^') {
          const k = src[i++]; const g = readGroup();
          if (k === '_') sub = g; else sup = g;
        }
        const limits = (sub || sup)
          ? `<span class="mlim"><span class="msup">${sup}</span><span class="msub">${sub}</span></span>` : '';
        out += `<span class="mop mop-${cmd}"><span class="mglyph">${BIGOP[cmd]}</span>${limits}</span>`;
      } else if (MSYM[cmd] !== undefined) {
        out += MSYM[cmd];
      } else {
        out += cmd;
      }
    } else if (ch === '^' || ch === '_') {
      i++;
      const g = readGroup();
      out += ch === '^' ? `<sup>${g}</sup>` : `<sub>${g}</sub>`;
    } else {
      out += src[i++];
    }
  }
  return out;
}

/* replace @@...@@ spans in a string that is already HTML-safe.
   '$' is deliberately not the delimiter: the economics content is full of
   dollar amounts and they would be parsed as formulas. */
function mathify(s) {
  if (!s || s.indexOf('@@') === -1) return s;
  return String(s).replace(/@@([^@]+)@@/g, (_, expr) =>
    `<span class="math">${mathHTML(expr)}</span>`);
}
/* the two entry points used everywhere text is emitted */
function fx(s) { return mathify(esc(s)); }      // untrusted text: escape then render
function fxRaw(s) { return mathify(s); }         // authored guide HTML

/* ---- retro-fit the existing views so formulas render everywhere ---- */
(function applyMath() {
  /* render() calls sweepMath directly — see the router. Wrapping it here
     would not work, because the hashchange listener holds a reference to
     the original function and would bypass any wrapper. */
  const _paintCard = paintCard;
  paintCard = function () {
    _paintCard();
    sweepMath(document.getElementById('deckwrap'));
  };
  const _paintQuiz = paintQuiz;
  paintQuiz = function () {
    _paintQuiz();
    sweepMath(document.getElementById('qwrap'));
  };
})();

/* Walk text nodes and upgrade any $...$ that survived into the DOM.
   Text nodes are already escaped by the browser, so this is safe. */
function sweepMath(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!n.nodeValue || n.nodeValue.indexOf('@@') === -1) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if (!p || p.closest('.math') || p.tagName === 'TEXTAREA' ||
          p.tagName === 'INPUT' || p.tagName === 'SCRIPT') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const hits = [];
  let n; while ((n = walker.nextNode())) hits.push(n);
  hits.forEach(node => {
    if (!/@@[^@]+@@/.test(node.nodeValue)) return;
    const span = document.createElement('span');
    span.innerHTML = mathify(esc(node.nodeValue));
    node.parentNode.replaceChild(span, node);
  });
}
</script>
<script>
/* ============================================================
   MISTAKE TRACKING
   Every question you get wrong is saved with the reason you missed
   it. Getting it right later clears it. This is the single highest
   value thing a study app can do, so it is wired into every quiz
   mode: unit quizzes, practice tests, and master reviews.
   ============================================================ */
function qid(text) {
  let h = 5381;
  const s = String(text);
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return 'q' + h.toString(36);
}
const Missed = {
  all() { return store.get('sb.missed', {}); },
  save(m) { store.set('sb.missed', m); },
  count() { return Object.keys(this.all()).length },
  add(q) {
    const m = this.all(), k = qid(q.q);
    const prev = m[k];
    m[k] = {
      q: q.q, c: q.c, a: q.a, why: q.why,
      cid: q._c || null, uid: q._u || null,
      cn: q._cn || '', un: q._un || '',
      n: (prev ? prev.n : 0) + 1,
      last: today()
    };
    this.save(m);
  },
  clear(qText) {
    const m = this.all(), k = qid(qText);
    if (m[k]) { delete m[k]; this.save(m); return true; }
    return false;
  },
  wipe() { this.save({}); }
};

/* hook into the shared answer handler */
const _answer = answer;
answer = function (i) {
  if (QZ && !QZ.answered) {
    const q = QZ.qs[QZ.i];
    if (q) { if (i === q.a) Missed.clear(q.q); else Missed.add(q); }
  }
  return _answer(i);
};

/* carry course and unit ids through shuffling so mistakes know their home */
prepQuestions = function (list) {
  return shuffle(list).map(q => {
    const pairs = q.c.map((t, i) => ({ t, correct: i === q.a }));
    const mixed = shuffle(pairs);
    return {
      q: q.q, c: mixed.map(p => p.t), a: mixed.findIndex(p => p.correct), why: q.why,
      tag: q._cn ? q._cn + ' · ' + q._un : '',
      _c: q._c || q.cid || null, _u: q._u || q.uid || null,
      _cn: q._cn || q.cn || '', _un: q._un || q.un || ''
    };
  });
};

/* unit quizzes need to stamp their own course and unit */
const _vQuiz = vQuiz;
vQuiz = function (cid, uid) {
  const c = findCourse(cid), u = findUnit(c, uid);
  if (!u || !(u.quiz || []).length) return notFound();
  store.set('sb.last', { c: cid, u: uid });
  const stamped = u.quiz.map(q => Object.assign({}, q, { _c: cid, _u: uid, _cn: c.short, _un: u.title }));
  QZ = { cid, uid, title: u.title, sub: c.name, qs: prepQuestions(stamped), i: 0, right: 0, marks: [], answered: false, timed: false, test: false };
  setTimeout(paintQuiz, 0);
  return topbar() + `<a class="crumb" href="#/course/${cid}">← ${esc(c.name)}</a><div id="qwrap"></div>`;
};
/* master review the same */
courseQuestions = function (cid) {
  const c = findCourse(cid);
  if (!c) return [];
  const out = [];
  c.units.forEach(u => (u.quiz || []).forEach(q =>
    out.push(Object.assign({}, q, { _c: cid, _u: u.id, _cn: c.short, _un: u.title }))));
  return out;
};

/* ---------------- mistakes view ---------------- */
function vMistakes() {
  const m = Missed.all();
  const items = Object.entries(m).map(([k, v]) => Object.assign({ k }, v));
  if (!items.length) {
    return topbar() + `
    <div class="page-head fade"><span class="eyebrow">Mistake book</span><h1>Nothing to fix</h1>
    <p>Questions you miss land here automatically, with the explanation attached. Get one right later and it clears itself.</p></div>
    <div class="empty"><div class="big">◔</div><p>Take a quiz and this page starts filling in.</p>
    <a class="btn" href="#/courses">Pick a course</a></div>`;
  }
  items.sort((a, b) => b.n - a.n);
  const byCourse = {};
  items.forEach(it => { const key = it.cn || 'Other'; (byCourse[key] = byCourse[key] || []).push(it); });
  const repeat = items.filter(i => i.n > 1).length;
  return topbar() + `
  <div class="page-head fade">
    <span class="eyebrow">Mistake book</span>
    <h1>${items.length} question${items.length > 1 ? 's' : ''} to <span class="hl">fix</span></h1>
    <p>Every question you have missed, with the explanation you needed. Answer one correctly anywhere in the app and it disappears from this list.</p>
  </div>
  <div class="card" style="margin-bottom:20px">
    <div class="spread">
      <div class="row" style="gap:28px">
        <div class="stat"><b>${items.length}</b><span>open mistakes</span></div>
        <div class="stat"><b>${repeat}</b><span>missed twice or more</span></div>
        <div class="stat"><b>${Object.keys(byCourse).length}</b><span>courses affected</span></div>
      </div>
      <div class="row">
        <button class="btn mark" onclick="retryMistakes(0)">Retry all ${items.length}</button>
        ${repeat ? `<button class="btn ghost" onclick="retryMistakes(2)">Just the repeats</button>` : ''}
        <a class="btn ghost" href="#/print/mistakes">Print worksheet</a>
      </div>
    </div>
  </div>
  ${Object.entries(byCourse).map(([cn, list]) => `
    <span class="eyebrow" style="margin-top:22px">${esc(cn)} · ${list.length}</span>
    <div style="margin-bottom:10px">
      ${list.map(it => `<div class="card" style="margin-bottom:10px;border-left:3px solid var(--margin)">
        <div class="spread" style="align-items:flex-start;margin-bottom:6px">
          <span class="eyebrow" style="margin:0">${esc(it.un || '')}</span>
          <span class="tag">${it.n > 1 ? `missed ${it.n}×` : 'missed once'}</span>
        </div>
        <p style="font-weight:600;margin-bottom:6px">${esc(it.q)}</p>
        <p style="margin-bottom:6px;font-size:.92rem"><b>Answer:</b> ${esc(it.c[it.a])}</p>
        <div class="why" style="margin:0 0 10px">${esc(it.why)}</div>
        <div class="row">
          ${it.cid && it.uid && findUnit(findCourse(it.cid), it.uid) ? `<a class="btn ghost sm" href="#/study/${it.cid}/${it.uid}/guide">Reread the guide</a>` : ''}
          <button class="chip" onclick="dropMistake('${it.k}')">I know this now</button>
        </div>
      </div>`).join('')}
    </div>`).join('')}`;
}
function dropMistake(k) {
  const m = Missed.all(); delete m[k]; Missed.save(m); render();
}
function retryMistakes(minN) {
  const items = Object.values(Missed.all()).filter(v => v.n > (minN ? 1 : 0));
  if (!items.length) return;
  QZ = {
    cid: null, uid: null, title: `${items.length} question${items.length > 1 ? 's' : ''} you have missed`,
    sub: 'Mistake book', qs: prepQuestions(items), i: 0, right: 0, marks: [], answered: false,
    timed: false, test: false
  };
  view().innerHTML = topbar() + `<a class="crumb" href="#/mistakes">← Mistake book</a><div id="qwrap"></div>`;
  paintQuiz();
}

/* ============================================================
   AI UNIT GENERATION
   Writes a study guide, flashcards, and a quiz for any catalogued
   unit. Requires an API key: there is no honest way to invent
   accurate AP content without a model behind it.
   ============================================================ */
function syncCustomUnits() {
  COURSES.forEach(c => { c.units = c.units.filter(u => !u.mine); });
  S.custom.filter(d => d.courseId).forEach(d => {
    const c = COURSES.find(x => x.id === d.courseId);
    if (!c) return;
    c.units.push({
      id: 'my-' + d.id, title: d.name, guide: d.guide || [], cards: d.cards || [],
      quiz: d.quiz || [], mine: true, aiMade: !!d.aiMade
    });
  });
  COURSES.forEach(c => { if (c.outlineOnly && c.units.length) c.outlineOnly = false; });
}

let GEN = { busy: false };
async function generateUnit(cid, unitTitle, btn) {
  const c = findCourse(cid);
  if (!S.cfg.key) { location.hash = '#/settings'; return; }
  if (GEN.busy) return;
  GEN.busy = true;
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try {
    const raw = await askClaude(
      [{ role: 'user', content: `Course: ${c.formal || c.name}\nUnit: ${unitTitle}` }],
      `You write study material for AP students. For the course and unit given, reply with ONLY a JSON object, no markdown fences and no preamble, shaped exactly:
{"guide":[{"h":"section heading","points":["bullet with <b>key term</b> tags around important terms"]}],"cards":[["term","definition"]],"quiz":[{"q":"question","c":["A","B","C","D"],"a":0,"why":"one or two sentences explaining why"}]}

Write 3-4 guide sections of 4-6 bullets each, 10-14 flashcards, and 6-8 multiple-choice questions. Match the actual College Board content for this specific unit. Make wrong answers plausible misconceptions students really hold. "a" is the index of the correct choice. Be accurate above all: if you are unsure of a fact, leave it out.`);
    const j = parseJSON(raw);
    if (!j || !j.cards || !j.quiz) throw new Error('could not read the response');
    const list = S.custom;
    list.push({
      id: String(Date.now()), courseId: cid, name: unitTitle,
      guide: j.guide || [], cards: j.cards, quiz: j.quiz,
      aiMade: true, note: 'Written by Claude — check it against your textbook.'
    });
    S.custom = list;
    syncCustomUnits();
    GEN.busy = false;
    location.hash = '#/course/' + cid;
    render();
  } catch (e) {
    GEN.busy = false;
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Try again';
      const row = btn.closest('.card') || btn.parentElement;
      if (row && !row.querySelector('.gen-err')) {
        row.insertAdjacentHTML('beforeend',
          `<p class="gen-err" style="color:var(--margin);font-size:.78rem;margin:8px 0 0">Could not write it: ${esc(e.message)}. Check your key in Settings.</p>`);
      }
    }
  }
}

/* outline units get a Generate button when a key is present */
const _outlineSection = outlineSection;
outlineSection = function (c) {
  const html = _outlineSection(c);
  if (!html) return html;
  if (!S.cfg.key) {
    return html.replace('</div>\n  </div>',
      '</div>\n  </div>') +
      `<div class="note" style="margin-top:14px;max-width:64ch">Add a Claude API key in <a href="#/settings" style="color:var(--ink)"><b>Settings</b></a> and a <b>Write it for me</b> button appears on every unit above — it drafts the guide, flashcards, and quiz for you.</div>`;
  }
  return html.replace(/<a class="btn ghost sm" href="#\/tutor\?for=([^"]+)">Build it<\/a>/g,
    (m, enc) => {
      const full = decodeURIComponent(enc);
      const unit = full.split(' — ').slice(1).join(' — ') || full;
      return `<div class="row" style="gap:6px;flex-wrap:nowrap">
        <button class="btn sm" onclick="generateUnit('${c.id}',${JSON.stringify(unit).replace(/"/g, '&quot;')},this)">Write it for me</button>
        <a class="btn ghost sm" href="#/tutor?for=${enc}">My notes</a>
      </div>`;
    });
};

/* AI-written units are labelled everywhere they appear */
const _vGuide = vGuide;
vGuide = function (cid, uid) {
  const html = _vGuide(cid, uid);
  const u = findUnit(findCourse(cid), uid);
  if (u && u.aiMade) {
    return html.replace('<p class="lede">',
      '<div class="note" style="margin:0 0 18px"><b>Written by Claude, not checked by a human.</b> It is a solid starting point, but verify anything you plan to rely on against your textbook or the official course description.</div><p class="lede">');
  }
  return html;
};

};
