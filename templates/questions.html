<!DOCTYPE html>
<html>
<head>
    <title>Study Questions</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Generate Study Questions</h1>

<form method="POST">
    <textarea name="text" placeholder="Paste text here..."></textarea>
    <button type="submit">Generate</button>
</form>

{% if questions %}
<h2>Questions:</h2>
<pre>{{ questions }}</pre>
{% endif %}
</body>
</html>
