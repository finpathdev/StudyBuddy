<!DOCTYPE html>
<html>
<head>
    <title>Flashcards</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Generate Flashcards</h1>

<form method="POST">
    <textarea name="text" placeholder="Paste text here..."></textarea>
    <button type="submit">Generate</button>
</form>

{% if cards %}
<h2>Flashcards:</h2>
<pre>{{ cards }}</pre>
{% endif %}
</body>
</html>
