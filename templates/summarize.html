<!DOCTYPE html>
<html>
<head>
    <title>Summarize</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Summarize Text</h1>

<form method="POST">
    <textarea name="text" placeholder="Paste text here..."></textarea>
    <button type="submit">Summarize</button>
</form>

{% if summary %}
<h2>Summary:</h2>
<p>{{ summary }}</p>
{% endif %}
</body>
</html>
